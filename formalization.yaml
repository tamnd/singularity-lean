# The metadata of this formalization. The keys follow the formalization.yaml schema of version 0.4 that resolutionorg/hironaka uses.
version: "0.4"
project:
  name: singularity-lean
  description: Statements in Lean 4 of resolution of singularities in characteristic p > 0, the known cases, and the work on the open case of dimension 4 and higher.
  authors:
    - The singularity authors
  responsible_maintainers:
    - tamnd
  license: Apache-2.0
sources:
  - title: Resolution of singularities of an algebraic variety over a field of characteristic zero
    authors: [Heisuke Hironaka]
    id: "singularity:Hir64"
    type: paper
    location: Annals of Mathematics 79 (1964)
    relationship: background
    note: The case of characteristic 0. The statements here use the same form of a resolution.
    author_endorsement: false
  - title: Resolution of singularities of threefolds in positive characteristic II
    authors: [Vincent Cossart, Olivier Piltant]
    id: "singularity:CP09"
    type: paper
    location: Journal of Algebra 321 (2009)
    relationship: background
    note: The case of dimension 3 in each characteristic p > 0. Not formalized here yet.
    author_endorsement: false
  - title: resolutionorg/hironaka, commit 044d89c9455859446fc5e986667319f910e15f4b
    authors: [The resolutionorg contributors]
    id: "singularity:hironaka"
    type: code
    location: https://github.com/resolutionorg/hironaka
    relationship: dependency
    note: The base package in base/ depends on it for Main Theorem I in characteristic 0. No file is copied.
    author_endorsement: false
  - title: google-deepmind/formal-conjectures, FormalConjectures/Wikipedia/ResolutionOfSingularities.lean
    authors: [The Formal Conjectures Authors]
    id: "singularity:formal-conjectures"
    type: code
    location: https://github.com/google-deepmind/formal-conjectures
    relationship: copied
    note: The definition Scheme.HasResolution is copied to Singularity/Bridge/FormalConjectures.lean under the Apache License 2.0.
    author_endorsement: false
classification:
  arxiv: [math.AG]
  msc2020: [14E15, 14B05, 13H05]
status:
  scope: statements
  sorry_count: 0
  sorry_in_definitions: false
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - name: Singularity.ResolutionDimFourCharP
      kind: statement
      status: open
      note: This is a definition of a proposition. The package does not prove it.
    - name: Singularity.ResolutionOfSingularities
      kind: statement
      status: open
    - name: Singularity.PurelyInseparableHypersurfaceResolution
      kind: statement
      status: open
      note: Open for n at least 4.
    - name: Singularity.EmbeddedResolutionSurface
      kind: statement
      status: known
      note: The theorem of Cossart, Jannsen and Saito, for a regular scheme of finite type over a field. This is a definition of a proposition. The package does not prove it.
    - name: Singularity.Fidelity.isEmbeddedResolution_id_top
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.not_isSncDivisor_bot
      kind: theorem
      status: proved
    - name: Singularity.isPermissible_vanishingIdeal_singleton
      kind: theorem
      status: proved
    - name: Singularity.isSncDivisor_of_codim_one
      kind: theorem
      status: proved
    - name: Singularity.isEmbeddedResolution_id_of_codim_one
      kind: theorem
      status: proved
    - name: Singularity.localUniformization_abhyankar
      kind: statement
      status: known
      note: The theorem of Knaf-Kuhlmann, for an Abhyankar valuation with a separable residue field (node SG0000001E). This is a definition of a proposition. The package does not prove it.
    - name: Singularity.localUniformization_inseparable
      kind: statement
      status: known
      note: The theorem of Temkin, local uniformization after a finite purely inseparable extension of the function field that depends on the model (node SG0000001G). This is a definition of a proposition. The package does not prove it.
    - name: Singularity.localUniformization_three
      kind: statement
      status: known
      note: The theorem of Cossart-Piltant, local uniformization in transcendence degree 3 in characteristic p > 0 (node SG0000001F). This is a definition of a proposition. The package does not prove it.
    - name: Singularity.LocalUniformizationFour
      kind: statement
      status: open
      note: Local uniformization in transcendence degree 4 in characteristic p > 0 (node SG0000001H).
    - name: Singularity.resolution_of_localUniformization_four
      kind: statement
      status: open
      note: Local uniformization in transcendence degree at most 4 gives resolution in dimension 4 (node SG0000001J).
    - name: Singularity.Fidelity.hasLocalUniformization_top
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.algebraMap_mem_of_hasLocalUniformization
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.isFunctionField_of_hasLocalUniformization
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.exists_regularCenter_of_hasLocalUniformization
      kind: theorem
      status: proved
    - name: Singularity.hasLocalUniformization_of_trdeg_le_one
      kind: theorem
      status: proved
      note: Local uniformization in transcendence degree at most 1, over a field of each characteristic (the paragraph after Definition 4.1.1 of Volume 3 of the handbook). The model is the integral closure of an affine model that contains the given finite set.
    - name: Singularity.localUniformizationInDim_zero
      kind: theorem
      status: proved
    - name: Singularity.localUniformizationInDim_one
      kind: theorem
      status: proved
    - name: Singularity.hasLocalUniformization_of_essFiniteType
      kind: theorem
      status: proved
      note: A valuation ring that is essentially of finite type over k has local uniformization (part 1 of Proposition 4.1.8 of Volume 3 of the handbook).
    - name: Singularity.essFiniteType_of_trdeg_le_trdeg_residueField_add_one
      kind: theorem
      status: proved
      note: If the transcendence degree of K is at most the transcendence degree of the residue field plus 1, then the valuation ring is essentially of finite type over k (part 2 of Proposition 4.1.8 of Volume 3 of the handbook).
    - name: Singularity.hasLocalUniformization_of_trdeg_le_trdeg_residueField_add_one
      kind: theorem
      status: proved
    - name: Singularity.hasLocalUniformization_of_divisorial
      kind: theorem
      status: proved
      note: Each divisorial valuation of a function field has local uniformization, in each characteristic (part 3 of Proposition 4.1.8 of Volume 3 of the handbook).
    - name: Singularity.abhyankar_inequality
      kind: theorem
      status: proved
      note: The inequality of Abhyankar for a valuation subring that contains the base field (Theorem 2.1.5 of Volume 3 of the handbook, node SG0000000Y).
    - name: Singularity.algebraicIndependent_sumElim_of_valuationSubring
      kind: theorem
      status: proved
    - name: Singularity.algebraicIndependent_sumElim_of_hasExtension
      kind: theorem
      status: proved
      note: Theorem 2.1.4 of Volume 3 of the handbook, for families of each size.
    - name: Singularity.abhyankar_inequality_relative
      kind: theorem
      status: proved
      note: The relative value group is the image of the value group of vL in the quotient of the units of the value monoid by the value group of the restriction of vL to K.
    - name: Singularity.ZariskiRiemann.compactSpace
      kind: theorem
      status: proved
      note: The Zariski-Riemann space of the valuation subrings of K that contain the image of A is quasi-compact (Theorem 1.5.3 of Volume 3 of the handbook, node SG0000000X).
    - name: Singularity.KeyPolynomial.natDegree_pos
      kind: theorem
      status: proved
      note: A key polynomial of MacLane has positive degree (Definition 3.3.3 of Volume 3 of the handbook, node SG0000000Z). The definition Singularity.KeyPolynomial states the conditions on initial forms with polynomials.
    - name: Singularity.monomialValuationFun_mul
      kind: theorem
      status: proved
      note: The monomial valuation [v; X, γ] is multiplicative (Lemma 3.3.2 of Volume 3 of the handbook).
    - name: Singularity.keyPolynomial_X_of_forall_eq
      kind: theorem
      status: proved
      note: The polynomial X is a key polynomial for the monomial valuation [v; X, γ].
    - name: Singularity.eq_sum_expansionCoeff
      kind: theorem
      status: proved
      note: The expansion of a polynomial in powers of a monic polynomial of positive degree, used to define the augmented valuation of Definition 3.3.4.
    - name: Singularity.KeyPolynomial.augmentedValuationFun_mul
      kind: theorem
      status: proved
      note: The augmented valuation [μ; φ, γ] of a key polynomial φ is multiplicative, so Singularity.augmentedValuation is a valuation (Theorem 3.3.5 (1) of Volume 3 of the handbook, MacLane-Vaquié). The theorem takes γ ≤ μ φ in multiplicative notation.
    - name: Singularity.augmentedValuation_le
      kind: theorem
      status: proved
      note: The inequality μ ≤ [μ; φ, γ] in additive notation (Theorem 3.3.5 (2) of Volume 3 of the handbook).
    - name: Singularity.isMuMinimal_iff
      kind: theorem
      status: proved
      note: A monic polynomial φ of positive degree is μ-minimal if and only if μ of a φ-expansion is the minimum of the values of its terms, in additive notation.
    - name: Singularity.KeyPolynomial.keyPolynomial_of_forall_eq
      kind: theorem
      status: proved
      note: A key polynomial φ for μ is a key polynomial for each valuation with the values of the augmentation [μ; φ, γ] (Theorem 3.3.5 (3) of Volume 3 of the handbook, first claim).
    - name: Singularity.KeyPolynomial.keyPolynomial_augmentedValuation
      kind: theorem
      status: proved
      note: A key polynomial φ for μ is a key polynomial for the augmented valuation [μ; φ, γ], for each γ ≤ μ φ in multiplicative notation (Theorem 3.3.5 (3), first claim). The description of the graded algebra in part 3 and part 4 of Theorem 3.3.5 are not proved.
    - name: Singularity.keyPolynomial_of_map_lt
      kind: theorem
      status: proved
      note: The step of MacLane-Vaquié, part (a). If μ ≤ ν in additive notation and φ is monic of least degree with μ(φ) < ν(φ), then φ is a key polynomial for μ (Lemma 3.3.9 of Volume 3 of the handbook).
    - name: Singularity.muDvd_iff_map_lt
      kind: theorem
      status: proved
      note: Under the hypotheses of the step of MacLane, φ μ-divides f if and only if μ(f) < ν(f) in additive notation.
    - name: Singularity.map_le_augmentedValuationFun_of_map_eq
      kind: theorem
      status: proved
      note: The step of MacLane-Vaquié, part (b). The augmentation [μ; φ, ν(φ)] is at most ν in additive notation if ν and μ agree in degree less than the degree of φ.
    - name: Singularity.exists_monic_map_lt
      kind: theorem
      status: proved
      note: If μ ≤ ν agree on the constants and μ ≠ ν, then there is a monic φ of least degree with μ(φ) < ν(φ) in additive notation.
    - name: Singularity.exists_keyPolynomial_augmentedValuation
      kind: theorem
      status: proved
      note: The step of MacLane-Vaquié (Lemma 3.3.9 of Volume 3 of the handbook). For μ ≤ ν with μ ≠ ν there is a key polynomial φ for μ with μ ≤ [μ; φ, ν(φ)] ≤ ν in additive notation. Part 4 of Theorem 3.3.5 is not proved.
    - name: Singularity.map_le_monomialValuationFun
      kind: theorem
      status: proved
      note: The first step of the chain of MacLane. If ν extends v, then [v; X, ν(X)] ≤ ν in additive notation.
    - name: Singularity.coeff_taylor_eq_sum
      kind: theorem
      status: proved
      note: The translation formula. The coefficient of z^d in f(z + h) is the sum over e of (e choose d) b_e h^(e-d), where b_e is the coefficient of z^e in f.
    - name: Singularity.projPolyhedron_taylor_monomial_subset
      kind: theorem
      status: proved
      note: The projected Newton polyhedron of f(z + c x^β) over k[[x]] lies in the convex hull of the polyhedron of f and β plus the orthant [Hir67].
    - name: Singularity.vertexPoly_taylor_monomial
      kind: theorem
      status: proved
      note: The initial polynomial at v of f(z + c x^v) is the initial polynomial of f at v, shifted by c.
    - name: Singularity.projPolyhedron_taylor_ssubset_of_isSolvable
      kind: theorem
      status: proved
      note: If a vertex v of the projected Newton polyhedron is solvable with the constant c, then the translation z to z - c x^v gives a polyhedron that is a proper subset and does not contain v [Hir67].
    - name: Singularity.not_isSolvableVertex_of_charPolyhedron_eq
      kind: theorem
      status: proved
      note: One direction of the vertex criterion of Hironaka [Hir67]. If the projected Newton polyhedron is the characteristic polyhedron, then no vertex v other than 0 is solvable. The converse is not proved.
    - name: Singularity.augmentedValuationFun_lt_iff_map_lt
      kind: theorem
      status: proved
      note: Under the hypotheses of the step of MacLane, the augmentation μ' = [μ; φ, ν(φ)] changes the value of f if and only if μ(f) < ν(f) in additive notation.
    - name: Singularity.map_lt_map_of_natDegree_eq
      kind: theorem
      status: proved
      note: If the next key polynomial ψ of the chain of MacLane has the same degree as φ, then ν(φ) < ν(ψ) in additive notation.
    - name: Singularity.natDegree_le_of_map_lt_augmentedValuationFun
      kind: theorem
      status: proved
      note: The degrees of the key polynomials of the chain of MacLane do not decrease.
    - name: Singularity.eventually_eq_of_succ_lt
      kind: theorem
      status: proved
      note: The limit principle of MacLane. If the value group of ν is discrete of rank 1 and the values μₙ(f) increase strictly while μₙ(f) < ν(f), then μₙ(f) = ν(f) for all large n if ν(f) is finite.
    - name: Singularity.eventually_le_of_succ_lt
      kind: theorem
      status: proved
      note: The limit principle of MacLane for the support of ν. Under the same hypotheses, the values μₙ(f) become larger than each finite value at most ν(f) in additive notation.
    - name: Singularity.macLaneChain_eventually_eq
      kind: theorem
      status: proved
      note: The theorem of MacLane (part 4 of Theorem 3.3.5 of Volume 3 of the handbook, without limit augmentations). If ν extends v and the value group of ν is discrete of rank 1, then ν is the limit of the chain of MacLane. The chain need not be finite.
    - name: Singularity.exists_macLaneChain_eq
      kind: theorem
      status: proved
      note: If the value group of ν is discrete of rank 1 and the degrees and the finite values of the key polynomials of the chain of MacLane are bounded, then the chain is finite and ends with ν.
    - name: Singularity.map_macLaneChainKey_succ_lt
      kind: theorem
      status: proved
      note: In the chain of MacLane, key polynomials of the same degree have strictly increasing values ν(φᵢ) in additive notation.
    - name: Singularity.natDegree_macLaneChainKey_le_of_map_eq_zero
      kind: theorem
      status: proved
      note: If ν(F) = ∞ for some F ≠ 0, then the key polynomials of the chain of MacLane have degree at most the degree of F.
    - name: Singularity.residualOrderAlong_pointChart_le
      kind: theorem
      status: proved
      note: Moh's bound for one point blowup (Theorem 1.4.1 of Volume 7 of the handbook). The residual order along the transformed divisor goes up by at most p^(e-1), in the given coordinates, over any field of characteristic p, without the hypothesis ord F' ≥ q.
    - name: Singularity.residualOrderAlong_pointChart_le_of_not_dvd
      kind: theorem
      status: proved
      note: If q = p^e does not divide ord F, the residual order along the divisor does not go up under a point blowup chart.
    - name: Singularity.moh_bound_holds
      kind: theorem
      status: proved
      note: The proposition Singularity.moh_bound holds.
    - name: Singularity.natDegree_eq_of_map_lt
      kind: theorem
      status: proved
      note: Two monic polynomials of least degree with μ(f) < ν(f) in additive notation have the same degree.
    - name: Singularity.muEquiv_iff_map_lt
      kind: theorem
      status: proved
      note: The choice of the key polynomial in the step of MacLane. A monic ψ of the degree of φ has μ(ψ) < ν(ψ) in additive notation if and only if ψ is μ-equivalent to φ.
    - name: Singularity.muEquiv_macLaneChainKey_iff
      kind: theorem
      status: proved
      note: The key polynomials of the chain of MacLane are unique up to μᵢ-equivalence among the monic polynomials of their degree.
    - name: Singularity.map_sub_le_of_map_le
      kind: theorem
      status: proved
      note: If ν(ψ) ≤ ν(φ) in additive notation, then μ(ψ - φ) ≥ ν(ψ).
    - name: Singularity.augmentedValuation_eq_of_map_sub_le
      kind: theorem
      status: proved
      note: Key polynomials φ and ψ of the same degree with μ(ψ - φ) ≥ γ in additive notation give the same augmentation [μ; φ, γ] = [μ; ψ, γ].
    - name: Singularity.KeyPolynomial.augmentedValuationFun_eq_of_map_sub_le
      kind: theorem
      status: proved
      note: The function form of augmentedValuation_eq_of_map_sub_le.
    - name: Singularity.augmentedValuation_le_of_map_le
      kind: theorem
      status: proved
      note: The augmentation of the step of MacLane depends on the choice of the key polynomial. If μ(ψ) < ν(ψ) ≤ ν(φ) in additive notation, then [μ; ψ, ν(ψ)] ≤ [μ; φ, ν(φ)]. The inequality can be strict.
    - name: Singularity.augmentedValuationFun_le_of_map_le
      kind: theorem
      status: proved
      note: The function form of augmentedValuation_le_of_map_le.
    - name: Singularity.augmentedValuation_eq_of_map_eq
      kind: theorem
      status: proved
      note: If ν(φ) = ν(ψ), then the two choices give the same augmentation of the step of MacLane.
    - name: Singularity.KeyPolynomial.muEquiv_augmentedValuation_sum_filter
      kind: theorem
      status: proved
      note: Theorem 3.3.5 (3) of MacLane-Vaquié, the graded algebra in elementwise form. Each f is μ'-equivalent to the sum of the terms of its φ-expansion of least value, so gr_{μ'} is generated by in(φ) over the initial forms of degree less than the degree of φ.
    - name: Singularity.KeyPolynomial.augmentedValuationFun_sub_sum_filter_lt
      kind: theorem
      status: proved
      note: The function form of KeyPolynomial.muEquiv_augmentedValuation_sum_filter.
    - name: Singularity.KeyPolynomial.augmentedValuation_sum_mul_pow
      kind: theorem
      status: proved
      note: Theorem 3.3.5 (3) of MacLane-Vaquié, the transcendence of in(φ) in elementwise form. The value of a sum of terms cⱼφ^j with deg cⱼ < deg φ is the least value of a term in additive notation.
    - name: Singularity.coeff_pow_expChar_pow_eq_zero
      kind: theorem
      status: proved
      note: In exponential characteristic p, every exponent of the power series φ^(p^e) lies in p^e ℕ^n.
    - name: Singularity.taylor_X_pow_add_C
      kind: theorem
      status: proved
      note: In exponential characteristic p and with q = p^e, the change of coordinate z to z + φ sends z^q + F to z^q + (φ^q + F).
    - name: Singularity.projPolyhedron_X_pow_add_C_coe
      kind: theorem
      status: proved
      note: For a polynomial F and n at least 1, the projected Newton polyhedron of z^n + F is (1/n) N(F), where N(F) is the Newton polyhedron of F.
    - name: Singularity.charPolyhedron_X_pow_add_C_of_clean
      kind: theorem
      status: proved
      note: The converse direction of the vertex criterion of Hironaka [Hir67] for z^q + F with q = p^e over a nontrivial commutative ring of exponential characteristic p. If no exponent of F lies in q ℕ^n, then Δ(f; x) = Δ(f; x; z). The converse direction for a general f is not proved.
    - name: Singularity.charPolyhedron_X_pow_add_C_eq_smul_newtonPolyhedron
      kind: theorem
      status: proved
      note: For q = p^e and a clean polynomial F, the characteristic polyhedron of z^q + F is (1/q) N(F), where N(F) is the Newton polyhedron of F.
    - name: Singularity.not_isSolvableVertex_of_clean
      kind: theorem
      status: proved
      note: For z^q + F with q = p^e and F clean, no vertex v other than 0 of the projected Newton polyhedron is solvable.
    - name: Singularity.ContinuousFamily.stableValue_eq_of_isStable
      kind: theorem
      status: proved
      note: For a continuous family μᵢ ≤ ν that agrees with ν in degree less than d, the limit value of a stable polynomial is its value for ν.
    - name: Singularity.ContinuousFamily.exists_not_isStable_iff
      kind: theorem
      status: proved
      note: Some polynomial is not stable for a continuous family below ν if and only if the family does not reach ν, that is some f has μᵢ(f) ≠ ν(f) for each i.
    - name: Singularity.ContinuousFamily.exists_isLimitKeyPolynomial
      kind: theorem
      status: proved
      note: If some polynomial is not stable for a continuous family, then a limit key polynomial exists, a monic unstable polynomial of least degree.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitDvd_iff
      kind: theorem
      status: proved
      note: A limit key polynomial divides f in the limit if and only if f is not stable.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_add_le_max
      kind: theorem
      status: proved
      note: The limit augmentation of Vaquié satisfies the ultrametric inequality.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_mul
      kind: theorem
      status: proved
      note: The limit augmentation of Vaquié [μ_∞; φ, γ] is multiplicative for γ ≥ μᵢ(φ) for each i in additive notation, so it is a valuation.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_le
      kind: theorem
      status: proved
      note: Each valuation μᵢ of the continuous family is at most the limit augmentation [μ_∞; φ, γ] in additive notation.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.map_le_limitAugmentedValuationFun
      kind: theorem
      status: proved
      note: The limit augmentation [μ_∞; φ, γ] is at most ν in additive notation if γ ≤ ν(φ).
    - name: Singularity.X_add_C_pow_pow_mul
      kind: theorem
      status: proved
      note: The Frobenius form of the translation, (X + c)^(p^e m_0) = (X^(p^e) + c^(p^e))^(m_0), over a commutative semiring of exponential characteristic p.
    - name: Singularity.cast_choose_pow_mul_eq_zero
      kind: theorem
      status: proved
      note: If p^e does not divide n, then binom(p^e m_0, n) = 0 in a semiring of exponential characteristic p. This replaces the theorem of Lucas.
    - name: Singularity.coeff_taylor_natDegree_sub
      kind: theorem
      status: proved
      note: The translation formula a'_i = sum over j <= i of binom(m - j, i - j) a_j c^(i-j), for i <= m, with a_i the coefficient of z^(m-i).
    - name: Singularity.coeff_taylor_sub_of_lt_pow
      kind: theorem
      status: proved
      note: The inseparable layer is rigid (Theorem 4.1.3 of Volume 7 of the handbook). For deg f = p^e m_0 and 0 < i < p^e, a'_i = a_i + sum over 0 < j < i of binom(m - j, i - j) a_j c^(i-j).
    - name: Singularity.coeff_taylor_sub_of_lt_pow_of_eq_zero
      kind: theorem
      status: proved
      note: If a_1 = ... = a_(i-1) = 0 and 0 < i < p^e, then the translation z to z + c does not change a_i.
    - name: Singularity.coeff_taylor_natDegree_sub_one
      kind: theorem
      status: proved
      note: If the prime p divides the degree of f, then the translation z to z + c does not change a_1.
    - name: Singularity.coeff_taylor_sub_pow
      kind: theorem
      status: proved
      note: The step of Lucas and Tschirnhausen (Proposition 4.1.4 of Volume 7 of the handbook). For monic f of degree p^e m_0, a'_(p^e) = a_(p^e) + m_0 c^(p^e) + sum over 0 < j < p^e of binom(m - j, p^e - j) a_j c^(p^e - j).
    - name: Singularity.coeff_taylor_sub_pow_of_eq_zero
      kind: theorem
      status: proved
      note: If a_1 = ... = a_(p^e - 1) = 0, then the translation z to z + c adds m_0 c^(p^e) to a_(p^e).
    - name: Singularity.X_pow_add_C_mem_pow_iff
      kind: theorem
      status: proved
      note: The lifting test (Proposition 4.2.1 of Volume 7 of the handbook). For q = p^e, z^q + g lies in (z - h, I)^q if and only if g + h^q lies in I^q.
    - name: Singularity.logJacobian_add_pow
      kind: theorem
      status: proved
      note: The log-Jacobian ideal does not change when a p-th power is added to g (Lemma 3.1.2 of Volume 7 of the handbook).
    - name: Singularity.logJacobian_monomial_mul
      kind: theorem
      status: proved
      note: If r is supported in the divisor, the log-Jacobian ideal of x^r G is x^r times the residual log-Jacobian ideal of G.
    - name: Singularity.residualLogJacobian_not_le_span_X
      kind: theorem
      status: proved
      note: For a clean g other than 0, the residual log-Jacobian ideal is not contained in (x_i) for a boundary coordinate x_i (Theorem 3.1.4 (1) of Volume 7 of the handbook).
    - name: Singularity.le_divisorExponent_of_logJacobian_le
      kind: theorem
      status: proved
      note: For a clean g other than 0, the monomial factor of the log-Jacobian ideal is the monomial factor x^r of g.
    - name: Singularity.logJacobianOrder_le_residualOrderAlong
      kind: theorem
      status: proved
      note: For a clean g, the order rho of the residual log-Jacobian ideal is at most the residual order d along the divisor.
    - name: Singularity.residualOrderAlong_le_logJacobianOrder_add_one
      kind: theorem
      status: proved
      note: For a clean g, the residual order d along the divisor is at most rho + 1.
    - name: Singularity.logJacobianOrder_eq_or
      kind: theorem
      status: proved
      note: For a clean g, rho = d or rho + 1 = d. This is the dichotomy (Theorem 3.1.4 (2) of Volume 7 of the handbook).
    - name: Singularity.logJacobianOrder_add_one_eq_iff
      kind: theorem
      status: proved
      note: For a clean g with ord G = d, rho + 1 = d if and only if the derivative of the initial form of G along some free coordinate is not 0 (Theorem 3.1.4 (3) of Volume 7 of the handbook).
    - name: Singularity.isSingularPoint_purelyInseparable_iff
      kind: theorem
      status: proved
      note: The point (z, v) is a singular point of z^p + h if and only if z^p + h(v) = 0 and v is a critical point of h, over a commutative semiring of characteristic p.
    - name: Singularity.exists_isSingularPoint_purelyInseparable_iff
      kind: theorem
      status: proved
      note: Over a perfect reduced ring of characteristic p, some z ≠ 0 makes (z, v) a singular point of z^p + h if and only if h(v) ≠ 0 and v is a critical point of h.
    - name: Singularity.exists_torus_isCriticalPoint_iff
      kind: theorem
      status: proved
      note: Theorem 3.3.3 of Volume 7 of the handbook, face by face. The polynomial h has a critical point in the torus if and only if {h = 0} or {z^p + h = 0} has a singular point in the torus. The faces of the Newton polyhedron of z^p + g are not formalized.
    - name: Singularity.eq_sum_smul_X_mul_pderiv
      kind: theorem
      status: proved
      note: Proposition 3.3.6 of Volume 7 of the handbook. If the sum of w_i a_i is 1 for each exponent a of h, then h is the sum of w_i x_i ∂_i h.
    - name: Singularity.eq_inv_smul_sum_X_mul_pderiv
      kind: theorem
      status: proved
      note: Corollary 3.3.7 of Volume 7 of the handbook. A weighted homogeneous h of degree D with D ≠ 0 in k is D⁻¹ times the sum of w_i x_i ∂_i h.
    - name: Singularity.eval_eq_zero_of_isCriticalPoint_of_isWeightedHomogeneous
      kind: theorem
      status: proved
      note: A critical point of a weighted homogeneous h of degree D with D ≠ 0 in k lies on {h = 0}.
    - name: Singularity.pderiv_monomial_eq_zero_of_dvd
      kind: theorem
      status: proved
      note: Corollary 3.3.5 of Volume 7 of the handbook. Each partial derivative of c x^a with a in p ℕ^σ is 0 in characteristic p.
    - name: Singularity.exists_torus_isSingularPoint_purelyInseparable_monomial
      kind: theorem
      status: proved
      note: Over a perfect reduced ring of characteristic p, z^p + c x^a with c ≠ 0 and a in p ℕ^σ has a singular point in the torus.
    - name: Singularity.exists_eq_sum_smul_X_mul_pderiv_of_not_isResonant
      kind: theorem
      status: proved
      note: Definition 3.3.8 of Volume 7 of the handbook. A polynomial with a support that is not resonant satisfies a mod p Euler identity.
    - name: Singularity.eval_eq_zero_of_isCriticalPoint_of_not_isResonant
      kind: theorem
      status: proved
      note: A critical point of a polynomial with a support that is not resonant lies on its zero set.
    - name: Singularity.not_isResonant_of_isWeightedHomogeneous
      kind: theorem
      status: proved
      note: A weighted homogeneous polynomial of degree D with p not dividing D has a support that is not resonant.
    - name: Singularity.not_isResonant_initialForm
      kind: theorem
      status: proved
      note: The initial form of g for w is not resonant if p does not divide the weighted order of g.
    - name: Singularity.pderiv_pointChart_of_ne
      kind: theorem
      status: proved
      note: The chain rule for the x_j-chart pi of a point blowup. For i other than j, the derivative of pi(h) along x_i is x_j pi(d_i h) (Lemma 3.2.2 of Volume 7, Section 3.2 of the handbook).
    - name: Singularity.X_mul_pderiv_pointChart
      kind: theorem
      status: proved
      note: The chain rule for the x_j-chart pi of a point blowup. The equation is x_j d_j pi(h) = pi(sum of x_i d_i h) (Lemma 3.2.2 of Volume 7, Section 3.2 of the handbook).
    - name: Singularity.pderiv_X_pow_mul_of_ne
      kind: theorem
      status: proved
      note: For i other than j, d_i(x_j^n u) = x_j^n d_i u.
    - name: Singularity.X_mul_pderiv_X_pow_mul
      kind: theorem
      status: proved
      note: In characteristic p, x_j d_j (x_j^p u) = x_j^p x_j d_j u.
    - name: Singularity.map_pointChart_logJacobianTangent_le
      kind: theorem
      status: proved
      note: The chart sends the log-Jacobian ideal tangent to the origin of g into the log-Jacobian ideal of pi(g) for the new divisor.
    - name: Singularity.span_mul_logJacobian_pointChart_le
      kind: theorem
      status: proved
      note: The unit u of the translated directions times the log-Jacobian ideal of pi(g) for the new divisor lies in the image of the log-Jacobian ideal tangent to the origin of g.
    - name: Singularity.map_pointChart_logJacobianTangent_le_span_mul
      kind: theorem
      status: proved
      note: The transformation law, first inclusion (Theorem 3.2.3 of Volume 7, Section 3.2 of the handbook). If pi(g) = x_j^p g', the image of the log-Jacobian ideal tangent to the origin of g lies in (x_j^p) times the log-Jacobian ideal of g' for the new divisor.
    - name: Singularity.span_mul_logJacobian_le_map_pointChart
      kind: theorem
      status: proved
      note: The transformation law, second inclusion (Theorem 3.2.3 of Volume 7, Section 3.2 of the handbook). If pi(g) = x_j^p g', then (x_j^p u) times the log-Jacobian ideal of g' for the new divisor lies in the image of the log-Jacobian ideal tangent to the origin of g. The polynomial u is a unit in the power series ring.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_monomial
      kind: theorem
      status: proved
      note: In several variables, D^α (r x^β) = binom(β, α) r x^(β - α), with binom(β, α) the product of the binomial coefficients of the coordinates.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_zero
      kind: theorem
      status: proved
      note: The operator D^0 is the identity.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_C
      kind: theorem
      status: proved
      note: The operator D^α kills the constants for α ≠ 0.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_X
      kind: theorem
      status: proved
      note: The values of D^α on a variable x_i are x_i for α = 0, 1 for α = e_i, and 0 otherwise.
    - name: Singularity.Algebra.MvHasse.uniqueAlgEquiv_hasseDeriv
      kind: theorem
      status: proved
      note: In one variable, D^α is the Hasse derivative Polynomial.hasseDeriv of Mathlib (Proposition 6.3.2 of Volume 1 of the handbook).
    - name: Singularity.Algebra.MvHasse.hasseDeriv_single_one
      kind: theorem
      status: proved
      note: The operator D^(e_i) is the partial derivative with respect to x_i.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_mul
      kind: theorem
      status: proved
      note: The Leibniz rule for the Hasse-Schmidt derivatives in several variables, with a sum over the antidiagonal of α.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_comp
      kind: theorem
      status: proved
      note: The composition rule D^α D^β = binom(α + β, α) D^(α + β).
    - name: Singularity.Algebra.MvHasse.coeff_hasseDeriv
      kind: theorem
      status: proved
      note: The coefficient of x^γ in D^α f is binom(γ + α, α) times the coefficient of x^(γ + α) in f.
    - name: Singularity.Algebra.MvHasse.constantCoeff_hasseDeriv
      kind: theorem
      status: proved
      note: The value of D^α f at the origin is the coefficient of x^α in f.
    - name: Singularity.Algebra.MvHasse.le_ord_iff_hasseDeriv
      kind: theorem
      status: proved
      note: The order of f at the origin is at least d if and only if (D^α f)(0) = 0 for each α with |α| < d.
    - name: Singularity.Algebra.MvHasse.taylor_eq_sum
      kind: theorem
      status: proved
      note: The Taylor formula f(x + y) = sum of (D^α f)(x) y^α in several variables.
    - name: Singularity.Algebra.MvHasse.coeff_aeval_X_add_C
      kind: theorem
      status: proved
      note: The coefficient of y^α in f(a + y) is (D^α f)(a).
    - name: Singularity.Algebra.MvHasse.aeval_X_add_C_eq_sum
      kind: theorem
      status: proved
      note: The Taylor formula at a point a, f(a + y) = sum of (D^α f)(a) y^α.
    - name: Singularity.Algebra.MvHasse.le_ord_aeval_X_add_C_iff
      kind: theorem
      status: proved
      note: The order of f at a point a is at least d if and only if (D^α f)(a) = 0 for each α with |α| < d (Proposition 1.1.4 of Volume 7 of the handbook).
    - name: Singularity.Algebra.MvHasse.exists_expand_eq_iff
      kind: theorem
      status: proved
      note: A polynomial is a polynomial in the x_i^q if and only if q divides each exponent of each of its monomials.
    - name: Singularity.Algebra.MvHasse.exists_expand_eq_iff_hasseDeriv
      kind: theorem
      status: proved
      note: The test for q-th powers. Over a semiring of characteristic p, with q = p^e, f is a polynomial in the x_i^q if and only if D^α f = 0 for each α ≠ 0 with α_i < q for each i. The proof uses the theorem of Lucas.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_expand_mul
      kind: theorem
      status: proved
      note: For α with α_i < q = p^e for each i, D^α (g(x^q) f) = g(x^q) D^α f in characteristic p (the first claim of Theorem 6.3.6 of Volume 1 of the handbook).
    - name: Singularity.monomial_one_dvd_iff
      kind: theorem
      status: proved
      note: The monomial x^b divides f if and only if each monomial of f is divisible by x^b.
    - name: Singularity.monomial_one_dvd_of_dvd_mul
      kind: theorem
      status: proved
      note: If x^b divides u f and the constant term of u is not 0, then x^b divides f. Each variable is prime and does not divide u.
    - name: Singularity.dvd_pointChart_of_monomial_one_dvd
      kind: theorem
      status: proved
      note: If x^r divides h and the order of h is at least |r| + c, then x_j^(|r| + c) x^e divides pi(h), with e the exponent of the factors x_l of pi(x^r) for l other than j with t_l = 0.
    - name: Singularity.map_pointChart_span_le
      kind: theorem
      status: proved
      note: If each generator of an ideal is divisible by x^r and has order at least |r| + c, then the image of the ideal under the chart pi lies in the ideal of x_j^(|r| + c) x^e.
    - name: Singularity.constantCoeff_blowupUnit_ne_zero
      kind: theorem
      status: proved
      note: The constant term of the unit u of the transformation law is not 0.
    - name: Singularity.le_idealOrd_logJacobianTangent
      kind: theorem
      status: proved
      note: The order of the log-Jacobian ideal tangent to the origin of g is at least the order of g.
    - name: Singularity.logJacobianOrder_le_of_mem
      kind: theorem
      status: proved
      note: For a clean g other than 0, let x^b divide the log-Jacobian ideal of g with b supported in the divisor. If an element phi of the ideal has order at most |b| + n, then rho(g) is at most n.
    - name: Singularity.logJacobianOrder_cleanPart_le
      kind: theorem
      status: proved
      note: rho does not go up (Theorem 3.2.4 of Volume 7, Section 3.2 of the handbook). For a clean g other than 0 with ord g at least p and pi(g) = x_j^p g', the clean part of g' is not 0 and its rho for the new divisor is at most rho(g).
    - name: Singularity.residualOrderAlong_pointChart_le_logJacobianOrder
      kind: theorem
      status: proved
      note: Corollary 3.2.5 of Volume 7, Section 3.2 of the handbook. The residual orders satisfy d' at most rho(g'_c) + 1, rho(g'_c) + 1 at most rho + 1, and rho + 1 at most d + 1.
    - name: Singularity.residualOrderAlong_pointChart_le_add_one
      kind: theorem
      status: proved
      note: The residual order goes up by at most one under a point blowup (Corollary 3.2.5 of Volume 7, Section 3.2 of the handbook).
    - name: Singularity.Fidelity.isResolution_id
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.not_isResolution_codiag
      kind: theorem
      status: proved
    - name: Singularity.resolutionInDim_dim_zero
      kind: theorem
      status: proved
    - name: Singularity.purelyInseparableHypersurfaceResolution_of_resolutionInDim
      kind: theorem
      status: proved
    - name: Singularity.purelyInseparableHypersurfaceResolution_four
      kind: theorem
      status: proved
    - name: Singularity.Base.integralResolutionInDim_zero
      kind: theorem
      status: proved
      note: In the package base/. It depends on resolutionorg/hironaka.
    - name: Singularity.resolutionInDim_zero
      kind: theorem
      status: proved
      note: In the package base/. It takes Singularity.ReductionToIntegral as a hypothesis.
    - name: Singularity.resolutionInDim_charZero
      kind: theorem
      status: proved
      note: In the package base/. It applies resolutionInDim_zero to Singularity.Reduction.reductionToIntegral, so it takes no hypothesis.
    - name: Singularity.Reduction.reductionToIntegral
      kind: theorem
      status: proved
    - name: Singularity.Curves.resolutionInDim_one
      kind: theorem
      status: proved
    - name: Singularity.Base.fcResolutionInDim_of_resolutionInDim
      kind: theorem
      status: proved
      note: In the package base/. The bridge to formal-conjectures in one direction.
    - name: Singularity.Base.fcResolutionCharZero
      kind: theorem
