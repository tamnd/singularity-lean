name: sandbox-test

on:
  push:
    branches: [trust-base-sandbox]

permissions:
  contents: read

jobs:
  comparator-base:
    name: lake comparator --paranoid on SingularityBase
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true
      # The sandbox of the comparator hides the home directories, binds the project directory base read-only and lets only base/.lake be written. The base package requires Singularity at the path "..", which is outside the sandbox. This step copies the sources of Singularity into base/.lake/singularity-src and changes the path of the require to that directory, so that the comparator builds Singularity in the sandbox too.
      - name: put Singularity in the sandbox
        run: |
          mkdir -p .lake/singularity-src
          cp -R ../Singularity ../Singularity.lean ../lakefile.toml ../lean-toolchain ../comparator .lake/singularity-src/
          sed -i 's|^path = "\.\."$|path = ".lake/singularity-src"|' lakefile.toml
          grep -q '^path = ".lake/singularity-src"$' lakefile.toml
      # The Mathlib cache writes lake-manifest.json, which the comparator needs.
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: read the pin of the base
        id: pin
        run: |
          rev=$(grep -A3 'name = "hironaka"' lakefile.toml | sed -n 's/^rev = "\(.*\)"/\1/p')
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          mods=$(grep -h '^import Hironaka' SingularityBase/*.lean | sort -u | sha256sum | cut -c1-16)
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
      - name: restore the build of the base
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base/.lake/packages/hironaka/.lake/build
          key: hironaka-${{ steps.pin.outputs.rev }}-${{ hashFiles('lean-toolchain') }}-${{ steps.pin.outputs.mods }}
          restore-keys: hironaka-${{ steps.pin.outputs.rev }}-${{ hashFiles('lean-toolchain') }}
      - name: compare
        run: |
          start=$(date +%s)
          lake comparator --paranoid
          echo "the comparator took $(( $(date +%s) - start )) s"
