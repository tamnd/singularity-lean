name: trust

# Replay each declaration of the two packages in the Lean kernel, in a fresh environment, with leanchecker of the toolchain. The replay covers the imports too: Mathlib, and for the base package the modules of resolutionorg/hironaka that it imports. This is check Q3 of spec 14 in part. leanchecker uses the kernel of Lean itself, so it finds an environment that a tactic or a metaprogram has changed, but it is not an independent kernel.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: leanchecker --fresh Singularity
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: replay
        run: |
          start=$(date +%s)
          lake env leanchecker --fresh Singularity
          echo "the replay took $(( $(date +%s) - start )) s"

  base:
    name: leanchecker --fresh SingularityBase
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: read the pin of the base
        id: pin
        run: |
          rev=$(grep -A3 'name = "hironaka"' lakefile.toml | sed -n 's/^rev = "\(.*\)"/\1/p')
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          mods=$(grep -h '^import Hironaka' SingularityBase/*.lean | sort -u | sha256sum | cut -c1-16)
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
      - name: restore the build of the base
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base/.lake/packages/hironaka/.lake/build
          key: hironaka-${{ steps.pin.outputs.rev }}-${{ hashFiles('lean-toolchain') }}-${{ steps.pin.outputs.mods }}
          restore-keys: hironaka-${{ steps.pin.outputs.rev }}-${{ hashFiles('lean-toolchain') }}
      - name: build
        run: |
          mapfile -t mods < <(grep -h '^import Hironaka' SingularityBase/*.lean | sed 's/^import //' | sort -u)
          lake build "${mods[@]}"
          lake build SingularityBase
      - name: replay
        run: |
          start=$(date +%s)
          lake env leanchecker --fresh SingularityBase
          echo "the replay took $(( $(date +%s) - start )) s"
