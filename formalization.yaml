# The metadata of this formalization. The keys follow the formalization.yaml schema of version 0.4 that resolutionorg/hironaka uses.
version: "0.4"
project:
  name: singularity-lean
  description: Statements in Lean 4 of resolution of singularities in characteristic p > 0, the known cases, and the work on the open case of dimension 4 and higher.
  authors:
    - The singularity authors
  responsible_maintainers:
    - tamnd
  license: Apache-2.0
sources:
  - title: Resolution of singularities of an algebraic variety over a field of characteristic zero
    authors: [Heisuke Hironaka]
    id: "singularity:Hir64"
    type: paper
    location: Annals of Mathematics 79 (1964)
    relationship: background
    note: The case of characteristic 0. The statements here use the same form of a resolution.
    author_endorsement: false
  - title: Resolution of singularities of threefolds in positive characteristic II
    authors: [Vincent Cossart, Olivier Piltant]
    id: "singularity:CP09"
    type: paper
    location: Journal of Algebra 321 (2009)
    relationship: background
    note: The case of dimension 3 in each characteristic p > 0. Not formalized here yet.
    author_endorsement: false
  - title: resolutionorg/hironaka, commit 044d89c9455859446fc5e986667319f910e15f4b
    authors: [The resolutionorg contributors]
    id: "singularity:hironaka"
    type: code
    location: https://github.com/resolutionorg/hironaka
    relationship: dependency
    note: The base package in base/ depends on it for Main Theorem I in characteristic 0. No file is copied.
    author_endorsement: false
  - title: google-deepmind/formal-conjectures, FormalConjectures/Wikipedia/ResolutionOfSingularities.lean
    authors: [The Formal Conjectures Authors]
    id: "singularity:formal-conjectures"
    type: code
    location: https://github.com/google-deepmind/formal-conjectures
    relationship: copied
    note: The definition Scheme.HasResolution is copied to Singularity/Bridge/FormalConjectures.lean under the Apache License 2.0.
    author_endorsement: false
classification:
  arxiv: [math.AG]
  msc2020: [14E15, 14B05, 13H05]
status:
  scope: statements
  sorry_count: 0
  sorry_in_definitions: false
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - name: Singularity.ResolutionDimFourCharP
      kind: statement
      status: open
      note: This is a definition of a proposition. The package does not prove it.
    - name: Singularity.ResolutionOfSingularities
      kind: statement
      status: open
    - name: Singularity.PurelyInseparableHypersurfaceResolution
      kind: statement
      status: open
      note: Open for n at least 4.
    - name: Singularity.EmbeddedResolutionSurface
      kind: statement
      status: known
      note: The theorem of Cossart, Jannsen and Saito, for a regular scheme of finite type over a field. This is a definition of a proposition. The package does not prove it.
    - name: Singularity.Fidelity.isEmbeddedResolution_id_top
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.not_isSncDivisor_bot
      kind: theorem
      status: proved
    - name: Singularity.isPermissible_vanishingIdeal_singleton
      kind: theorem
      status: proved
    - name: Singularity.isSncDivisor_of_codim_one
      kind: theorem
      status: proved
    - name: Singularity.isEmbeddedResolution_id_of_codim_one
      kind: theorem
      status: proved
    - name: Singularity.localUniformization_abhyankar
      kind: statement
      status: known
      note: The theorem of Knaf-Kuhlmann, for an Abhyankar valuation with a separable residue field (node SG0000001E). This is a definition of a proposition. The package does not prove it.
    - name: Singularity.localUniformization_inseparable
      kind: statement
      status: known
      note: The theorem of Temkin, local uniformization after a finite purely inseparable extension of the function field that depends on the model (node SG0000001G). This is a definition of a proposition. The package does not prove it.
    - name: Singularity.localUniformization_three
      kind: statement
      status: known
      note: The theorem of Cossart-Piltant, local uniformization in transcendence degree 3 in characteristic p > 0 (node SG0000001F). This is a definition of a proposition. The package does not prove it.
    - name: Singularity.LocalUniformizationFour
      kind: statement
      status: open
      note: Local uniformization in transcendence degree 4 in characteristic p > 0 (node SG0000001H).
    - name: Singularity.resolution_of_localUniformization_four
      kind: statement
      status: open
      note: Local uniformization in transcendence degree at most 4 gives resolution in dimension 4 (node SG0000001J).
    - name: Singularity.Fidelity.hasLocalUniformization_top
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.algebraMap_mem_of_hasLocalUniformization
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.isFunctionField_of_hasLocalUniformization
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.exists_regularCenter_of_hasLocalUniformization
      kind: theorem
      status: proved
    - name: Singularity.hasLocalUniformization_of_trdeg_le_one
      kind: theorem
      status: proved
      note: Local uniformization in transcendence degree at most 1, over a field of each characteristic (the paragraph after Definition 4.1.1 of Volume 3 of the handbook). The model is the integral closure of an affine model that contains the given finite set.
    - name: Singularity.localUniformizationInDim_zero
      kind: theorem
      status: proved
    - name: Singularity.localUniformizationInDim_one
      kind: theorem
      status: proved
    - name: Singularity.hasLocalUniformization_of_essFiniteType
      kind: theorem
      status: proved
      note: A valuation ring that is essentially of finite type over k has local uniformization (part 1 of Proposition 4.1.8 of Volume 3 of the handbook).
    - name: Singularity.essFiniteType_of_trdeg_le_trdeg_residueField_add_one
      kind: theorem
      status: proved
      note: If the transcendence degree of K is at most the transcendence degree of the residue field plus 1, then the valuation ring is essentially of finite type over k (part 2 of Proposition 4.1.8 of Volume 3 of the handbook).
    - name: Singularity.hasLocalUniformization_of_trdeg_le_trdeg_residueField_add_one
      kind: theorem
      status: proved
    - name: Singularity.hasLocalUniformization_of_divisorial
      kind: theorem
      status: proved
      note: Each divisorial valuation of a function field has local uniformization, in each characteristic (part 3 of Proposition 4.1.8 of Volume 3 of the handbook).
    - name: Singularity.latticeLemma_real_of_pos
      kind: theorem
      status: proved
      note: The lattice lemma for positive real weights that are linearly independent over the integers (Volume 5, Lemma 2.1.4 of the handbook, in rank 1).
    - name: Singularity.latticeLemma_real
      kind: theorem
      status: proved
      note: The lattice lemma for real weights that are linearly independent over the integers, of any sign (Volume 5, Lemma 2.1.4 of the handbook, in rank 1, node SG0000004D).
    - name: Singularity.hasLocalUniformization_of_isMonomialValuation_of_lattice
      kind: theorem
      status: proved
      note: A monomial valuation has local uniformization if the lattice lemma holds for its values (Volume 5, Theorem 2.1.5 of the handbook, with Lemma 2.1.4 as a hypothesis).
    - name: Singularity.hasLocalUniformization_of_isMonomialValuation_of_rankOne
      kind: theorem
      status: proved
      note: A monomial valuation of rank 1 with residue field k has local uniformization, in each characteristic (Volume 5, Theorem 2.1.5 of the handbook, in rank 1, node SG0000004D).
    - name: Singularity.latticeLemma
      kind: theorem
      status: proved
      note: The lattice lemma for a free abelian group of finite rank with a total order compatible with addition, for each rank (Volume 5, Lemma 2.1.4 of the handbook, node SG0000004D).
    - name: Singularity.latticeLemma_of_injective
      kind: theorem
      status: proved
      note: The lattice lemma for the integer vectors with the order of an injective map to an ordered group, in the form of two inverse integer matrices (Volume 5, Lemma 2.1.4 of the handbook).
    - name: Singularity.hasLocalUniformization_of_isMonomialValuation
      kind: theorem
      status: proved
      note: A monomial valuation has local uniformization, for each rank and in each characteristic (Volume 5, Theorem 2.1.5 of the handbook, node SG0000004D).
    - name: Singularity.IsMonomialValuation.isAbhyankarValuation
      kind: theorem
      status: proved
      note: A monomial valuation is an Abhyankar valuation (Volume 5, Lemma 2.1.2 of the handbook).
    - name: Singularity.IsMonomialValuation.existsUnique_valuation_eq
      kind: theorem
      status: proved
      note: Each element of the value group of a monomial valuation is the value of exactly one Laurent monomial in the x_i, so the value group is free with basis the values of the x_i (Volume 5, Lemma 2.1.2 of the handbook, part 1).
    - name: Singularity.IsMonomialValuation.valueHom_bijective
      kind: theorem
      status: proved
      note: The map from the integer vectors to the value group of a monomial valuation, a to v(x^a), is bijective (Volume 5, Lemma 2.1.2 of the handbook, part 1).
    - name: Singularity.IsMonomialValuation.algebraMap_residueField_bijective
      kind: theorem
      status: proved
      note: The residue field of a monomial valuation of K/k is k (Volume 5, Lemma 2.1.2 of the handbook, part 2).
    - name: Singularity.HasLocalUniformization.of_intermediateField
      kind: theorem
      status: proved
      note: Let F be a subfield of K that contains k, is finitely generated over k and lies in V. Local uniformization of V over F gives local uniformization of V over k (Volume 5, Lemma 1.4.2 of the handbook, the part on the ground field, node SG0000004F).
    - name: Singularity.algebraicIndependent_of_residue
      kind: theorem
      status: proved
      note: Elements of V with residues that are algebraically independent over k are algebraically independent over k (Volume 5, Lemma 1.4.2 of the handbook).
    - name: Singularity.mem_of_mem_adjoin_residue
      kind: theorem
      status: proved
      note: If y_1, ..., y_m in V have residues that are algebraically independent over k, then k(y_1, ..., y_m) lies in V (Volume 5, Lemma 1.4.2 of the handbook).
    - name: Singularity.algebraicIndependent_residue
      kind: theorem
      status: proved
      note: If y_1, ..., y_m are algebraically independent over k and k(y_1, ..., y_m) lies in V, then their residues are algebraically independent over k.
    - name: Singularity.hasLocalUniformization_of_isMonomialValuation_adjoin
      kind: theorem
      status: proved
      note: A valuation that is trivial on k(y_1, ..., y_t) and is a monomial valuation of K over k(y) has local uniformization over k, with affine models of finite type over k (Volume 5, Corollary 2.1.6 of the handbook, node SG0000004D).
    - name: Singularity.IsMonomialValuation.isAbhyankarValuation_adjoin
      kind: theorem
      status: proved
      note: A valuation that is trivial on k(y_1, ..., y_t), with the y_i algebraically independent over k, and is a monomial valuation of K over k(y) is an Abhyankar valuation of K/k (Volume 5, Corollary 2.1.6 of the handbook).
    - name: Singularity.IsMonomialValuation.adjoin_residue_eq_top
      kind: theorem
      status: proved
      note: The residue field of a valuation that is trivial on k(y_1, ..., y_t) and is a monomial valuation of K over k(y) is generated over k by the residues of the y_i (Volume 5, Corollary 2.1.6 of the handbook).
    - name: Singularity.hasLocalUniformization_of_etaleGenerator
      kind: theorem
      status: proved
      note: If z is an étale generator of K/K_0 for V and the restriction of V to K_0 has local uniformization over k, then V has local uniformization over k (Volume 5, Theorem 1.3.4 of the handbook).
    - name: Singularity.exists_isEtaleGenerator_of_finrank_residueField_eq
      kind: theorem
      status: proved
      note: If the valuation v of K extends v_0 of K_0, [K:K_0] is finite and the residue extension is separable of degree [K:K_0], then K/K_0 is separable and there is an étale generator of K/K_0 for v. This is the case of one extension (e = d = g = 1) of Volume 5, Lemma 1.3.3, part 2 of the handbook (node SG0000004Y). The general case with g extensions is not proved.
    - name: Singularity.hasLocalUniformization_of_finrank_residueField_eq
      kind: theorem
      status: proved
      note: If the valuation v of K extends v_0 of K_0, [K:K_0] is finite, the residue extension is separable of degree [K:K_0] and v_0 has local uniformization over k, then v has local uniformization over k (Volume 5, Lemma 1.3.3 and Theorem 1.3.4 of the handbook, the case of one extension).
    - name: Singularity.hasLocalUniformization_of_monomial_of_finrank_residueField_eq
      kind: theorem
      status: proved
      note: If v extends v_0, [K:K_0] is finite, v_0 is trivial on k(y) and a monomial valuation of K_0 over k(y), and the residue extension is separable of degree [K:K_0], then v has local uniformization over k. This is Volume 5, Theorem 2.2.1 of the handbook (Knaf-Kuhlmann) in the case without ramification, defect and splitting. The general case (localUniformization_abhyankar) is not proved.
    - name: Singularity.hasLocalUniformization_of_isMonomialValuation_of_finrank_residueField_eq
      kind: theorem
      status: proved
      note: The same as hasLocalUniformization_of_monomial_of_finrank_residueField_eq for v_0 a monomial valuation of K_0 over k.
    - name: Singularity.IsAbhyankarValuation.exists_isMonomialValuation_comap
      kind: theorem
      status: proved
      note: Let V be an Abhyankar valuation of the function field K/k, with value group of rational rank r and residue field of transcendence degree t over k. Then there are nonzero x_1, ..., x_r in K with values linearly independent over the integers and y_1, ..., y_t in V with residues algebraically independent over k, such that x and y are algebraically independent over k, K is finite over K_0 = k(x, y), and the restriction of V to K_0 is trivial on k(y) and is a monomial valuation of K_0 over k(y) in the x_i. This is the choice of the subfield in the proof of Volume 5, Theorem 2.2.1 of the handbook, with values that are independent over the integers and not a basis of the value group.
    - name: Singularity.IsAbhyankarValuation.fg_residueField
      kind: theorem
      status: proved
      note: The residue field of an Abhyankar valuation of a function field K/k is finitely generated over k as a field (Volume 3, Corollary 2.2.4 of the handbook, the part on the residue field).
    - name: Singularity.IsAbhyankarValuation.finiteDimensional_residueField
      kind: theorem
      status: proved
      note: The residue field of an Abhyankar valuation is finite over k(y), where y_1, ..., y_t are elements of V whose residues are a transcendence basis of the residue field over k.
    - name: Singularity.finiteDimensional_residueField_of_residue_mem
      kind: theorem
      status: proved
      note: 'Let E be a subfield of K with [K : E] finite. Then the residue field of V is finite over each field whose image contains the residues of the elements of E in V (Volume 3, Corollary 2.1.3 of the handbook, the part on f).'
    - name: Singularity.linearIndependent_of_linearIndependent_residue
      kind: theorem
      status: proved
      note: Elements of V whose residues are linearly independent over a field that contains the residues of E are linearly independent over E.
    - name: Singularity.residue_mem_adjoin_of_mem_adjoin_sumElim
      kind: theorem
      status: proved
      note: For the subfield K_0 = k(x, y) of an Abhyankar valuation, the residue of each element of K_0 in V is in the field that the residues of the y_j generate over k.
    - name: Singularity.residue_mem_adjoin_of_mem_adjoin
      kind: theorem
      status: proved
      note: Let y_1, ..., y_t be in V with residues algebraically independent over k. Then the residue of each element of k(y) is in the field that the residues of the y_j generate over k.
    - name: Singularity.IsAbhyankarValuation.free_valueGroup
      kind: theorem
      status: proved
      note: The value group of an Abhyankar valuation of a function field K/k is a finitely generated free abelian group (Volume 3, Corollary 2.2.4 of the handbook, the part on the value group).
    - name: Singularity.IsAbhyankarValuation.exists_basis_valueGroup
      kind: theorem
      status: proved
      note: The value group of an Abhyankar valuation with rational rank r has a basis over the integers with r elements.
    - name: Singularity.finite_quotient_of_valuation_mem
      kind: theorem
      status: proved
      note: 'Let E be a subfield of K with [K : E] finite, and let H be a subgroup of the value group that contains the values of E. Then the quotient of the value group by H is finite (Volume 3, Corollary 2.1.3 of the handbook, the part on e).'
    - name: Singularity.linearIndependent_of_valuation_mul_eq
      kind: theorem
      status: proved
      note: Nonzero elements whose values are in different cosets of the values of E are linearly independent over E.
    - name: Singularity.isMonomialValuation_comap_adjoin_sumElim
      kind: theorem
      status: proved
      note: If the values of the nonzero x_1, ..., x_r in K are linearly independent over the integers, then the restriction of V to k(x, y) is a monomial valuation over k(y) in the x_i, for each family y (Volume 3, Lemma 2.2.1 of the handbook).
    - name: Singularity.mem_comap_adjoin_sumElim_of_residue
      kind: theorem
      status: proved
      note: If the residues of y_1, ..., y_t in V are algebraically independent over k, then the restriction of V to k(x, y) is trivial on k(y) (Volume 5, Lemma 1.4.2 of the handbook).
    - name: Singularity.algebraicIndependent_sumElim_of_laurentMonomial
      kind: theorem
      status: proved
      note: Nonzero x_1, ..., x_r in K with values linearly independent over the integers and y_1, ..., y_t in V with residues algebraically independent over k are together algebraically independent over k (Volume 3, Theorem 2.1.4 of the handbook, for the trivially valued field k).
    - name: Singularity.finiteDimensional_adjoin_sumElim_of_isAbhyankarValuation
      kind: theorem
      status: proved
      note: For an Abhyankar valuation V of the function field K/k, with r elements x_i of independent values and t elements y_j of V with algebraically independent residues, where r is the rational rank of the value group and t is the transcendence degree of the residue field, K is a finite extension of k(x, y) (Volume 3, proof of Theorem 2.2.2 of the handbook).
    - name: Singularity.hasLocalUniformization_of_isAbhyankarValuation_of_finrank_residueField_eq
      kind: theorem
      status: proved
      note: Let v be an Abhyankar valuation of the function field K/k, and let K_0 = k(x, y) be a monomial subfield as in IsAbhyankarValuation.exists_isMonomialValuation_comap. If the residue extension of v over its restriction to K_0 is separable and its degree is the degree of K over K_0, then v has local uniformization over k (Volume 5, Theorem 2.2.1 of the handbook, the case of one extension with e = d = 1). The general theorem localUniformization_abhyankar is not proved.
    - name: Singularity.IsEtaleGenerator.centerSubring_closure_eq
      kind: theorem
      status: proved
      note: If z is an étale generator of K/K_0 for V, then V is the localization of the ring generated by z and K_0 ∩ V at its center (Volume 5, Lemma 1.3.3, part 1 of the handbook).
    - name: Singularity.aeval_derivative_minpoly_mul_mem_adjoin
      kind: theorem
      status: proved
      note: Euler lemma. If K = F(x) with x integral over an integrally closed A and u is integral over A, then P'(x) u ∈ A[x] for the minimal polynomial P of x (Volume 5, Lemma 1.3.1 of the handbook).
    - name: Singularity.isRegularLocalRing_localization_adjoinRoot
      kind: theorem
      status: proved
      note: Let P be monic over a Noetherian ring A and let Q be a prime of A[X]/(P) with P' not in Q. If A is regular at Q ∩ A, then A[X]/(P) is regular at Q (step in Volume 5, Theorem 1.3.4 of the handbook).
    - name: Singularity.abhyankar_inequality
      kind: theorem
      status: proved
      note: The inequality of Abhyankar for a valuation subring that contains the base field (Theorem 2.1.5 of Volume 3 of the handbook, node SG0000000Y).
    - name: Singularity.algebraicIndependent_sumElim_of_valuationSubring
      kind: theorem
      status: proved
    - name: Singularity.algebraicIndependent_sumElim_of_hasExtension
      kind: theorem
      status: proved
      note: Theorem 2.1.4 of Volume 3 of the handbook, for families of each size.
    - name: Singularity.abhyankar_inequality_relative
      kind: theorem
      status: proved
      note: The relative value group is the image of the value group of vL in the quotient of the units of the value monoid by the value group of the restriction of vL to K.
    - name: Singularity.ZariskiRiemann.compactSpace
      kind: theorem
      status: proved
      note: The Zariski-Riemann space of the valuation subrings of K that contain the image of A is quasi-compact (Theorem 1.5.3 of Volume 3 of the handbook, node SG0000000X).
    - name: Singularity.KeyPolynomial.natDegree_pos
      kind: theorem
      status: proved
      note: A key polynomial of MacLane has positive degree (Definition 3.3.3 of Volume 3 of the handbook, node SG0000000Z). The definition Singularity.KeyPolynomial states the conditions on initial forms with polynomials.
    - name: Singularity.monomialValuationFun_mul
      kind: theorem
      status: proved
      note: The monomial valuation [v; X, γ] is multiplicative (Lemma 3.3.2 of Volume 3 of the handbook).
    - name: Singularity.keyPolynomial_X_of_forall_eq
      kind: theorem
      status: proved
      note: The polynomial X is a key polynomial for the monomial valuation [v; X, γ].
    - name: Singularity.eq_sum_expansionCoeff
      kind: theorem
      status: proved
      note: The expansion of a polynomial in powers of a monic polynomial of positive degree, used to define the augmented valuation of Definition 3.3.4.
    - name: Singularity.KeyPolynomial.augmentedValuationFun_mul
      kind: theorem
      status: proved
      note: The augmented valuation [μ; φ, γ] of a key polynomial φ is multiplicative, so Singularity.augmentedValuation is a valuation (Theorem 3.3.5 (1) of Volume 3 of the handbook, MacLane-Vaquié). The theorem takes γ ≤ μ φ in multiplicative notation.
    - name: Singularity.augmentedValuation_le
      kind: theorem
      status: proved
      note: The inequality μ ≤ [μ; φ, γ] in additive notation (Theorem 3.3.5 (2) of Volume 3 of the handbook).
    - name: Singularity.isMuMinimal_iff
      kind: theorem
      status: proved
      note: A monic polynomial φ of positive degree is μ-minimal if and only if μ of a φ-expansion is the minimum of the values of its terms, in additive notation.
    - name: Singularity.KeyPolynomial.keyPolynomial_of_forall_eq
      kind: theorem
      status: proved
      note: A key polynomial φ for μ is a key polynomial for each valuation with the values of the augmentation [μ; φ, γ] (Theorem 3.3.5 (3) of Volume 3 of the handbook, first claim).
    - name: Singularity.KeyPolynomial.keyPolynomial_augmentedValuation
      kind: theorem
      status: proved
      note: A key polynomial φ for μ is a key polynomial for the augmented valuation [μ; φ, γ], for each γ ≤ μ φ in multiplicative notation (Theorem 3.3.5 (3), first claim). The description of the graded algebra in part 3 and part 4 of Theorem 3.3.5 are not proved.
    - name: Singularity.keyPolynomial_of_map_lt
      kind: theorem
      status: proved
      note: The step of MacLane-Vaquié, part (a). If μ ≤ ν in additive notation and φ is monic of least degree with μ(φ) < ν(φ), then φ is a key polynomial for μ (Lemma 3.3.9 of Volume 3 of the handbook).
    - name: Singularity.muDvd_iff_map_lt
      kind: theorem
      status: proved
      note: Under the hypotheses of the step of MacLane, φ μ-divides f if and only if μ(f) < ν(f) in additive notation.
    - name: Singularity.map_le_augmentedValuationFun_of_map_eq
      kind: theorem
      status: proved
      note: The step of MacLane-Vaquié, part (b). The augmentation [μ; φ, ν(φ)] is at most ν in additive notation if ν and μ agree in degree less than the degree of φ.
    - name: Singularity.exists_monic_map_lt
      kind: theorem
      status: proved
      note: If μ ≤ ν agree on the constants and μ ≠ ν, then there is a monic φ of least degree with μ(φ) < ν(φ) in additive notation.
    - name: Singularity.exists_keyPolynomial_augmentedValuation
      kind: theorem
      status: proved
      note: The step of MacLane-Vaquié (Lemma 3.3.9 of Volume 3 of the handbook). For μ ≤ ν with μ ≠ ν there is a key polynomial φ for μ with μ ≤ [μ; φ, ν(φ)] ≤ ν in additive notation. Part 4 of Theorem 3.3.5 is not proved.
    - name: Singularity.map_le_monomialValuationFun
      kind: theorem
      status: proved
      note: The first step of the chain of MacLane. If ν extends v, then [v; X, ν(X)] ≤ ν in additive notation.
    - name: Singularity.coeff_taylor_eq_sum
      kind: theorem
      status: proved
      note: The translation formula. The coefficient of z^d in f(z + h) is the sum over e of (e choose d) b_e h^(e-d), where b_e is the coefficient of z^e in f.
    - name: Singularity.projPolyhedron_taylor_monomial_subset
      kind: theorem
      status: proved
      note: The projected Newton polyhedron of f(z + c x^β) over k[[x]] lies in the convex hull of the polyhedron of f and β plus the orthant [Hir67].
    - name: Singularity.vertexPoly_taylor_monomial
      kind: theorem
      status: proved
      note: The initial polynomial at v of f(z + c x^v) is the initial polynomial of f at v, shifted by c.
    - name: Singularity.projPolyhedron_taylor_ssubset_of_isSolvable
      kind: theorem
      status: proved
      note: If a vertex v of the projected Newton polyhedron is solvable with the constant c, then the translation z to z - c x^v gives a polyhedron that is a proper subset and does not contain v [Hir67].
    - name: Singularity.not_isSolvableVertex_of_charPolyhedron_eq
      kind: theorem
      status: proved
      note: One direction of the vertex criterion of Hironaka [Hir67]. If the projected Newton polyhedron is the characteristic polyhedron, then no vertex v other than 0 is solvable. The converse is not proved.
    - name: Singularity.augmentedValuationFun_lt_iff_map_lt
      kind: theorem
      status: proved
      note: Under the hypotheses of the step of MacLane, the augmentation μ' = [μ; φ, ν(φ)] changes the value of f if and only if μ(f) < ν(f) in additive notation.
    - name: Singularity.map_lt_map_of_natDegree_eq
      kind: theorem
      status: proved
      note: If the next key polynomial ψ of the chain of MacLane has the same degree as φ, then ν(φ) < ν(ψ) in additive notation.
    - name: Singularity.natDegree_le_of_map_lt_augmentedValuationFun
      kind: theorem
      status: proved
      note: The degrees of the key polynomials of the chain of MacLane do not decrease.
    - name: Singularity.eventually_eq_of_succ_lt
      kind: theorem
      status: proved
      note: The limit principle of MacLane. If the value group of ν is discrete of rank 1 and the values μₙ(f) increase strictly while μₙ(f) < ν(f), then μₙ(f) = ν(f) for all large n if ν(f) is finite.
    - name: Singularity.eventually_le_of_succ_lt
      kind: theorem
      status: proved
      note: The limit principle of MacLane for the support of ν. Under the same hypotheses, the values μₙ(f) become larger than each finite value at most ν(f) in additive notation.
    - name: Singularity.macLaneChain_eventually_eq
      kind: theorem
      status: proved
      note: The theorem of MacLane (part 4 of Theorem 3.3.5 of Volume 3 of the handbook, without limit augmentations). If ν extends v and the value group of ν is discrete of rank 1, then ν is the limit of the chain of MacLane. The chain need not be finite.
    - name: Singularity.exists_macLaneChain_eq
      kind: theorem
      status: proved
      note: If the value group of ν is discrete of rank 1 and the degrees and the finite values of the key polynomials of the chain of MacLane are bounded, then the chain is finite and ends with ν.
    - name: Singularity.map_macLaneChainKey_succ_lt
      kind: theorem
      status: proved
      note: In the chain of MacLane, key polynomials of the same degree have strictly increasing values ν(φᵢ) in additive notation.
    - name: Singularity.natDegree_macLaneChainKey_le_of_map_eq_zero
      kind: theorem
      status: proved
      note: If ν(F) = ∞ for some F ≠ 0, then the key polynomials of the chain of MacLane have degree at most the degree of F.
    - name: Singularity.residualOrderAlong_pointChart_le
      kind: theorem
      status: proved
      note: Moh's bound for one point blowup (Theorem 1.4.1 of Volume 7 of the handbook). The residual order along the transformed divisor goes up by at most p^(e-1), in the given coordinates, over any field of characteristic p, without the hypothesis ord F' ≥ q.
    - name: Singularity.residualOrderAlong_pointChart_le_of_not_dvd
      kind: theorem
      status: proved
      note: If q = p^e does not divide ord F, the residual order along the divisor does not go up under a point blowup chart.
    - name: Singularity.moh_bound_holds
      kind: theorem
      status: proved
      note: The proposition Singularity.moh_bound holds.
    - name: Singularity.natDegree_eq_of_map_lt
      kind: theorem
      status: proved
      note: Two monic polynomials of least degree with μ(f) < ν(f) in additive notation have the same degree.
    - name: Singularity.muEquiv_iff_map_lt
      kind: theorem
      status: proved
      note: The choice of the key polynomial in the step of MacLane. A monic ψ of the degree of φ has μ(ψ) < ν(ψ) in additive notation if and only if ψ is μ-equivalent to φ.
    - name: Singularity.muEquiv_macLaneChainKey_iff
      kind: theorem
      status: proved
      note: The key polynomials of the chain of MacLane are unique up to μᵢ-equivalence among the monic polynomials of their degree.
    - name: Singularity.map_sub_le_of_map_le
      kind: theorem
      status: proved
      note: If ν(ψ) ≤ ν(φ) in additive notation, then μ(ψ - φ) ≥ ν(ψ).
    - name: Singularity.augmentedValuation_eq_of_map_sub_le
      kind: theorem
      status: proved
      note: Key polynomials φ and ψ of the same degree with μ(ψ - φ) ≥ γ in additive notation give the same augmentation [μ; φ, γ] = [μ; ψ, γ].
    - name: Singularity.KeyPolynomial.augmentedValuationFun_eq_of_map_sub_le
      kind: theorem
      status: proved
      note: The function form of augmentedValuation_eq_of_map_sub_le.
    - name: Singularity.augmentedValuation_le_of_map_le
      kind: theorem
      status: proved
      note: The augmentation of the step of MacLane depends on the choice of the key polynomial. If μ(ψ) < ν(ψ) ≤ ν(φ) in additive notation, then [μ; ψ, ν(ψ)] ≤ [μ; φ, ν(φ)]. The inequality can be strict.
    - name: Singularity.augmentedValuationFun_le_of_map_le
      kind: theorem
      status: proved
      note: The function form of augmentedValuation_le_of_map_le.
    - name: Singularity.augmentedValuation_eq_of_map_eq
      kind: theorem
      status: proved
      note: If ν(φ) = ν(ψ), then the two choices give the same augmentation of the step of MacLane.
    - name: Singularity.KeyPolynomial.muEquiv_augmentedValuation_sum_filter
      kind: theorem
      status: proved
      note: Theorem 3.3.5 (3) of MacLane-Vaquié, the graded algebra in elementwise form. Each f is μ'-equivalent to the sum of the terms of its φ-expansion of least value, so gr_{μ'} is generated by in(φ) over the initial forms of degree less than the degree of φ.
    - name: Singularity.KeyPolynomial.augmentedValuationFun_sub_sum_filter_lt
      kind: theorem
      status: proved
      note: The function form of KeyPolynomial.muEquiv_augmentedValuation_sum_filter.
    - name: Singularity.KeyPolynomial.augmentedValuation_sum_mul_pow
      kind: theorem
      status: proved
      note: Theorem 3.3.5 (3) of MacLane-Vaquié, the transcendence of in(φ) in elementwise form. The value of a sum of terms cⱼφ^j with deg cⱼ < deg φ is the least value of a term in additive notation.
    - name: Singularity.coeff_pow_expChar_pow_eq_zero
      kind: theorem
      status: proved
      note: In exponential characteristic p, every exponent of the power series φ^(p^e) lies in p^e ℕ^n.
    - name: Singularity.taylor_X_pow_add_C
      kind: theorem
      status: proved
      note: In exponential characteristic p and with q = p^e, the change of coordinate z to z + φ sends z^q + F to z^q + (φ^q + F).
    - name: Singularity.projPolyhedron_X_pow_add_C_coe
      kind: theorem
      status: proved
      note: For a polynomial F and n at least 1, the projected Newton polyhedron of z^n + F is (1/n) N(F), where N(F) is the Newton polyhedron of F.
    - name: Singularity.charPolyhedron_X_pow_add_C_of_clean
      kind: theorem
      status: proved
      note: The converse direction of the vertex criterion of Hironaka [Hir67] for z^q + F with q = p^e over a nontrivial commutative ring of exponential characteristic p. If no exponent of F lies in q ℕ^n, then Δ(f; x) = Δ(f; x; z). The converse direction for a general f is not proved.
    - name: Singularity.charPolyhedron_X_pow_add_C_eq_smul_newtonPolyhedron
      kind: theorem
      status: proved
      note: For q = p^e and a clean polynomial F, the characteristic polyhedron of z^q + F is (1/q) N(F), where N(F) is the Newton polyhedron of F.
    - name: Singularity.not_isSolvableVertex_of_clean
      kind: theorem
      status: proved
      note: For z^q + F with q = p^e and F clean, no vertex v other than 0 of the projected Newton polyhedron is solvable.
    - name: Singularity.ContinuousFamily.stableValue_eq_of_isStable
      kind: theorem
      status: proved
      note: For a continuous family μᵢ ≤ ν that agrees with ν in degree less than d, the limit value of a stable polynomial is its value for ν.
    - name: Singularity.ContinuousFamily.exists_not_isStable_iff
      kind: theorem
      status: proved
      note: Some polynomial is not stable for a continuous family below ν if and only if the family does not reach ν, that is some f has μᵢ(f) ≠ ν(f) for each i.
    - name: Singularity.ContinuousFamily.exists_isLimitKeyPolynomial
      kind: theorem
      status: proved
      note: If some polynomial is not stable for a continuous family, then a limit key polynomial exists, a monic unstable polynomial of least degree.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitDvd_iff
      kind: theorem
      status: proved
      note: A limit key polynomial divides f in the limit if and only if f is not stable.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_add_le_max
      kind: theorem
      status: proved
      note: The limit augmentation of Vaquié satisfies the ultrametric inequality.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_mul
      kind: theorem
      status: proved
      note: The limit augmentation of Vaquié [μ_∞; φ, γ] is multiplicative for γ ≥ μᵢ(φ) for each i in additive notation, so it is a valuation.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_le
      kind: theorem
      status: proved
      note: Each valuation μᵢ of the continuous family is at most the limit augmentation [μ_∞; φ, γ] in additive notation.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.map_le_limitAugmentedValuationFun
      kind: theorem
      status: proved
      note: The limit augmentation [μ_∞; φ, γ] is at most ν in additive notation if γ ≤ ν(φ).
    - name: Singularity.X_add_C_pow_pow_mul
      kind: theorem
      status: proved
      note: The Frobenius form of the translation, (X + c)^(p^e m_0) = (X^(p^e) + c^(p^e))^(m_0), over a commutative semiring of exponential characteristic p.
    - name: Singularity.cast_choose_pow_mul_eq_zero
      kind: theorem
      status: proved
      note: If p^e does not divide n, then binom(p^e m_0, n) = 0 in a semiring of exponential characteristic p. This replaces the theorem of Lucas.
    - name: Singularity.coeff_taylor_natDegree_sub
      kind: theorem
      status: proved
      note: The translation formula a'_i = sum over j <= i of binom(m - j, i - j) a_j c^(i-j), for i <= m, with a_i the coefficient of z^(m-i).
    - name: Singularity.coeff_taylor_sub_of_lt_pow
      kind: theorem
      status: proved
      note: The inseparable layer is rigid (Theorem 4.1.3 of Volume 7 of the handbook). For deg f = p^e m_0 and 0 < i < p^e, a'_i = a_i + sum over 0 < j < i of binom(m - j, i - j) a_j c^(i-j).
    - name: Singularity.coeff_taylor_sub_of_lt_pow_of_eq_zero
      kind: theorem
      status: proved
      note: If a_1 = ... = a_(i-1) = 0 and 0 < i < p^e, then the translation z to z + c does not change a_i.
    - name: Singularity.coeff_taylor_natDegree_sub_one
      kind: theorem
      status: proved
      note: If the prime p divides the degree of f, then the translation z to z + c does not change a_1.
    - name: Singularity.coeff_taylor_sub_pow
      kind: theorem
      status: proved
      note: The step of Lucas and Tschirnhausen (Proposition 4.1.4 of Volume 7 of the handbook). For monic f of degree p^e m_0, a'_(p^e) = a_(p^e) + m_0 c^(p^e) + sum over 0 < j < p^e of binom(m - j, p^e - j) a_j c^(p^e - j).
    - name: Singularity.coeff_taylor_sub_pow_of_eq_zero
      kind: theorem
      status: proved
      note: If a_1 = ... = a_(p^e - 1) = 0, then the translation z to z + c adds m_0 c^(p^e) to a_(p^e).
    - name: Singularity.X_pow_add_C_mem_pow_iff
      kind: theorem
      status: proved
      note: The lifting test (Proposition 4.2.1 of Volume 7 of the handbook). For q = p^e, z^q + g lies in (z - h, I)^q if and only if g + h^q lies in I^q.
    - name: Singularity.logJacobian_add_pow
      kind: theorem
      status: proved
      note: The log-Jacobian ideal does not change when a p-th power is added to g (Lemma 3.1.2 of Volume 7 of the handbook).
    - name: Singularity.logJacobian_monomial_mul
      kind: theorem
      status: proved
      note: If r is supported in the divisor, the log-Jacobian ideal of x^r G is x^r times the residual log-Jacobian ideal of G.
    - name: Singularity.residualLogJacobian_not_le_span_X
      kind: theorem
      status: proved
      note: For a clean g other than 0, the residual log-Jacobian ideal is not contained in (x_i) for a boundary coordinate x_i (Theorem 3.1.4 (1) of Volume 7 of the handbook).
    - name: Singularity.le_divisorExponent_of_logJacobian_le
      kind: theorem
      status: proved
      note: For a clean g other than 0, the monomial factor of the log-Jacobian ideal is the monomial factor x^r of g.
    - name: Singularity.logJacobianOrder_le_residualOrderAlong
      kind: theorem
      status: proved
      note: For a clean g, the order rho of the residual log-Jacobian ideal is at most the residual order d along the divisor.
    - name: Singularity.residualOrderAlong_le_logJacobianOrder_add_one
      kind: theorem
      status: proved
      note: For a clean g, the residual order d along the divisor is at most rho + 1.
    - name: Singularity.logJacobianOrder_eq_or
      kind: theorem
      status: proved
      note: For a clean g, rho = d or rho + 1 = d. This is the dichotomy (Theorem 3.1.4 (2) of Volume 7 of the handbook).
    - name: Singularity.logJacobianOrder_add_one_eq_iff
      kind: theorem
      status: proved
      note: For a clean g with ord G = d, rho + 1 = d if and only if the derivative of the initial form of G along some free coordinate is not 0 (Theorem 3.1.4 (3) of Volume 7 of the handbook).
    - name: Singularity.isSingularPoint_purelyInseparable_iff
      kind: theorem
      status: proved
      note: The point (z, v) is a singular point of z^p + h if and only if z^p + h(v) = 0 and v is a critical point of h, over a commutative semiring of characteristic p.
    - name: Singularity.exists_isSingularPoint_purelyInseparable_iff
      kind: theorem
      status: proved
      note: Over a perfect reduced ring of characteristic p, some z ≠ 0 makes (z, v) a singular point of z^p + h if and only if h(v) ≠ 0 and v is a critical point of h.
    - name: Singularity.exists_torus_isCriticalPoint_iff
      kind: theorem
      status: proved
      note: Theorem 3.3.3 of Volume 7 of the handbook, face by face. The polynomial h has a critical point in the torus if and only if {h = 0} or {z^p + h = 0} has a singular point in the torus. The faces of the Newton polyhedron of z^p + g are not formalized.
    - name: Singularity.eq_sum_smul_X_mul_pderiv
      kind: theorem
      status: proved
      note: Proposition 3.3.6 of Volume 7 of the handbook. If the sum of w_i a_i is 1 for each exponent a of h, then h is the sum of w_i x_i ∂_i h.
    - name: Singularity.eq_inv_smul_sum_X_mul_pderiv
      kind: theorem
      status: proved
      note: Corollary 3.3.7 of Volume 7 of the handbook. A weighted homogeneous h of degree D with D ≠ 0 in k is D⁻¹ times the sum of w_i x_i ∂_i h.
    - name: Singularity.eval_eq_zero_of_isCriticalPoint_of_isWeightedHomogeneous
      kind: theorem
      status: proved
      note: A critical point of a weighted homogeneous h of degree D with D ≠ 0 in k lies on {h = 0}.
    - name: Singularity.pderiv_monomial_eq_zero_of_dvd
      kind: theorem
      status: proved
      note: Corollary 3.3.5 of Volume 7 of the handbook. Each partial derivative of c x^a with a in p ℕ^σ is 0 in characteristic p.
    - name: Singularity.exists_torus_isSingularPoint_purelyInseparable_monomial
      kind: theorem
      status: proved
      note: Over a perfect reduced ring of characteristic p, z^p + c x^a with c ≠ 0 and a in p ℕ^σ has a singular point in the torus.
    - name: Singularity.exists_eq_sum_smul_X_mul_pderiv_of_not_isResonant
      kind: theorem
      status: proved
      note: Definition 3.3.8 of Volume 7 of the handbook. A polynomial with a support that is not resonant satisfies a mod p Euler identity.
    - name: Singularity.eval_eq_zero_of_isCriticalPoint_of_not_isResonant
      kind: theorem
      status: proved
      note: A critical point of a polynomial with a support that is not resonant lies on its zero set.
    - name: Singularity.not_isResonant_of_isWeightedHomogeneous
      kind: theorem
      status: proved
      note: A weighted homogeneous polynomial of degree D with p not dividing D has a support that is not resonant.
    - name: Singularity.not_isResonant_initialForm
      kind: theorem
      status: proved
      note: The initial form of g for w is not resonant if p does not divide the weighted order of g.
    - name: Singularity.pderiv_pointChart_of_ne
      kind: theorem
      status: proved
      note: The chain rule for the x_j-chart pi of a point blowup. For i other than j, the derivative of pi(h) along x_i is x_j pi(d_i h) (Lemma 3.2.2 of Volume 7, Section 3.2 of the handbook).
    - name: Singularity.X_mul_pderiv_pointChart
      kind: theorem
      status: proved
      note: The chain rule for the x_j-chart pi of a point blowup. The equation is x_j d_j pi(h) = pi(sum of x_i d_i h) (Lemma 3.2.2 of Volume 7, Section 3.2 of the handbook).
    - name: Singularity.pderiv_X_pow_mul_of_ne
      kind: theorem
      status: proved
      note: For i other than j, d_i(x_j^n u) = x_j^n d_i u.
    - name: Singularity.X_mul_pderiv_X_pow_mul
      kind: theorem
      status: proved
      note: In characteristic p, x_j d_j (x_j^p u) = x_j^p x_j d_j u.
    - name: Singularity.map_pointChart_logJacobianTangent_le
      kind: theorem
      status: proved
      note: The chart sends the log-Jacobian ideal tangent to the origin of g into the log-Jacobian ideal of pi(g) for the new divisor.
    - name: Singularity.span_mul_logJacobian_pointChart_le
      kind: theorem
      status: proved
      note: The unit u of the translated directions times the log-Jacobian ideal of pi(g) for the new divisor lies in the image of the log-Jacobian ideal tangent to the origin of g.
    - name: Singularity.map_pointChart_logJacobianTangent_le_span_mul
      kind: theorem
      status: proved
      note: The transformation law, first inclusion (Theorem 3.2.3 of Volume 7, Section 3.2 of the handbook). If pi(g) = x_j^p g', the image of the log-Jacobian ideal tangent to the origin of g lies in (x_j^p) times the log-Jacobian ideal of g' for the new divisor.
    - name: Singularity.span_mul_logJacobian_le_map_pointChart
      kind: theorem
      status: proved
      note: The transformation law, second inclusion (Theorem 3.2.3 of Volume 7, Section 3.2 of the handbook). If pi(g) = x_j^p g', then (x_j^p u) times the log-Jacobian ideal of g' for the new divisor lies in the image of the log-Jacobian ideal tangent to the origin of g. The polynomial u is a unit in the power series ring.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_monomial
      kind: theorem
      status: proved
      note: In several variables, D^α (r x^β) = binom(β, α) r x^(β - α), with binom(β, α) the product of the binomial coefficients of the coordinates.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_zero
      kind: theorem
      status: proved
      note: The operator D^0 is the identity.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_C
      kind: theorem
      status: proved
      note: The operator D^α kills the constants for α ≠ 0.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_X
      kind: theorem
      status: proved
      note: The values of D^α on a variable x_i are x_i for α = 0, 1 for α = e_i, and 0 otherwise.
    - name: Singularity.Algebra.MvHasse.uniqueAlgEquiv_hasseDeriv
      kind: theorem
      status: proved
      note: In one variable, D^α is the Hasse derivative Polynomial.hasseDeriv of Mathlib (Proposition 6.3.2 of Volume 1 of the handbook).
    - name: Singularity.Algebra.MvHasse.hasseDeriv_single_one
      kind: theorem
      status: proved
      note: The operator D^(e_i) is the partial derivative with respect to x_i.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_mul
      kind: theorem
      status: proved
      note: The Leibniz rule for the Hasse-Schmidt derivatives in several variables, with a sum over the antidiagonal of α.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_comp
      kind: theorem
      status: proved
      note: The composition rule D^α D^β = binom(α + β, α) D^(α + β).
    - name: Singularity.Algebra.MvHasse.coeff_hasseDeriv
      kind: theorem
      status: proved
      note: The coefficient of x^γ in D^α f is binom(γ + α, α) times the coefficient of x^(γ + α) in f.
    - name: Singularity.Algebra.MvHasse.constantCoeff_hasseDeriv
      kind: theorem
      status: proved
      note: The value of D^α f at the origin is the coefficient of x^α in f.
    - name: Singularity.Algebra.MvHasse.le_ord_iff_hasseDeriv
      kind: theorem
      status: proved
      note: The order of f at the origin is at least d if and only if (D^α f)(0) = 0 for each α with |α| < d.
    - name: Singularity.Algebra.MvHasse.taylor_eq_sum
      kind: theorem
      status: proved
      note: The Taylor formula f(x + y) = sum of (D^α f)(x) y^α in several variables.
    - name: Singularity.Algebra.MvHasse.coeff_aeval_X_add_C
      kind: theorem
      status: proved
      note: The coefficient of y^α in f(a + y) is (D^α f)(a).
    - name: Singularity.Algebra.MvHasse.aeval_X_add_C_eq_sum
      kind: theorem
      status: proved
      note: The Taylor formula at a point a, f(a + y) = sum of (D^α f)(a) y^α.
    - name: Singularity.Algebra.MvHasse.le_ord_aeval_X_add_C_iff
      kind: theorem
      status: proved
      note: The order of f at a point a is at least d if and only if (D^α f)(a) = 0 for each α with |α| < d (Proposition 1.1.4 of Volume 7 of the handbook).
    - name: Singularity.Algebra.MvHasse.exists_expand_eq_iff
      kind: theorem
      status: proved
      note: A polynomial is a polynomial in the x_i^q if and only if q divides each exponent of each of its monomials.
    - name: Singularity.Algebra.MvHasse.exists_expand_eq_iff_hasseDeriv
      kind: theorem
      status: proved
      note: The test for q-th powers. Over a semiring of characteristic p, with q = p^e, f is a polynomial in the x_i^q if and only if D^α f = 0 for each α ≠ 0 with α_i < q for each i. The proof uses the theorem of Lucas.
    - name: Singularity.Algebra.MvHasse.hasseDeriv_expand_mul
      kind: theorem
      status: proved
      note: For α with α_i < q = p^e for each i, D^α (g(x^q) f) = g(x^q) D^α f in characteristic p (the first claim of Theorem 6.3.6 of Volume 1 of the handbook).
    - name: Singularity.monomial_one_dvd_iff
      kind: theorem
      status: proved
      note: The monomial x^b divides f if and only if each monomial of f is divisible by x^b.
    - name: Singularity.monomial_one_dvd_of_dvd_mul
      kind: theorem
      status: proved
      note: If x^b divides u f and the constant term of u is not 0, then x^b divides f. Each variable is prime and does not divide u.
    - name: Singularity.dvd_pointChart_of_monomial_one_dvd
      kind: theorem
      status: proved
      note: If x^r divides h and the order of h is at least |r| + c, then x_j^(|r| + c) x^e divides pi(h), with e the exponent of the factors x_l of pi(x^r) for l other than j with t_l = 0.
    - name: Singularity.map_pointChart_span_le
      kind: theorem
      status: proved
      note: If each generator of an ideal is divisible by x^r and has order at least |r| + c, then the image of the ideal under the chart pi lies in the ideal of x_j^(|r| + c) x^e.
    - name: Singularity.constantCoeff_blowupUnit_ne_zero
      kind: theorem
      status: proved
      note: The constant term of the unit u of the transformation law is not 0.
    - name: Singularity.le_idealOrd_logJacobianTangent
      kind: theorem
      status: proved
      note: The order of the log-Jacobian ideal tangent to the origin of g is at least the order of g.
    - name: Singularity.logJacobianOrder_le_of_mem
      kind: theorem
      status: proved
      note: For a clean g other than 0, let x^b divide the log-Jacobian ideal of g with b supported in the divisor. If an element phi of the ideal has order at most |b| + n, then rho(g) is at most n.
    - name: Singularity.logJacobianOrder_cleanPart_le
      kind: theorem
      status: proved
      note: rho does not go up (Theorem 3.2.4 of Volume 7, Section 3.2 of the handbook). For a clean g other than 0 with ord g at least p and pi(g) = x_j^p g', the clean part of g' is not 0 and its rho for the new divisor is at most rho(g).
    - name: Singularity.residualOrderAlong_pointChart_le_logJacobianOrder
      kind: theorem
      status: proved
      note: Corollary 3.2.5 of Volume 7, Section 3.2 of the handbook. The residual orders satisfy d' at most rho(g'_c) + 1, rho(g'_c) + 1 at most rho + 1, and rho + 1 at most d + 1.
    - name: Singularity.residualOrderAlong_pointChart_le_add_one
      kind: theorem
      status: proved
      note: The residual order goes up by at most one under a point blowup (Corollary 3.2.5 of Volume 7, Section 3.2 of the handbook).
    - name: Singularity.logJacobianCenter_le
      kind: theorem
      status: proved
      note: The ideal Theta_C(g) of a center C = V(x_i for i in S) is contained in the log-Jacobian ideal Theta(g) (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.span_X_mul_logJacobian_le
      kind: theorem
      status: proved
      note: The ideal I_C Theta(g) is contained in Theta_C(g), where I_C = (x_i for i in S) is the ideal of the center (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.logJacobianCenter_univ
      kind: theorem
      status: proved
      note: For the center at the origin (S is all of sigma), Theta_C(g) is the ideal Theta_0(g) of the point blowup.
    - name: Singularity.centerChart_univ
      kind: theorem
      status: proved
      note: For the center at the origin (S is all of sigma), the x_j-chart of the blowup of the center is the chart of the point blowup.
    - name: Singularity.pderiv_centerChart_of_notMem
      kind: theorem
      status: proved
      note: The chain rule for the x_j-chart pi of the blowup of the center. For i not in S, the derivative of pi(h) along x_i is pi(d_i h) (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.pderiv_centerChart_of_mem
      kind: theorem
      status: proved
      note: The chain rule for the x_j-chart pi of the blowup of the center. For i in S other than j, the derivative of pi(h) along x_i is x_j pi(d_i h) (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.X_mul_pderiv_centerChart
      kind: theorem
      status: proved
      note: The chain rule for the x_j-chart pi of the blowup of the center. The equation is x_j d_j pi(h) = pi(sum over i in S of x_i d_i h) (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.map_centerChart_logJacobianCenter_le
      kind: theorem
      status: proved
      note: The image of Theta_C(g) under the chart pi is contained in the log-Jacobian ideal Theta'(pi(g)) for the transformed divisor (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.span_mul_logJacobian_centerChart_le
      kind: theorem
      status: proved
      note: The unit u of the translated directions in S times Theta'(pi(g)) is contained in the image of Theta_C(g) under the chart pi (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.map_centerChart_logJacobianCenter_le_span_mul
      kind: theorem
      status: proved
      note: The transformation law for the center, first inclusion. In characteristic p, if pi(g) = x_j^p g', then pi(Theta_C(g)) is contained in (x_j^p) Theta'(g') (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.span_mul_logJacobian_le_map_centerChart
      kind: theorem
      status: proved
      note: The transformation law for the center, second inclusion. In characteristic p, if pi(g) = x_j^p g', then (x_j^p u) Theta'(g') is contained in pi(Theta_C(g)) (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.exists_centerChart_eq_X_pow_mul
      kind: theorem
      status: proved
      note: If f is in I_C^s, then pi(f) = x_j^s f' for some f'.
    - name: Singularity.ord_le_of_centerChart
      kind: theorem
      status: proved
      note: The equimultiple weak transform. If f is in I_C^s, ord f = s and pi(f) = x_j^s f', then ord f' is at most s (Volume 7, Section 3.4 of the handbook).
    - name: Singularity.logJacobianOrder_cleanPart_le_of_mem_center
      kind: theorem
      status: proved
      note: The core of Theorem 3.4.5 of Volume 7, Section 3.4 of the handbook. If each element of Theta_C(g) is x^r times an element of I_C^s, and Theta_C(g) has an element x^r q with ord q = s and ord pi(q) at most s + rho, then the clean part of g' is not 0 and its order rho is at most rho.
    - name: Singularity.exists_logJacobianOrder_eq
      kind: theorem
      status: proved
      note: For a clean g other than 0, the order rho of the log-Jacobian ideal is finite.
    - name: Singularity.logJacobianOrder_cleanPart_le_center
      kind: theorem
      status: proved
      note: The order rho does not go up under the blowup of a regular center (Theorem 3.4.5 of Volume 7, Section 3.4 of the handbook). Under (H1) and (H2) in elementary form, the clean part of g' is not 0 and rho(g'_c) is at most rho(g).
    - name: Singularity.centerExample_hyp
      kind: theorem
      status: proved
      note: Example 3.4.6 of Volume 7, Section 3.4 of the handbook. Over F_2 the polynomial g = y^2 w + y^3 is not 0, is clean, and is in I_C^2 for C = V(x, y).
    - name: Singularity.centerExample_centerChart
      kind: theorem
      status: proved
      note: Example 3.4.6 of Volume 7, Section 3.4 of the handbook. The x-chart of the blowup of C = V(x, y) sends g = y^2 w + y^3 to x^2 (y^2 w + x y^3).
    - name: Singularity.centerExample_H1
      kind: theorem
      status: proved
      note: Example 3.4.6 of Volume 7, Section 3.4 of the handbook. The condition (H1) holds for g = y^2 w + y^3 with the divisor V(w) and the center V(x, y).
    - name: Singularity.centerExample_not_H2
      kind: theorem
      status: proved
      note: Example 3.4.6 of Volume 7, Section 3.4 of the handbook. The condition (H2) fails for g = y^2 w + y^3 with the divisor V(w) and the center V(x, y).
    - name: Singularity.centerExample_logJacobianOrder
      kind: theorem
      status: proved
      note: Example 3.4.6 of Volume 7, Section 3.4 of the handbook. The order rho of g = y^2 w + y^3 along the divisor V(w) is 2.
    - name: Singularity.centerExample_logJacobianOrder_cleanPart
      kind: theorem
      status: proved
      note: Example 3.4.6 of Volume 7, Section 3.4 of the handbook. The order rho of the clean part of g' = y^2 w + x y^3 along the new divisor V(x w) is 3, so rho goes up when (H2) fails.
    - name: Singularity.le_ord_zMonic_iff
      kind: theorem
      status: proved
      note: The polynomial z^m + sum of a_i z^i for i < m has order at least m at the origin if and only if a_i has order at least m - i for each i < m.
    - name: Singularity.tschirnhausen_transformation
      kind: theorem
      status: proved
      note: The Tschirnhausen transformation. If m is a unit, then the change z to z - a_(m-1)/m sends z^m + sum of a_i z^i to a polynomial of the same kind with a_(m-1) = 0.
    - name: Singularity.eq_zero_of_le_ord_translate
      kind: theorem
      status: proved
      note: Let m be a unit and let f = z^m + sum of a_i z^i have a_(m-1) = 0. If f has order at least m at a point b, then b_z = 0.
    - name: Singularity.le_ord_translate_zMonic_iff
      kind: theorem
      status: proved
      note: Let m be a unit and let a_(m-1) = 0. Then f has order at least m at b if and only if b_z = 0 and each a_i has order at least m - i at b_x.
    - name: Singularity.tschirnhausen_pointChart
      kind: theorem
      status: proved
      note: The lemma of Tschirnhausen for a point blowup over a field with m not 0. If a chart keeps the order m, then it is an x_j-chart with translation 0 for z, and the weak transform is again in Tschirnhausen form with a_i = x_j^(m-i) a_i' and ord a_i' at least m - i.
    - name: Singularity.not_tschirnhausen_charTwo
      kind: theorem
      status: proved
      note: In characteristic 2 the example of Narasimhan is in Tschirnhausen form with m = 2 and has order 2 at the point (1, 1, 1, 1). So the hypothesis that m is a unit is necessary.
      note: The lifting test (Lemma 10.5 of Volume 7, Chapter 4 of the handbook). For q = p^e, z^q + g lies in (z - h, I)^q if and only if g + h^q lies in I^q.
    - name: Singularity.IsAlteration.eq_genericPoint
      kind: theorem
      status: proved
      note: The fibre of an alteration over the generic point is the generic point alone (Lemma 1.1.2 of Volume 8 of the handbook, the part on the generic fibre).
    - name: Singularity.IsAlteration.id
      kind: theorem
      status: proved
      note: The identity of an integral scheme is an alteration in the sense of [dJ96, 2.20].
    - name: Singularity.IsAlteration.comp
      kind: theorem
      status: proved
      note: A composite of two alterations is an alteration (Lemma 1.1.6 of Volume 8 of the handbook, without the degree).
    - name: Singularity.IsAlteration.of_isIso_restrict
      kind: theorem
      status: proved
      note: A proper morphism of integral schemes that is an isomorphism over a nonempty open set is an alteration. This covers the modifications of [dJ96, 2.17].
    - name: Singularity.IsResolution.isIntegral
      kind: theorem
      status: proved
      note: A resolution of an integral scheme has an integral source (Lemma 1.1.15 of Volume 8 of the handbook).
    - name: Singularity.IsResolution.isAlteration
      kind: theorem
      status: proved
      note: A resolution of an integral scheme is an alteration (Lemma 1.1.15 of Volume 8 of the handbook).
    - name: Singularity.deJongAlteration
      kind: statement
      status: known
      note: The theorem of de Jong [dJ96, Theorem 4.1] (node SG0000001K), with a compactification that is proper over k where de Jong has projective, and without the generically étale part over a perfect field. This is a definition of a proposition. The package does not prove it, and it has no named hypothesis for the moduli of stable curves (Q-08).
    - name: Singularity.regularAlterationInDim_of_deJongAlteration
      kind: theorem
      status: proved
      note: The theorem of de Jong implies RegularAlterationInDim p n for each p and n.
    - name: Singularity.regularAlterationInDim_of_resolutionInDim
      kind: theorem
      status: proved
      note: Resolution in dimension n implies regular alterations in dimension n.
    - name: Singularity.valuationSubring_pow_mem_iff
      kind: theorem
      status: proved
      note: For a valuation subring V and n not zero, b ^ n lies in V if and only if b lies in V.
    - name: Singularity.irreducible_X_pow_sub_C_iff
      kind: theorem
      status: proved
      note: In characteristic p, X ^ p - a is irreducible if and only if a is not a p-th power (Lemma 2.1.1 of Volume 6 of the handbook).
    - name: Singularity.existsUnique_valuationSubring_comap_eq
      kind: theorem
      status: proved
      note: A valuation subring of K has exactly one extension to a purely inseparable extension of K (Lemma 2.1.5 of Volume 6 of the handbook).
    - name: Singularity.exists_artinSchreier_generator
      kind: theorem
      status: proved
      note: A Galois extension of degree p in characteristic p is generated by a root of an Artin-Schreier equation (Theorem 2.1.3 of Volume 6 of the handbook).
    - name: Singularity.artinSchreier_integral
      kind: theorem
      status: proved
      note: The integral form of an Artin-Schreier equation, as in Step 4 of the proof of Proposition 4.10 of Cossart-Piltant.
    - name: Singularity.exists_purelyInseparable_tower
      kind: theorem
      status: proved
      note: A finite purely inseparable extension is a tower of steps of degree p, each given by a p-th root that lies in the unique extension of the valuation (Lemma 2.1.2 and Lemma 2.1.5 of Volume 6 of the handbook). This is part of Step 3 of the reduction of Cossart-Piltant, not the reduction.
    - name: Singularity.exists_inseparableStep_model
      kind: theorem
      status: proved
      note: The purely inseparable step for function fields with a valuation that has local uniformization (Lemma 2.2.2 of Volume 6 of the handbook). This is not the reduction of Cossart-Piltant.
    - name: Singularity.mem_valuationSubring_of_pow_eq
      kind: theorem
      status: proved
      note: A p-th root of an element of V lies in each valuation subring over V.
    - name: Singularity.X_pow_add_C_tfae
      kind: theorem
      status: proved
      note: For an integrally closed domain R of characteristic p, R[X]/(X ^ p + g) is reduced if and only if it is a domain, if and only if X ^ p + g is irreducible, if and only if g is not a p-th power (Lemma 2.3.1 of Volume 6 of the handbook).
    - name: Singularity.X_pow_add_C_tfae_threefold
      kind: theorem
      status: proved
      note: Lemma 2.3.1 of Volume 6 of the handbook for R = k[x, y, w].
    - name: Singularity.HasLocalUniformization.of_algEquiv
      kind: theorem
      status: proved
      note: Local uniformization is invariant under an isomorphism of k-algebras.
    - name: Singularity.exists_isGalois_finrank_eq_prime
      kind: theorem
      status: proved
      note: A Galois extension of degree p ^ (r + 1) has a Galois subextension of degree p, by the theorem of Sylow and a normal subgroup of index p.
    - name: Singularity.exists_artinSchreier_tower
      kind: theorem
      status: proved
      note: A Galois extension of degree p ^ r in characteristic p is a tower of Artin-Schreier steps of degree p (Proposition 2.1.4 of Volume 6 of the handbook).
    - name: Singularity.hasLocalUniformization_of_isPurelyInseparable
      kind: theorem
      status: proved
      note: Step 3 of the reduction of Cossart-Piltant, the induction on the degree of a purely inseparable extension. The passage through one step of degree p is an explicit hypothesis (LocalUniformizationInseparableStep) that the library does not prove.
    - name: Singularity.hasLocalUniformization_of_separableClosure
      kind: theorem
      status: proved
      note: Step 3 of the reduction of Cossart-Piltant, from the separable closure, with the explicit hypothesis LocalUniformizationInseparableStep that the library does not prove.
    - name: Singularity.hasLocalUniformization_of_isGalois
      kind: theorem
      status: proved
      note: The last part of Step 4 of the reduction of Cossart-Piltant, the induction on the degree of a Galois extension of degree p ^ r. The passage through one Galois step of degree p is an explicit hypothesis (LocalUniformizationGaloisStep) that the library does not prove.
    - name: Singularity.finiteDimensional_residueField_and_finrank_le
      kind: theorem
      status: proved
      note: For a finite extension E'/E and a valuation of E' that extends a valuation of E, the residue extension is finite of degree at most [E' to E].
    - name: Singularity.hasLocalUniformization_of_finrank_residueField_eq_of_algebra
      kind: theorem
      status: proved
      note: Local uniformization lifts along a finite extension E'/E, given as an algebra, if the residue extension is separable of degree [E' to E].
    - name: Singularity.isSeparable_and_finrank_residueField_inertiaField
      kind: theorem
      status: proved
      note: Let L/K be finite Galois and let W be a valuation subring of L that each K-automorphism maps into W. Then the residue extension of W ∩ K^T over W ∩ K is separable of degree [K^T to K], where K^T is the inertia field.
    - name: Singularity.hasLocalUniformization_inertiaField
      kind: theorem
      status: proved
      note: The unramified part of Step 4 of the reduction of Cossart-Piltant, over a field K that contains the decomposition field. Local uniformization of W ∩ K gives local uniformization of W ∩ K^T. This is unconditional.
    - name: Singularity.hasLocalUniformization_inertiaField_decompositionField
      kind: theorem
      status: proved
      note: The unramified part of Step 4 of the reduction of Cossart-Piltant (Volume 6, Proposition 2.2.1 of the handbook). Local uniformization of W ∩ K^Z gives local uniformization of W ∩ K^T. This is unconditional. The passage from K to K^Z, the tame part and Steps 1 and 2 are not proved.
    - name: Singularity.exists_mem_fixedField_decompositionSubgroup
      kind: theorem
      status: proved
      note: Let L/K be finite Galois and let W be a valuation subring of L. There is z in the decomposition field K^Z, integral over W ∩ K, with w(z - 1) < 1 and w(σ z) < 1 for each σ outside the decomposition group.
    - name: Singularity.isEtaleGenerator_decompositionField
      kind: theorem
      status: proved
      note: An element z as above is an étale generator of K^Z/K at W ∩ K^Z.
    - name: Singularity.hasLocalUniformization_decompositionField
      kind: theorem
      status: proved
      note: The passage from K to K^Z in Step 4 of the reduction of Cossart-Piltant (Volume 6, Proposition 2.2.1 of the handbook). Local uniformization of W ∩ K gives local uniformization of W ∩ K^Z. This is unconditional and does not use the henselization.
    - name: Singularity.hasLocalUniformization_inertiaField_of_base
      kind: theorem
      status: proved
      note: Local uniformization of W ∩ K gives local uniformization of W ∩ K^T, where K^T is the inertia field. This is unconditional. The tame part, the passage down to K, Steps 1 and 2 and the Galois steps of degree p are not proved.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.muDvd_iff_of_forall_eq
      kind: theorem
      status: proved
      note: A limit key polynomial φ divides f for a valuation w with the values of the limit augmentation [μ_∞; φ, γ] if and only if μ_∞ of the remainder of f modulo φ is less than w(f) in multiplicative notation.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.keyPolynomial_of_forall_eq
      kind: theorem
      status: proved
      note: A limit key polynomial φ is a key polynomial for each valuation with the values of the limit augmentation [μ_∞; φ, γ].
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.of_map_le
      kind: theorem
      status: proved
      note: A monic polynomial of the degree of a limit key polynomial φ, with a ν-value at least ν(φ) in additive notation, is a limit key polynomial.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_eq_of_natDegree_le
      kind: theorem
      status: proved
      note: If the limit key polynomial φ has the largest ν-value among the monic polynomials of its degree, then [μ_∞; φ, ν(φ)] agrees with ν in degree at most deg φ.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.map_le_of_forall_eq
      kind: theorem
      status: proved
      note: If [μ_∞; φ, ν(φ)] agrees with ν in degree at most deg φ, then φ has the largest ν-value among the monic polynomials of its degree.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.forall_limitAugmentedValuationFun_eq_iff
      kind: theorem
      status: proved
      note: The limit augmentation [μ_∞; φ, ν(φ)] agrees with ν in degree at most deg φ if and only if φ has the largest ν-value among the monic polynomials of its degree.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitStep
      kind: theorem
      status: proved
      note: The limit step of MacLane-Vaquié. For a limit key polynomial φ of largest ν-value in its degree, φ is a key polynomial for w = [μ_∞; φ, ν(φ)], μᵢ ≤ w ≤ ν for each i, and w agrees with ν in degree at most deg φ.
    - name: Singularity.false_of_strictAnti_of_noMaxOrder
      kind: theorem
      status: proved
      note: If the values of ν are discrete of rank 1, then a strictly increasing family of values of ν in additive notation, indexed by a nonempty totally ordered set without a largest element, is not bounded. This is the use of the discreteness in the theorem of MacLane.
    - name: Singularity.finite_Icc_inter_range_int
      kind: theorem
      status: proved
      note: A valuation with values in ℤᵐ⁰, that is with additive values in ℤ ∪ {∞}, satisfies the hypothesis of discreteness of the theorem of MacLane.
    - name: Singularity.macLaneChain_eventually_eq_int
      kind: theorem
      status: proved
      note: The theorem of MacLane for a valuation ν on K[X] with values in ℤᵐ⁰. For each f with ν(f) finite, μᵢ(f) = ν(f) for all large i.
    - name: Singularity.macLaneChainKey_eventually_lt
      kind: theorem
      status: proved
      note: If the values of ν are discrete of rank 1, the chain of MacLane is infinite and the degrees of its key polynomials φᵢ are bounded, then ν(φᵢ) tends to ∞ in additive notation.
    - name: Singularity.macLaneChainKey_eventually_lt_of_map_eq_zero
      kind: theorem
      status: proved
      note: If the values of ν are discrete of rank 1, ν has a nonzero support and the chain of MacLane is infinite, then ν(φᵢ) tends to ∞ in additive notation.
    - name: Singularity.ContinuousFamily.val_mem_range
      kind: theorem
      status: proved
      note: If ν agrees with μ in degree less than the degree of a continuous family and the values γᵢ are values of ν, then each value μᵢ(f) is a value of ν.
    - name: Singularity.ContinuousFamily.eventually_value_lt
      kind: theorem
      status: proved
      note: If the values of ν are discrete of rank 1 and the values γᵢ of a continuous family are values of ν, then γᵢ tends to ∞ in additive notation.
    - name: Singularity.ContinuousFamily.eq_zero_of_not_isStable
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, if φ is unstable for a continuous family and γ ≥ μᵢ(φ) for each i in additive notation, then γ = ∞.
    - name: Singularity.ContinuousFamily.isStable_of_map_ne_zero
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, for a continuous family below ν, each polynomial f with ν(f) finite is stable.
    - name: Singularity.ContinuousFamily.eventually_val_eq_of_map_ne_zero
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, ν is the limit of a continuous family below ν on each f with ν(f) finite.
    - name: Singularity.ContinuousFamily.isStable_of_supp_eq_bot
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, if ν has support 0, then each polynomial is stable for a continuous family below ν.
    - name: Singularity.ContinuousFamily.stableValue_eq_of_supp_eq_bot
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, if ν has support 0, then the limit of a continuous family below ν is ν.
    - name: Singularity.ContinuousFamily.not_isLimitKeyPolynomial
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, if ν has support 0, then a continuous family below ν has no limit key polynomial.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.map_eq_zero
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, a limit key polynomial φ of a continuous family below ν has ν(φ) = ∞.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.eq_zero_of_le
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, the limit augmentation [μ_∞; φ, γ] is defined only for γ = ∞.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_eq
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, the limit augmentation [μ_∞; φ, ν(φ)] takes the values of ν.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuationFun_eq_of_le
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, each limit augmentation [μ_∞; φ, γ] of a continuous family below ν takes the values of ν.
    - name: Singularity.ContinuousFamily.IsLimitKeyPolynomial.limitAugmentedValuation_eq
      kind: theorem
      status: proved
      note: In the discrete case of rank 1, each limit augmentation of a continuous family below ν is ν. So a limit step is the last step of the chain.
    - name: Singularity.logJacobianOrder_eq_zero_iff_exists
      kind: theorem
      status: proved
      note: The order rho of the residual log-Jacobian ideal is 0 if and only if r_i G(0) is not 0 for some i in Delta, or the constant term of the derivative of G along x_j is not 0 for some j not in Delta. The polynomial g need not be clean (Volume 7, Section 3.5 of the handbook).
    - name: Singularity.exists_not_dvd_divisorExponent_of_constantCoeff_ne_zero
      kind: theorem
      status: proved
      note: For a clean g with G(0) not 0, p does not divide r_i for some i in Delta. The coefficient of x^r in g is G(0), and r is supported in Delta (Volume 7, Section 3.5 of the handbook).
    - name: Singularity.logJacobianOrder_eq_zero_of_type_zero
      kind: theorem
      status: proved
      note: If G(0) is not 0 and p does not divide r_i for some i in Delta, then rho = 0 (Proposition 3.5.1 of Volume 7, Section 3.5 of the handbook).
    - name: Singularity.logJacobianOrder_eq_zero_of_type_one
      kind: theorem
      status: proved
      note: If the constant term of the derivative of G along x_j is not 0 for some j not in Delta, then rho = 0 (Proposition 3.5.1 of Volume 7, Section 3.5 of the handbook).
    - name: Singularity.logJacobianOrder_eq_zero_type_zero
      kind: theorem
      status: proved
      note: Type 0 of the end case. For a clean g with ord G = 0, rho = 0, G(0) is not 0, and p does not divide r_i for some i in Delta (Proposition 3.5.1 of Volume 7, Section 3.5 of the handbook).
    - name: Singularity.exists_constantCoeff_pderiv_ne_zero_of_constantCoeff_eq_zero
      kind: theorem
      status: proved
      note: If rho = 0 and G(0) = 0, then the constant term of the derivative of G along x_j is not 0 for some j not in Delta (Volume 7, Section 3.5 of the handbook).
    - name: Singularity.exists_constantCoeff_pderiv_ne_zero
      kind: theorem
      status: proved
      note: Type 1 of the end case. If rho = 0 and ord G = 1, then the constant term of the derivative of G along x_j is not 0 for some j not in Delta (Proposition 3.5.1 of Volume 7, Section 3.5 of the handbook).
    - name: Singularity.ord_residualFactor_le_one
      kind: theorem
      status: proved
      note: If rho = 0, then ord G is at most 1 (Volume 7, Section 3.5 of the handbook).
    - name: Singularity.logJacobianOrder_eq_zero_iff
      kind: theorem
      status: proved
      note: The end case of the log-Jacobian route (Proposition 3.5.1 of Volume 7, Section 3.5 of the handbook). For a clean g, rho = 0 if and only if G(0) is not 0 and p does not divide r_i for some i in Delta, or G(0) = 0 and the constant term of the derivative of G along x_j is not 0 for some j not in Delta.
    - name: Singularity.logJacobianOrder_eq_zero_iff_ord
      kind: theorem
      status: proved
      note: The end case with the order of G (Proposition 3.5.1 of Volume 7, Section 3.5 of the handbook). For a clean g, rho = 0 if and only if ord G = 0 and p does not divide r_i for some i in Delta, or ord G = 1 and the constant term of the derivative of G along x_j is not 0 for some j not in Delta.
    - name: Singularity.cpOmega_of_exists
      kind: theorem
      status: proved
      note: Definition 3.2.5 of Volume 6, Section 3.2 of the handbook. If the derivative of the initial form F of g along a free coordinate is not 0, then omega is the residual order minus 1.
    - name: Singularity.cpOmega_of_forall
      kind: theorem
      status: proved
      note: Definition 3.2.5 of Volume 6, Section 3.2 of the handbook. If the derivatives of the initial form F of g along all the free coordinates are 0, then omega is the residual order.
    - name: Singularity.cpOmega_eq_logJacobianOrder
      kind: theorem
      status: proved
      note: Proposition 3.6.1 of Volume 7, Section 3.6 of the handbook. For a clean g other than 0, the invariant omega of Cossart and Piltant (Volume 6, Definition 3.2.5, and [CP19, Definition 2.68]) is the order rho of the log-Jacobian ideal.
    - name: Singularity.cpOmega_cleanPart_le
      kind: theorem
      status: proved
      note: Corollary 3.6.2 of Volume 7, Section 3.6 of the handbook. For a clean g other than 0 with ord g at least p and pi(g) = x_j^p g' in a chart of the point blowup, omega of the clean part of g' is at most omega of g.
    - name: Singularity.cpOmega_cleanPart_le_center
      kind: theorem
      status: proved
      note: Corollary 3.6.3 of Volume 7, Section 3.6 of the handbook. For a clean g and the blowup of a regular center with (H1) and (H2), omega of the clean part of g' is at most omega of g.
    - name: Singularity.centerExample_cpOmega
      kind: theorem
      status: proved
      note: Example 3.6.4 of Volume 7, Section 3.6 of the handbook. Over F_2, omega of g = y^2 w + y^3 along the divisor V(w) is 2.
    - name: Singularity.centerExample_cpOmega_cleanPart
      kind: theorem
      status: proved
      note: Example 3.6.4 of Volume 7, Section 3.6 of the handbook. Over F_2, omega of the clean part of g' = y^2 w + x y^3 along the new divisor V(x w) is 3.
    - name: Singularity.centerExample_cpOmega_lt
      kind: theorem
      status: proved
      note: Example 3.6.4 of Volume 7, Section 3.6 of the handbook. Under the blowup of the center V(x, y) of Example 3.4.6, omega goes up from 2 to 3.
    - name: Singularity.chartVector_mem_directrix_of_logJacobianOrder_eq
      kind: theorem
      status: proved
      note: Theorem 3.7.1, part 1, of Volume 7, Section 3.7 of the handbook. Let g be clean and not 0 with ord g at least p, let pi(g) = x_j^p g' in a chart of the point blowup, and let rho(g'_c) = rho(g) = m. For each psi with x^r psi in Theta_0(g) and ord psi = m, the vector of the chart lies in the directrix of the part of psi of degree m.
    - name: Singularity.chartVector_mem_directrix_of_logJacobianOrder_eq_of_idealOrd
      kind: theorem
      status: proved
      note: Theorem 3.7.1, part 2, of Volume 7, Section 3.7 of the handbook. If rho(g'_c) = m and the order of Theta_0(g) is |r| + m + 1, then for each psi with x^r psi in Theta(g) and ord psi = m, the vector of the chart lies in the directrix of the part of psi of degree m.
    - name: Singularity.logJacobianOrder_cleanPart_lt_of_directrix_eq_bot
      kind: theorem
      status: proved
      note: Corollary 3.7.2 of Volume 7, Section 3.7 of the handbook, in the case of part 1 of Theorem 3.7.1. If rho(g) = m and the directrix of the part of degree m of psi is 0, then rho(g'_c) < m in each chart.
    - name: Singularity.logJacobianOrder_cleanPart_lt_of_directrix_eq_bot_of_idealOrd
      kind: theorem
      status: proved
      note: Corollary 3.7.2 of Volume 7, Section 3.7 of the handbook, in the case of part 2 of Theorem 3.7.1. If the order of Theta_0(g) is |r| + m + 1 and the directrix of the part of degree m of psi is 0, then rho(g'_c) < m in each chart.
    - name: Singularity.chartVector_mem_directrix_initialForm_of_logJacobianOrder_eq
      kind: theorem
      status: proved
      note: Corollary 3.7.3 of Volume 7, Section 3.7 of the handbook. If rho(g'_c) = rho(g) = ord G = d and |r| + d is not 0 in k, then the vector of the chart lies in the directrix of the initial form of G.
    - name: Singularity.chartVector_mem_directrix_pderiv_initialForm_of_logJacobianOrder_eq
      kind: theorem
      status: proved
      note: Corollary 3.7.3 of Volume 7, Section 3.7 of the handbook. Let d = ord G and let l be a free coordinate with a derivative of the initial form of G along x_l other than 0. If rho(g'_c) = d - 1, then the vector of the chart lies in the directrix of this derivative.
    - name: Singularity.nearPointExample_not_mem_directrix
      kind: theorem
      status: proved
      note: Example 3.7.4 of Volume 7, Section 3.7 of the handbook. Over F_3, for g = x^3 y^2 + x^4 and E = V(x), rho(g) = 1 and rho(g'_c) = 1 in the y-chart. The element psi = 2y has x^r psi in Theta(g) and order 1, but the vector of the chart is not in the directrix of psi. So part 1 of Theorem 3.7.1 is false with Theta(g) in the place of Theta_0(g).
    - name: Singularity.homogeneousComponent_mem_span_of_mem_span
      kind: theorem
      status: proved
      note: Volume 7, Section 3.8 of the handbook, the lemma for the definition of T_rho(g). If each element of S has order at least n, then the part of degree n of each element of the ideal generated by S is a k-linear combination of the parts of degree n of the elements of S.
    - name: Singularity.le_directrix_homogeneousComponent_of_mem_span
      kind: theorem
      status: proved
      note: Volume 7, Section 3.8 of the handbook. If each element of S has order at least n and W is in the directrix of the part of degree n of each element of S, then W is in the directrix of the part of degree n of each element of the ideal generated by S.
    - name: Singularity.finrank_iInf_directrix_pointChart_le
      kind: theorem
      status: proved
      note: The dimension inequality for the weak transforms, Volume 7, Section 3.8 of the handbook. Let ord psi_i >= m, let the x_j-chart send psi_i to x_j^m psi'_i, and let ord psi'_i >= m. Then the dimension of the intersection of the directrices of the parts of degree m of the psi'_i is at most the dimension of the intersection of the directrices of the parts of degree m of the psi_i.
    - name: Singularity.finrank_logJacobianDirectrix_cleanPart_le
      kind: theorem
      status: proved
      note: Proposition 3.8.2 of Volume 7, Section 3.8 of the handbook. Let g /= 0 be clean with ord g >= p, let the chart send g to x_j^p g', and let rho(g'_c) = rho(g) = m. If the new point is of case B, that is the order of Theta_0(g'_c) is |r'| + m + 1, then dim T_rho(g'_c) <= dim T_rho(g).
    - name: Singularity.logJacobianDirectrixCodim_le_cleanPart
      kind: theorem
      status: proved
      note: Proposition 3.8.2 of Volume 7, Section 3.8 of the handbook, the form with the codimension. Under the same hypotheses, tau_rho(g) <= tau_rho(g'_c).
    - name: Singularity.tauRhoExample_cases
      kind: theorem
      status: proved
      note: Example 3.8.3 of Volume 7, Section 3.8 of the handbook. Over F_2, for g = x y z^2 + y^2 z + x z^2 and E = empty, the point is of case B. At the origin of the x-chart, E' = V(x) and the new point is of case A.
    - name: Singularity.tauRhoExample_finrank
      kind: theorem
      status: proved
      note: Example 3.8.3 of Volume 7, Section 3.8 of the handbook. Over F_2, rho(g) = 2 and dim T_rho(g) = 1. At the origin of the x-chart, rho(g'_c) = 2 and dim T_rho(g'_c) = 2. So tau_rho goes down from 2 to 1 at this new point of case A, and the case condition of Proposition 3.8.2 is necessary.
    - name: Singularity.pderiv_eq_zero_of_mem_directrix
      kind: theorem
      status: proved
      note: Lemma 3.9.2 of Volume 7, Section 3.9 of the handbook. If v is in the directrix of F and in the directrix of c F + x_i d_i F, and v_i /= 0, then d_i F = 0. So Phi_i = r_i F.
    - name: Singularity.finrank_logJacobianDirectrix_cleanPart_le_of_caseA
      kind: theorem
      status: proved
      note: Theorem 3.9.1 of Volume 7, Section 3.9 of the handbook, in the case where |r| + d is not 0 in k. Let g /= 0 be clean with ord g >= p, let g = x^r G with d = ord G, let the chart send g to x_j^p g', and let rho(g) = rho(g'_c) = d. If the new point is of case A, that is the order of Theta_0(g'_c) is |r'| + d, and |r| + d /= 0 in k, then dim T_rho(g'_c) <= dim T_rho(g). The old point is then of case A. Example 3.9.5 shows that the hypothesis |r| + d /= 0 is necessary.
    - name: Singularity.logJacobianDirectrixCodim_le_cleanPart_of_caseA
      kind: theorem
      status: proved
      note: Theorem 3.9.1 of Volume 7, Section 3.9 of the handbook, the form with the codimension. Under the same hypotheses, tau_rho(g) <= tau_rho(g'_c).
    - name: Singularity.tauRhoCaseAExample_hyp
      kind: theorem
      status: proved
      note: Example 3.9.4 of Volume 7, Section 3.9 of the handbook, the data. Over F_2, for g = x z^2 + x^2 y^3 and E = V(x), r = (1, 0, 0), G = z^2 + x y^3 and e_x = z^2. In the y-chart with t_x = 1 and t_z = 0, g goes to y^2 g' with g' = y ((x + 1) z^2 + y^2 (x^2 + 1)), and E' = V(y).
    - name: Singularity.tauRhoCaseAExample_not_mem
      kind: theorem
      status: proved
      note: Example 3.9.4 of Volume 7, Section 3.9 of the handbook. The polynomial g' is clean, and neither y z^2 nor y (x + 1) z^2 is in Theta_0(g'_c). So the plain transports of e_x are not enough, and the proof of Theorem 3.9.1 needs the exact transports of Lemma 3.9.3.
    - name: Singularity.tauRhoDropExample_hyp
      kind: theorem
      status: proved
      note: Example 3.9.5 of Volume 7, Section 3.9 of the handbook, the data. Over F_2, for g = x z^2 w u^2 + x y z w u^2 and E = V(x y z w), g /= 0 is clean with ord g >= 2, r = (1, 0, 1, 1, 0) and G = (y + z) u^2. So |r| + d = 6 = 0 in F_2. In the w-chart with t_x = 1 and t_i = 0 for i /= x, g goes to w^2 g' with g' = w^4 (x + 1) (z^2 + y z) u^2, E' = V(y z w), and g'_c = w^4 (x z^2 u^2 + (x + 1) y z u^2).
    - name: Singularity.tauRhoDropExample_cases
      kind: theorem
      status: proved
      note: Example 3.9.5 of Volume 7, Section 3.9 of the handbook. The old point and the new point are of case A.
    - name: Singularity.tauRhoDropExample_finrank
      kind: theorem
      status: proved
      note: Example 3.9.5 of Volume 7, Section 3.9 of the handbook. rho(g) = rho(g'_c) = 3, dim T_rho(g) = 2 and dim T_rho(g'_c) = 3. So the hypothesis |r| + d /= 0 in k of Theorem 3.9.1 is necessary.
    - name: Singularity.tauRhoDropExample_codim
      kind: theorem
      status: proved
      note: Example 3.9.5 of Volume 7, Section 3.9 of the handbook, the form with the codimension. tau_rho(g) = 3 and tau_rho(g'_c) = 2. So tau_rho goes down from case A to case A.
    - name: Singularity.idealOrd_logJacobianTangent_cleanPart_of_caseA
      kind: theorem
      status: proved
      note: Proposition 3.9.7 of Volume 7, Section 3.9 of the handbook. Let g /= 0 be clean with ord g >= p, let g = x^r G with d = ord G, let the chart send g to x_j^p g', and let rho(g) = rho(g'_c) = d. If |r| + d /= 0 in k, then the new point is of case A, that is the order of Theta_0(g'_c) is |r'| + d. The proof uses the transport of the Euler element. Example 3.9.9 shows that the hypothesis |r| + d /= 0 in k is necessary.
    - name: Singularity.finrank_logJacobianDirectrix_cleanPart_le_of_ne_zero
      kind: theorem
      status: proved
      note: Corollary 3.9.8 of Volume 7, Section 3.9 of the handbook. This is Theorem 3.9.1 with no hypothesis on the new point. Let g /= 0 be clean with ord g >= p, let g = x^r G with d = ord G, let the chart send g to x_j^p g', and let rho(g) = rho(g'_c) = d. If |r| + d /= 0 in k, then dim T_rho(g'_c) <= dim T_rho(g).
    - name: Singularity.logJacobianDirectrixCodim_le_cleanPart_of_ne_zero
      kind: theorem
      status: proved
      note: Corollary 3.9.8 of Volume 7, Section 3.9 of the handbook, the form with the codimension. Under the same hypotheses, tau_rho(g) <= tau_rho(g'_c).
    - name: Singularity.caseAToCaseBExample_hyp
      kind: theorem
      status: proved
      note: Example 3.9.9 of Volume 7, Section 3.9 of the handbook, the data. Over F_3, for g = x^3 y^2 z^3 + 2 x^2 y^3 z and E = V(x z), g /= 0 is clean with ord g >= 3, r = (2, 0, 1) and G = x y^2 z^2 + 2 y^3 with d = ord G = 3. So |r| + d = 6 = 0 in F_3. In the x-chart with t_z = 1 and t_x = t_y = 0, g goes to x^3 g' with g' = x^5 y^2 (z + 1)^3 + 2 x^3 y^3 (z + 1), E' = V(x), and g'_c = x^5 y^2 z^3 + x^5 y^2 + 2 x^3 y^3 z. Also r' = (3, 0, 0) and G' = x^2 y^2 (z^3 + 1) + 2 y^3 z.
    - name: Singularity.caseAToCaseBExample_cases
      kind: theorem
      status: proved
      note: Example 3.9.9 of Volume 7, Section 3.9 of the handbook. The old point is of case A, and the new point is of case B.
    - name: Singularity.caseAToCaseBExample_rho
      kind: theorem
      status: proved
      note: Example 3.9.9 of Volume 7, Section 3.9 of the handbook. rho(g) = rho(g'_c) = 3.
    - name: Singularity.caseAToCaseBExample_not_caseA
      kind: theorem
      status: proved
      note: Example 3.9.9 of Volume 7, Section 3.9 of the handbook. |r| + d = 0 in F_3, and the order of Theta_0(g'_c) is not |r'| + d. The other hypotheses of Proposition 3.9.7 hold. So the hypothesis |r| + d /= 0 in k of Proposition 3.9.7 is necessary.
    - name: Singularity.caseAToCaseBExample_finrank
      kind: theorem
      status: proved
      note: Example 3.9.9 of Volume 7, Section 3.9 of the handbook. dim T_rho(g) = 2 and dim T_rho(g'_c) = 1.
    - name: Singularity.caseAToCaseBExample_codim
      kind: theorem
      status: proved
      note: Example 3.9.9 of Volume 7, Section 3.9 of the handbook, the form with the codimension. tau_rho(g) = 1 and tau_rho(g'_c) = 2. So tau_rho goes up from case A to case B.
    - name: Singularity.idealOrd_logJacobianTangent_cleanPart_of_ne_of_eq_zero
      kind: theorem
      status: proved
      note: Theorem 3.9.10 of Volume 7, Section 3.9 of the handbook, the form with the index i. Let g /= 0 be clean with ord g >= p, let the chart send g to x_j^p g', let the order of Theta_0(g) be |r| + d, and let rho(g'_c) = d. Let i in Delta with i /= j and t_i = 0, and let ord e_i = d with e_i = r_i G + x_i d_i G. Then the new point is of case A, that is the order of Theta_0(g'_c) is |r'| + d. There is no hypothesis on p.
    - name: Singularity.idealOrd_logJacobianTangent_cleanPart_of_lt_ord
      kind: theorem
      status: proved
      note: Theorem 3.9.10 of Volume 7, Section 3.9 of the handbook, the form with R = {j}. Let g /= 0 be clean with ord g >= p, let the chart send g to x_j^p g', let rho(g) = d, let the order of Theta_0(g) be |r| + d, and let rho(g'_c) = d. If ord e_j = d and d < ord e_i for each other i in Delta, then the new point is of case A. The proof uses the transport of the Euler element. There is no hypothesis on p.
    - name: Singularity.idealOrd_logJacobianTangent_cleanPart_of_forall_eq_zero
      kind: theorem
      status: proved
      note: Theorem 3.9.10 of Volume 7, Section 3.9 of the handbook, the form with no leaving component. Let g /= 0 be clean with ord g >= p, let the chart send g to x_j^p g', let rho(g) = d, let the order of Theta_0(g) be |r| + d, and let rho(g'_c) = d. If t_i = 0 for each i in Delta with i /= j, then the new point is of case A. There is no hypothesis on p.
    - name: Singularity.finrank_logJacobianDirectrix_cleanPart_le_of_forall_eq_zero
      kind: theorem
      status: proved
      note: Theorem 3.9.11 of Volume 7, Section 3.9 of the handbook. Let g /= 0 be clean with ord g >= p, let g = x^r G with d = ord G, let the chart send g to x_j^p g', let rho(g) = d, let the order of Theta_0(g) be |r| + d, and let rho(g'_c) = d. If t_i = 0 for each i in Delta with i /= j, then dim T_rho(g'_c) <= dim T_rho(g). There is no hypothesis on p.
    - name: Singularity.logJacobianDirectrixCodim_le_cleanPart_of_forall_eq_zero
      kind: theorem
      status: proved
      note: Theorem 3.9.11 of Volume 7, Section 3.9 of the handbook, the form with the codimension. Under the same hypotheses, tau_rho(g) <= tau_rho(g'_c).
    - name: Singularity.logJacobianFullDirectrix_le_logJacobianDirectrix
      kind: theorem
      status: proved
      note: Volume 7, Section 3.8 of the handbook. The full directrix T~(g) uses Theta(g) in the two cases. Since Theta_0(g) is in Theta(g), T~(g) is in T_rho(g).
    - name: Singularity.logJacobianFullDirectrix_eq_of_ne
      kind: theorem
      status: proved
      note: Volume 7, Section 3.8 of the handbook. If the order of Theta_0(g) is not |r| + rho (case B), then T~(g) = T_rho(g).
    - name: Singularity.logJacobianDirectrixCodim_le_fullDirectrixCodim
      kind: theorem
      status: proved
      note: Volume 7, Section 3.8 of the handbook, the form with the codimension. tau_rho(g) <= tau~(g).
    - name: Singularity.finrank_logJacobianFullDirectrix_cleanPart_le_logJacobianDirectrix
      kind: theorem
      status: proved
      note: Volume 7, Section 3.8 of the handbook. Let g /= 0 be clean with ord g >= p, let the chart send g to x_j^p g', and let rho(g'_c) = rho(g). Then dim T~(g'_c) <= dim T_rho(g). There is no hypothesis on the cases.
    - name: Singularity.finrank_logJacobianFullDirectrix_cleanPart_le
      kind: theorem
      status: proved
      note: Theorem 3.8.4 of Volume 7, Section 3.8 of the handbook. Let g /= 0 be clean with ord g >= p, let the chart send g to x_j^p g', let rho(g) = rho(g'_c) = m, and let the order of Theta_0(g) be |r| + m + 1 (case B). Then dim T~(g'_c) <= dim T~(g). There is no hypothesis on the case of the new point.
    - name: Singularity.logJacobianFullDirectrixCodim_le_cleanPart
      kind: theorem
      status: proved
      note: Theorem 3.8.4 of Volume 7, Section 3.8 of the handbook, the form with the codimension. Under the same hypotheses, tau~(g) <= tau~(g'_c).
    - name: Singularity.finrank_logJacobianFullDirectrix_cleanPart_le_of_ne
      kind: theorem
      status: proved
      note: Theorem 3.8.4 of Volume 7, Section 3.8 of the handbook, the form with the hypothesis that the order of Theta_0(g) is not |r| + rho.
    - name: Singularity.logJacobianFullDirectrixCodim_le_cleanPart_of_ne
      kind: theorem
      status: proved
      note: Theorem 3.8.4 of Volume 7, Section 3.8 of the handbook, the form with the codimension and with the hypothesis that the order of Theta_0(g) is not |r| + rho.
    - name: Singularity.fullDirectrixExample_hyp
      kind: theorem
      status: proved
      note: Example 3.8.5 of Volume 7, Section 3.8 of the handbook. Over F_2, g = y z^2 + x z and E = V(x z). g is clean, ord g = 2, the y-chart at the origin sends g to y^2 g, the new divisor is V(x y z), g'_c = g, r = r' = (0, 0, 1) and G = G' = y z + x.
    - name: Singularity.fullDirectrixExample_rho
      kind: theorem
      status: proved
      note: Example 3.8.5 of Volume 7, Section 3.8 of the handbook. rho(g) = rho(g'_c) = 1.
    - name: Singularity.fullDirectrixExample_cases
      kind: theorem
      status: proved
      note: Example 3.8.5 of Volume 7, Section 3.8 of the handbook. The old and the new points are of case A.
    - name: Singularity.fullDirectrixExample_finrank
      kind: theorem
      status: proved
      note: Example 3.8.5 of Volume 7, Section 3.8 of the handbook. dim T_rho(g) = 2, dim T~(g) = 1, dim T_rho(g'_c) = 2 and dim T~(g'_c) = 2.
    - name: Singularity.fullDirectrixExample_codim
      kind: theorem
      status: proved
      note: Example 3.8.5 of Volume 7, Section 3.8 of the handbook, the form with the codimension. tau_rho(g) = tau_rho(g'_c) = 1, tau~(g) = 2 and tau~(g'_c) = 1. So tau~ goes down at a step from case A, and the case condition of Theorem 3.8.4 is necessary.
    - name: Singularity.ord_eq_degree_divisorExponent_add
      kind: theorem
      status: proved
      note: Volume 7, Section 3.10 of the handbook. For g = x^r G, ord g = |r| + ord G.
    - name: Singularity.idealOrd_logJacobianTangent_eq_ord
      kind: theorem
      status: proved
      note: Lemma 3.10.1 of Volume 7, Section 3.10 of the handbook. If g /= 0 is clean, then the order of Theta_0(g) is ord g. So sigma = d.
    - name: Singularity.idealOrd_logJacobianTangent_eq_degree_add_residualOrderAlong
      kind: theorem
      status: proved
      note: Lemma 3.10.1 of Volume 7, Section 3.10 of the handbook, the form with the residual order. If g /= 0 is clean, then the order of Theta_0(g) is |r| + d.
    - name: Singularity.idealOrd_logJacobianTangent_eq_degree_add_iff
      kind: theorem
      status: proved
      note: Lemma 3.10.1 of Volume 7, Section 3.10 of the handbook. Case A is the type 0. If g /= 0 is clean, then the order of Theta_0(g) is |r| + rho if and only if rho = d.
    - name: Singularity.idealOrd_logJacobianTangent_eq_degree_add_add_one_iff
      kind: theorem
      status: proved
      note: Lemma 3.10.1 of Volume 7, Section 3.10 of the handbook. Case B is the type 1. If g /= 0 is clean, then the order of Theta_0(g) is |r| + rho + 1 if and only if rho + 1 = d.
    - name: Singularity.residualOrderAlong_cleanPart_le_of_forall_eq_zero
      kind: theorem
      status: proved
      note: Theorem 3.10.3 of Volume 7, Section 3.10 of the handbook. Let g /= 0 be clean with ord g >= p, let the chart send g to x_j^p g', let rho(g) = rho(g'_c) = m, and let t_i = 0 for each i in Delta with i /= j. Then d' <= d.
    - name: Singularity.logJacobianDirectrixCodim_le_cleanPart_of_residualOrderAlong_eq
      kind: theorem
      status: proved
      note: Theorem 3.10.3 of Volume 7, Section 3.10 of the handbook. Under the same hypotheses, if d' = d, then tau_rho(g) <= tau_rho(g'_c).
    - name: Singularity.logJacobianDirectrixCodim_le_of_rhoStep
      kind: theorem
      status: proved
      note: Volume 7, Section 3.11 of the handbook. If a step keeps rho and the new point is of case B, then tau_rho does not go down. There is no hypothesis on the case of the old point, and a component of the divisor can leave.
    - name: Singularity.logJacobianDirectrixCodim_le_fullDirectrixCodim_of_rhoStep
      kind: theorem
      status: proved
      note: Volume 7, Section 3.11 of the handbook. If a step keeps rho, then tau_rho of the old point is at most tau~ of the new point. There is no hypothesis on the cases.
    - name: Singularity.logJacobianDirectrixCodim_le_of_reflTransGen
      kind: theorem
      status: proved
      note: Proposition 3.11.1 of Volume 7, Section 3.11 of the handbook. Along a run of steps that keep rho into points of case B, tau_rho does not go down.
    - name: Singularity.logJacobianDirectrixCodim_le_fullDirectrixCodim_of_reflTransGen
      kind: theorem
      status: proved
      note: Proposition 3.11.1 of Volume 7, Section 3.11 of the handbook. Let P_0, ..., P_m be a sequence of steps that keep rho, with P_1, ..., P_(m-1) of case B. Then tau_rho(P_0) <= tau~(P_m).
    - name: Singularity.KangarooPathConjecture
      kind: statement
      status: open
      note: Conjecture 3.11.3 of Volume 7, Section 3.11 of the handbook. On a kangaroo path with P_0 and P_m of case A and m >= 2, tau_rho(P_0) <= tau_rho(P_m). This is a definition of a proposition. The statement is false, since Example 3.11.6 of the handbook is a counterexample with p = 2 and three variables. It holds if tau_rho(P_0) <= 1 (Singularity.kangarooPath_of_codim_le_one). The negation for p = 2, three variables and ZMod 2 is Singularity.KangarooCounterexample.not_kangarooPathConjecture.
    - name: Singularity.KangarooCounterexample.not_kangarooPathConjecture
      kind: theorem
      status: proved
      note: Example 3.11.6 of Volume 7, Section 3.11 of the handbook. The kangaroo path conjecture is false for p = 2, three variables and the field ZMod 2. The path starts at g_0 = x^2 y^3 z + x^2 y z^3 + x^4 y z^2 with Delta = {y, z}. It goes by the y-chart at z = 1 to a point of case B, and by the y-chart at the origin to a point of case A. The order rho is 4 at each point, and tau_rho goes down from 2 to 1.
    - name: Singularity.KangarooExample.kangarooExample
      kind: theorem
      status: proved
      note: Example 3.11.2 of Volume 7, Section 3.11 of the handbook. The field is ZMod 2, so p = 2, and there are three variables. The path starts at g_0 = x^3 z + x z^3 + x^4 y z with Delta = {x, z}. It goes by the x-chart at y = z = 1 to a point of case B with Delta = {x}, and by the y-chart at the origin to a point of case A with Delta = {x, y}. The order rho is 2 at each point, and tau_rho is 1, 2 and 1 at the three points.
    - name: Singularity.CurveRuns.curveRun
      kind: theorem
      status: proved
      note: Example 3.12.2 of Volume 7, Section 3.12 of the handbook. The field is ZMod 2, so p = 2, and there are three variables. For each k, the point P_k has Delta = {y} and g_k = x^4 y^(2k+1) + x^2 y^(3k+1) z^3. The origin of the y-chart sends P_k to P_(k+1) with no cleaning, and rho = 4 at each point. The points are distinct, so the run is infinite and is not a cycle. The proof is symbolic in k.
    - name: Singularity.CurveRuns.logJacobianOrder_localPoint_curvePoint
      kind: theorem
      status: proved
      note: Example 3.12.2, part 3, of Volume 7, Section 3.12 of the handbook, at the point (0, 1, 0) of the curve x = z = 0. At this point the divisor is empty, and rho of the clean part of g_0(x, y + 1, z) is 4. The point at a is Singularity.localPoint, a definition of this file.
    - name: Singularity.CurveRuns.isolatedRun
      kind: theorem
      status: proved
      note: Example 3.12.4 of Volume 7, Section 3.12 of the handbook. The field is ZMod 2, so p = 2, and there are three variables. For each k, the point P_k has Delta = {x, z} and g_k = x^(5+3k) y^2 z^3 + x^(10+3k) y^3 z^2. The origin of the x-chart sends P_k to P_(k+1) with no cleaning, and rho = 3 at each point. The points are distinct, so the run is infinite. The proof is symbolic in k.
    - name: Singularity.CurveRuns.logJacobianOrder_localPoint_isolatedPoint
      kind: theorem
      status: proved
      note: Example 3.12.4, part 4, of Volume 7, Section 3.12 of the handbook, at the point (1, 0, 0) of the x-axis. At this point the divisor is {z}, g_0(x + 1, y, z) is clean, and rho = 2. The isolation of the origin in the locus where rho >= 3 is not proved, since it is a statement over an algebraically closed field.
    - name: Singularity.logJacobianDirectrix_eq_iInf_caseAForm
      kind: theorem
      status: proved
      note: Lemma 3.11.4 of Volume 7, Section 3.11 of the handbook. If g is of case A and rho = m, then T_rho(g) is the intersection of the directrices of the forms E_i F = r_i F + x_i d_i F for i in Delta, with F the part of degree m of G. There is no hypothesis on k and no hypothesis that g is clean.
    - name: Singularity.eq_zero_of_directrix_eq_top
      kind: theorem
      status: proved
      note: A polynomial with constant term 0 and with the full space as directrix is 0. The proof works over each field, also over a finite field.
    - name: Singularity.one_le_logJacobianDirectrixCodim_of_caseA
      kind: theorem
      status: proved
      note: At a point of case A with rho = m and m at least 1, tau_rho is at least 1.
    - name: Singularity.kangarooPath_of_codim_le_one
      kind: theorem
      status: proved
      note: Proposition 3.11.5 of Volume 7, Section 3.11 of the handbook. The conclusion of Conjecture 3.11.3 holds if tau_rho(P_0) is at most 1.
    - name: Singularity.exists_macLaneVaquieStep_or_forall_isStable
      kind: theorem
      status: proved
      note: One round of the chain of MacLane-Vaquié in degree d. One ordinary or limit step gives agreement with ν in degree at most d, or ν is the limit of the complete family in degree d.
    - name: Singularity.exists_macLaneVaquie_seq_or_forall_isStable
      kind: theorem
      status: proved
      note: The chain of MacLane-Vaquié with limit steps. Either ν is the limit of a chain w_n with w_n = ν in degree at most n, or ν is the limit of a continuous family over a valuation of the chain.
    - name: Singularity.reflTransGen_macLaneVaquieStep_of_map_eq_zero
      kind: theorem
      status: proved
      note: Part 4 of MacLane-Vaquié for a valuation with nonzero support and any value group. Finitely many ordinary or limit steps reach ν.
    - name: Singularity.reflTransGen_monomialValuation_of_map_eq_zero
      kind: theorem
      status: proved
      note: Part 4 of MacLane-Vaquié for a valuation with nonzero support, from the first valuation [v; X, ν(X)] of the chain.
    - name: Singularity.reflTransGen_macLaneVaquieStep_of_isMuMinimal
      kind: theorem
      status: proved
      note: Part 4 of MacLane-Vaquié for a valuation with a monic ν-minimal polynomial of positive degree, with any value group and any support. Finitely many ordinary or limit steps reach ν.
    - name: Singularity.reflTransGen_macLaneVaquieStep_iff_exists_keyPolynomial
      kind: theorem
      status: proved
      note: The criterion for a finite chain of MacLane-Vaquié. For w₀ ≠ ν, finitely many steps reach ν if and only if ν has a key polynomial.
    - name: Singularity.reflTransGen_macLaneVaquieStep_or_forall_not_keyPolynomial
      kind: theorem
      status: proved
      note: Part 4 of MacLane-Vaquié with three cases. A finite chain reaches ν, or ν has no key polynomial and is the limit of an infinite chain or of a continuous family over a valuation of the chain.
    - name: Singularity.Fidelity.isResolution_id
      kind: theorem
      status: proved
    - name: Singularity.Fidelity.not_isResolution_codiag
      kind: theorem
      status: proved
    - name: Singularity.resolutionInDim_dim_zero
      kind: theorem
      status: proved
    - name: Singularity.purelyInseparableHypersurfaceResolution_of_resolutionInDim
      kind: theorem
      status: proved
    - name: Singularity.purelyInseparableHypersurfaceResolution_four
      kind: theorem
      status: proved
    - name: Singularity.Base.integralResolutionInDim_zero
      kind: theorem
      status: proved
      note: In the package base/. It depends on resolutionorg/hironaka.
    - name: Singularity.resolutionInDim_zero
      kind: theorem
      status: proved
      note: In the package base/. It takes Singularity.ReductionToIntegral as a hypothesis.
    - name: Singularity.resolutionInDim_charZero
      kind: theorem
      status: proved
      note: In the package base/. It applies resolutionInDim_zero to Singularity.Reduction.reductionToIntegral, so it takes no hypothesis.
    - name: Singularity.Reduction.reductionToIntegral
      kind: theorem
      status: proved
    - name: Singularity.Curves.resolutionInDim_one
      kind: theorem
      status: proved
    - name: Singularity.Base.fcResolutionInDim_of_resolutionInDim
      kind: theorem
      status: proved
      note: In the package base/. The bridge to formal-conjectures in one direction.
    - name: Singularity.Base.fcResolutionCharZero
      kind: theorem
      status: proved
      note: In the package base/. The statement resolution_of_singularities_of_charZero of formal-conjectures.
    - name: Singularity.derivation_mem_pow_succ
      kind: theorem
      status: proved
      note: A derivation D of B maps I^(e+1) into I^e for each ideal I of B. This is the induction step of Volume 6, Lemma 1.2.4 of the handbook.
    - name: Singularity.derivation_mem_pow_pred
      kind: theorem
      status: proved
      note: Volume 6, Lemma 1.2.4 of the handbook. A derivation D of B over R maps I^e into I^(e-1) for each ideal I of B. The statement holds also for e = 0.
    - name: Singularity.addMonoidHom_mem_pow_pred
      kind: theorem
      status: proved
      note: Volume 6, Lemma 1.2.4 of the handbook in the form of the handbook, for an additive map with the Leibniz rule.
    - name: Singularity.pderiv_ne_zero_iff
      kind: theorem
      status: proved
      note: Volume 6, Lemma 4.3.1 of the handbook. Over a field of characteristic p, the partial derivative of F in U_j is not zero if and only if F has a monomial c U^a with c not zero and a_j not divisible by p.
    - name: Singularity.eval_eq_zero_of_mem_pointIdeal
      kind: theorem
      status: proved
      note: Each element of the ideal generated by the X i - C (x i) vanishes at x.
    - name: Singularity.sub_sub_linearPartAt_mem_sq
      kind: theorem
      status: proved
      note: The first order Taylor formula. The polynomial f - f(x) - (sum of the partial derivatives of f at x times X i - x i) is in the square of the ideal of the point x.
    - name: Singularity.mem_pointIdeal_sq_iff
      kind: theorem
      status: proved
      note: A polynomial f is in the square of the ideal of the point x if and only if f and each partial derivative of f vanish at x.
    - name: Singularity.purelyInseparable_mem_pointIdeal_sq_iff
      kind: theorem
      status: proved
      note: The algebraic core of Volume 4, Lemma 2.3.4 of the handbook, for each finite set of variables of G and each commutative ring k with p = 0. The step from the square of the maximal ideal to the singular points (Lemma 2.3.1) is not proved.
    - name: Singularity.purelyInseparable_mem_pointIdeal_sq_iff_fin_two
      kind: theorem
      status: proved
      note: The algebraic core of Volume 4, Lemma 2.3.4 of the handbook with G in k[s, t]. If c^p = G(a, b), then w^p - G is in the square of the maximal ideal of (a, b, c) if and only if G_s(a, b) = G_t(a, b) = 0.
    - name: Singularity.transcendental_factorialSeries
      kind: theorem
      status: proved
      note: Volume 3, Lemma 1.6.5 of the handbook over k[t]. The power series sum of t^(i!) for i at least 1 is transcendental over k[t]. The proof uses the finite number of roots of a polynomial over k[t], not the minimal polynomial.
    - name: Singularity.transcendental_factorialSeries_ratFunc
      kind: theorem
      status: proved
      note: Volume 3, Lemma 1.6.5 of the handbook over k(t). The image of the power series in the Laurent series k((t)) is transcendental over RatFunc k.
    - name: Singularity.coneLemma
      kind: theorem
      status: proved
      note: Volume 5, Lemma 2.1.3 of the handbook. The order of V needs only to be compatible with addition. The proof uses the lattice lemma, not the theorem of Hoelder.
    - name: Singularity.mem_maximalIdeal_of_valuation_sum_lt
      kind: theorem
      status: proved
      note: Volume 3, Lemma 2.3.1 of the handbook, in an elementary form without the quotient P_gamma / P_gamma^+. If the sum of c_k z_k has value larger than v(z_j), then each c_k is in the maximal ideal of R.
    - name: Singularity.IotaIndex.exists_least
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.10 of the handbook, first part. Each nonempty subset of I = {1, ..., p} x N x {1, 2, 3, 4} has a least element for the lexicographic order.
    - name: Singularity.IotaIndex.not_strictAnti
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.10 of the handbook, second part. There is no infinite strictly decreasing sequence in I = {1, ..., p} x N x {1, 2, 3, 4}.
    - name: Singularity.exists_algebraMap_eq_trace
      kind: theorem
      status: proved
      note: Volume 8, Lemma 1.3.1 of the handbook. The trace of an element of L that is integral over a normal domain A is in A. The condition that A is Noetherian is not necessary.
    - name: Singularity.isPurelyInseparable_isGalois_fixedField_top
      kind: theorem
      status: proved
      note: The main part of Volume 8, Proposition 3.1.1 of the handbook. For a finite normal extension L' of K, the fixed field M of the K-automorphisms of L' is purely inseparable over K, and L' is Galois over M.
    - name: Singularity.bijective_restrictScalars_fixedField_top
      kind: theorem
      status: proved
      note: Volume 8, Proposition 3.1.1 of the handbook, last claim. The map from Gal(L'/M) to the group of the K-automorphisms of L' is bijective.
    - name: Singularity.separable_distillation
      kind: theorem
      status: proved
      note: Volume 8, Proposition 3.1.1 of the handbook, with L' the normal closure of L/K in an algebraic closure of L.
    - name: Singularity.not_dvd_finrank_fixedField_sylow
      kind: theorem
      status: proved
      note: Volume 8, Lemma 3.2.2 of the handbook. If [M:K] = p^e with p a prime other than l, and P is an l-Sylow subgroup of Gal(L'/M), then l does not divide [L'^P:K]. The statement uses only the degree of M/K.
    - name: Singularity.IsAbhyankarValuation.nonempty_orderMonoidIso_units_valueGroup
      kind: theorem
      status: proved
      note: Volume 3, Corollary 2.2.4 of the handbook, the last claim. An Abhyankar valuation with rational rank 1 has a value group that is order isomorphic to Multiplicative ℤ.
    - name: Singularity.IsConvexSubgroup.le_or_le
      kind: theorem
      status: proved
      note: Volume 3, Lemma 1.2.2 of the handbook. The convex subgroups of an ordered group are totally ordered by inclusion.
    - name: Singularity.IsConvexSubgroup.finite_and_card_le
      kind: theorem
      status: proved
      note: Volume 3, Proposition 1.2.5 of the handbook. A group of rational rank r has at most r + 1 convex subgroups.
    - name: Singularity.valuation_basic_properties
      kind: theorem
      status: proved
      note: Volume 3, Lemma 1.1.3 of the handbook, in multiplicative notation.
    - name: Singularity.exists_valuationSubring_of_isPrime
      kind: theorem
      status: proved
      note: Volume 3, Corollary 1.3.3 of the handbook. A valuation ring V dominates A_P, and P is the set of a in A with v(a) < 1.
    - name: Singularity.Valuation.exists_hasExtension
      kind: theorem
      status: proved
      note: Volume 3, Corollary 1.3.5 of the handbook. Each valuation of K extends to each field extension L.
    - name: Singularity.exists_center_iff
      kind: theorem
      status: proved
      note: Volume 3, Lemma 1.4.2 of the handbook. A valuation ring V has a center on A if and only if A is in V. The uniqueness is eq_of_ofPrime_le.
    - name: Singularity.ValuationSubring.eq_of_le_of_comap_eq
      kind: theorem
      status: proved
      note: Volume 3, Lemma 3.1.1 of the handbook, for each algebraic extension L/K.
    - name: Singularity.Algebra.isRegularLocalRing_quotient_iff
      kind: theorem
      status: proved
      note: Volume 1, Proposition 1.2.10 of the handbook. For a regular local ring S and a nonzero f in m, dim S/(f) + 1 = dim S, and S/(f) is regular if and only if f is not in m^2.
    - name: Singularity.Algebra.comap_frobenius_eq
      kind: theorem
      status: proved
      note: Volume 1, Lemma 6.1.2 of the handbook. The Frobenius pulls back each prime ideal to itself. The map of Spec R is primeSpectrum_comap_frobenius.
    - name: Singularity.Algebra.injective_frobenius_iff_isReduced
      kind: theorem
      status: proved
      note: Volume 1, Proposition 6.1.3 of the handbook. The Frobenius of a ring of prime characteristic p is injective if and only if the ring is reduced.
    - name: Singularity.Algebra.faithfullyFlat_and_injective_of_flat_of_isLocalHom
      kind: theorem
      status: proved
      note: Volume 1, Proposition 6.4.1 of the handbook. A flat local homomorphism of local rings is faithfully flat and injective.
    - name: Singularity.Algebra.isReduced_of_flat_frobenius
      kind: theorem
      status: proved
      note: Volume 1, Proposition 6.4.1 of the handbook, the last claim. A ring of prime characteristic with a flat Frobenius is reduced. The Noetherian hypothesis is not used.
    - name: Singularity.Algebra.flat_of_faithfullyFlat_of_flat
      kind: theorem
      status: proved
      note: Volume 1, Lemma 6.4.6 of the handbook. If C is faithfully flat over B and flat over A, then B is flat over A.
    - name: Singularity.Algebra.artinRees
      kind: theorem
      status: proved
      note: Volume 1, Theorem 4.1.5 of the handbook. This is Ideal.exists_pow_inf_eq_pow_smul of Mathlib.
    - name: Singularity.Algebra.artinRees_le
      kind: theorem
      status: proved
      note: Volume 1, Corollary 4.1.6 of the handbook. The I-adic topology of M induces the I-adic topology on a submodule N.
    - name: Singularity.Algebra.krull_intersection
      kind: theorem
      status: proved
      note: Volume 1, Theorem 4.1.7 of the handbook. Let E be the intersection of the I^n M. Then I E = E, and (1 + a) E = 0 for some a in I.
    - name: Singularity.Algebra.fg_filtration_submodule_iff_stable
      kind: theorem
      status: proved
      note: 'Volume 1, Lemma 4.1.4 of the handbook. Over a Noetherian ring, an I-filtration of a finitely generated module is stable if and only if M^* is a finitely generated module over the Rees algebra.'
    - name: Singularity.Algebra.exists_root_of_isAdicComplete
      kind: theorem
      status: proved
      note: 'Volume 1, Lemma 4.4.3 of the handbook, the existence. The proof of IsAdicComplete.henselianRing of Mathlib, without the hypothesis that the polynomial is monic.'
    - name: Singularity.Algebra.existsUnique_root_of_isAdicComplete
      kind: theorem
      status: proved
      note: 'Volume 1, Lemma 4.4.3 of the handbook. The lemma of Hensel for each polynomial over a local ring that is complete for the m-adic topology.'
    - name: Singularity.Algebra.isNoetherianRing_reesAlgebra
      kind: theorem
      status: proved
      note: Volume 1, Lemma 4.1.3 of the handbook. The Rees algebra of an ideal of a Noetherian ring is Noetherian. This is an instance of Mathlib.
    - name: Singularity.Algebra.adicCompletion_shortExact
      kind: theorem
      status: proved
      note: Volume 1, Proposition 4.2.5 of the handbook. Over a Noetherian ring, I-adic completion is exact on a short exact sequence of modules whose middle term is finitely generated.
    - name: Singularity.Algebra.exists_tensorProduct_equiv_adicCompletion
      kind: theorem
      status: proved
      note: Volume 1, Theorem 4.2.6 of the handbook. Over a Noetherian ring, the natural map from the tensor product of the completion of R with M to the completion of M is an isomorphism for M finitely generated.
    - name: Singularity.Algebra.flat_adicCompletion
      kind: theorem
      status: proved
      note: Volume 1, Theorem 4.2.7 of the handbook. The I-adic completion of a Noetherian ring is flat. This is an instance of Mathlib.
    - name: Singularity.Algebra.adicCompletion_isLocalRing
      kind: theorem
      status: proved
      note: Volume 1, Proposition 4.3.1, parts 1 and 2 of the handbook. The completion of a Noetherian local ring is local with maximal ideal m times the completion and the same residue field, and R maps injectively to it. That the completion is Noetherian and part 3 are not proved.
    - name: Singularity.Algebra.faithfullyFlat_adicCompletion
      kind: theorem
      status: proved
      note: Volume 1, Proposition 4.3.2 of the handbook. The completion of a Noetherian local ring is faithfully flat, and the tensor product with it reflects the zero module. The reflection of exact sequences is not proved.
    - name: Singularity.exists_ord_pderiv_eq
      kind: theorem
      status: proved
      note: Volume 2, Lemma 2.1.4 and Proposition 2.4.1 of the handbook, for one polynomial at the origin. If ord f = r is at least 1 and r is not 0 in k, then some partial derivative of f has order r - 1.
    - name: Singularity.idealOrd_derivIdeal_of_ne_zero
      kind: theorem
      status: proved
      note: Volume 2, Proposition 2.4.1 of the handbook, at the origin. If ord I = r is at least 1 and r is not 0 in k, then ord D(I) = r - 1.
    - name: Singularity.idealOrd_derivIdeal_iterate
      kind: theorem
      status: proved
      note: Volume 2, Lemma 2.1.4 of the handbook, at the origin, with the partial derivatives in place of all derivations. In characteristic 0, ord D^j(I) = ord I - j with the truncated subtraction of the extended natural numbers.
    - name: Singularity.le_idealOrd_iff_one_le_idealOrd_derivIdeal_iterate
      kind: theorem
      status: proved
      note: Volume 2, Corollary 2.1.5 (1) of the handbook, at the origin. In characteristic 0, the origin has order at least m for I if and only if it is in the zero set of D^(m-1)(I).
    - name: Singularity.exists_mem_derivIdeal_iterate_ord_eq_one
      kind: theorem
      status: proved
      note: The algebraic part of Volume 2, Lemma 2.3.2 of the handbook, at the origin. In characteristic 0, if ord I = m is at least 1, then D^(m-1)(I) has an element of order 1.
    - name: Singularity.le_idealOrd_iSup_pow_iff
      kind: theorem
      status: proved
      note: Volume 2, Lemma 3.2.2 (1) of the handbook, at the origin. If each c_j divides N and N is at least 1, then the sum of the B_j^(N / c_j) has order at least N if and only if each B_j has order at least c_j.
    - name: Singularity.naiveCoeff_eq
      kind: theorem
      status: proved
      note: Volume 2, Example 3.3.9 of the handbook, the arithmetic. The coefficients of the naive order reduction are m + F_i with F_i the Fibonacci numbers.
    - name: Singularity.exists_lt_naiveCoeff_add
      kind: theorem
      status: proved
      note: Volume 2, Example 3.3.9 of the handbook, the arithmetic. The order at the intersection of the last two divisors grows without bound.
    - name: Singularity.DerivativeIdeals.derivIdeal_xy_sub_z_pow
      kind: theorem
      status: proved
      note: Volume 2, Example 2.3.4 of the handbook. If n is at least 1 and not 0 in k, then D(xy - z^n) = (x, y, z^(n-1)).
    - name: Singularity.DerivativeIdeals.coeffIdeal_H
      kind: theorem
      status: proved
      note: Volume 2, Examples 2.3.4 and 3.2.8 of the handbook, on H = (x = 0). For n at least 2, (z^n) + (y, z^(n-1))^2 = (y^2, y z^(n-1), z^n).
    - name: 'Singularity.DerivativeIdeals.coeffIdeal_H'''
      kind: theorem
      status: proved
      note: 'Volume 2, Example 3.2.8 of the handbook, on H'' = (x = y). For n at least 2, (y^2 - z^n) + (y, z^(n-1))^2 = (y^2, y z^(n-1), z^n).'
    - name: Singularity.DerivativeIdeals.derivIdeal_charPExample
      kind: theorem
      status: proved
      note: Volume 2, Example 2.4.2 of the handbook. In characteristic p, D(x^p + y^(p+1)) = (x^p, y^p).
    - name: Singularity.DerivativeIdeals.le_idealOrd_derivIdeal_iterate_charPExample
      kind: theorem
      status: proved
      note: Volume 2, Example 2.4.2 of the handbook. In characteristic p, each D^j(x^p + y^(p+1)) has order at least p at the origin.
    - name: Singularity.centerLocalization_eq_of_le
      kind: theorem
      status: proved
      note: 'Volume 5, Lemma 1.1.1 of the handbook. If A is in A'' and A'' is in A_p, then A''_(p'') = A_p, as sets of fractions in K.'
    - name: Singularity.artinSchreierPoly_irreducible_or_splits
      kind: theorem
      status: proved
      note: 'Volume 3, proof of Proposition 3.2.5 and Example 3.2.6 of the handbook. Over a field of characteristic p, X^p - X - a is irreducible or it splits.'
    - name: Singularity.artinSchreierPoly_irreducible
      kind: theorem
      status: proved
      note: 'Volume 3, proof of Proposition 3.2.5 of the handbook. If X^p - X - a has no root in F, then it is irreducible over F.'
    - name: Singularity.artinSchreierPoly_roots_toFinset
      kind: theorem
      status: proved
      note: 'Volume 3, proof of Proposition 3.2.5 of the handbook. If theta is a root of X^p - X - a, then the roots are theta + n with n < p.'
    - name: Singularity.artinSchreierPoly_one_irreducible_zmod
      kind: theorem
      status: proved
      note: 'Volume 3, Example 3.2.6 (2) of the handbook. The polynomial X^p - X - 1 is irreducible over F_p.'
    - name: Singularity.valuation_pow_eq_of_one_lt_valuation_pow_sub_self
      kind: theorem
      status: proved
      note: 'Volume 3, proof of Lemma 3.2.4 of the handbook, in multiplicative notation. If v(eta^n - eta) > 1 and n >= 2, then v(eta)^n = v(eta^n - eta).'
    - name: Singularity.valuation_eq_one_of_valuation_pow_sub_self_eq_one
      kind: theorem
      status: proved
      note: 'Volume 3, Example 3.2.6 (2) of the handbook, the first step. If v(eta^n - eta) = 1 and n >= 2, then v(eta) = 1.'
    - name: Singularity.rankOne_iff_mulArchimedean
      kind: theorem
      status: proved
      note: 'Volume 3, Lemma 1.2.6 of the handbook. An ordered group G with G not trivial has exactly the convex subgroups 1 and G if and only if G is archimedean.'
    - name: Singularity.exists_approx_one_of_valuation
      kind: theorem
      status: proved
      note: 'Volume 3, Lemma 3.1.5 (2) of the handbook. Part (1) of the lemma is a hypothesis: the element x with w_i(x) > 1 and w_j(x) < 1.'
    - name: Singularity.ZariskiRiemann.mem_closure_singleton_iff
      kind: theorem
      status: proved
      note: 'Volume 3, Proposition 1.5.5 of the handbook. W is in the closure of the point V of ZR(K/A) if and only if W is contained in V.'
    - name: Singularity.ringKrullDim_eq_natCard_convexSubgroup_sub_one
      kind: theorem
      status: proved
      note: 'Volume 3, Corollary 1.2.4 of the handbook. If the value group has finitely many convex subgroups, then the Krull dimension of V is their number minus one, that is, the rank.'
    - name: Singularity.rank_le_and_ringKrullDim_le_trdeg
      kind: theorem
      status: proved
      note: 'Volume 3, Corollary 2.1.6 of the handbook. The statement assumes only that trdeg_k K is finite, not that K/k is a function field.'
    - name: Singularity.valuationSubring_properties
      kind: theorem
      status: proved
      note: 'Volume 3, Lemma 1.1.8 of the handbook. The claim of part 5 that the value group is isomorphic to Z is not proved.'
    - name: Singularity.LexZn.isConvexSubgroup_iff
      kind: theorem
      status: proved
      note: 'Volume 3, Example 1.2.7 of the handbook. A subgroup of Z^n with the lexicographic order is convex if and only if it is the subgroup of the vectors whose first m entries are 0, for some m at most n.'
    - name: Singularity.LexZn.natCard_convexSubgroup
      kind: theorem
      status: proved
      note: 'Volume 3, Example 1.2.7 of the handbook. Z^n with the lexicographic order has exactly n + 1 convex subgroups. The claim that the rational rank is n is not proved.'
    - name: Singularity.mem_coarsening_and_inv_mem_iff
      kind: theorem
      status: proved
      note: 'Volume 3, Lemma 2.3.2, part 1 of the handbook. For a convex subgroup H and x not 0, x and its inverse are in the coarsening W if and only if v(x) is in H. The isomorphism of the value group of W with the quotient by H is not proved.'
    - name: Singularity.mem_nonunits_coarsening_iff
      kind: theorem
      status: proved
      note: 'Volume 3, Lemma 2.3.2, part 1 of the handbook. The maximal ideal of the coarsening W is the set of the x with v(x) below each element of H.'
    - name: Singularity.not_exists_center_inftyValuation_polynomial
      kind: theorem
      status: proved
      note: 'Volume 3, Example 1.4.6 of the handbook. The valuation at infinity on F(x) has no center on F[x].'
    - name: Singularity.mem_centerIdeal_inftyChart_iff
      kind: theorem
      status: proved
      note: 'Volume 3, Example 1.4.6 of the handbook. The center of the valuation at infinity on F[1/x] is the ideal (1/x). The claims on the valuation ring as a localization, the value group, the residue field and the dimension are not proved.'
    - name: Singularity.valuation_ne_of_sq_eq
      kind: theorem
      status: proved
      note: 'Volume 3, Example 3.1.7, case 2 of the handbook. If v(t) = exp m with m odd and s^2 = t, then w(s) is not a value of K, so e is at least 2. The equality e = 2 is not proved.'
    - name: Singularity.valuation_sub_eq_one_of_sq_eq
      kind: theorem
      status: proved
      note: 'Volume 3, Example 3.1.7, case 3 of the handbook. If w is trivial on k and s^2 = c with c not a square in k, then w(s - b) = 1 for each b in k, so the residue of s is not in k. The equality f = 2 is not proved.'
    - name: Singularity.aChain_chart_mul
      kind: theorem
      status: proved
      note: 'Volume 4, Proposition 2.3.10, part 1 of the handbook. The chart x = s^(m-i) t^(m-1-i), y = s^i t^(i+1), z = st satisfies xy = z^m in each commutative ring.'
    - name: Singularity.aChain_glue_x
      kind: theorem
      status: proved
      note: 'Volume 4, Proposition 2.3.10, part 1 of the handbook. The gluing s_(i-1) = 1/t_i and t_(i-1) = s_i t_i^2 gives the same x. The theorems aChain_glue_y and aChain_glue_z give the same y and z.'
    - name: Singularity.aChainChart_equation
      kind: theorem
      status: proved
      note: 'Volume 4, Proposition 2.3.10, part 1 of the handbook. The map of k-algebras k[x, y, z] to k[s, t] of the chart U_i sends xy - z^m to 0.'
    - name: Singularity.an_xChart
      kind: theorem
      status: proved
      note: 'Volume 4, Proposition 2.3.2, part 2 of the handbook. In the x-chart of the blowup of xy = z^n at the origin, F = x^2 (y_1 - x^(n-2) z_1^n). The y-chart and the z-chart are an_yChart and an_zChart.'
    - name: Singularity.an_not_X_dvd_xChart
      kind: theorem
      status: proved
      note: 'Volume 4, Proposition 2.3.2, part 2 of the handbook. The variable x does not divide y_1 - x^(n-2) z_1^n, so this is the strict transform in the x-chart.'
    - name: Singularity.whitneyNormalization_equation
      kind: theorem
      status: proved
      note: 'Volume 4, Example 1.2.7, part 2 of the handbook. The map x to st, y to s, z to t^2 sends x^2 - y^2 z to 0.'
    - name: Singularity.whitney_exists_eq_add_mul
      kind: theorem
      status: proved
      note: 'Volume 4, Example 1.2.7, part 2 of the handbook. Each element of k[s, t] is nu(a) + nu(b) t. The normalization claim is not proved.'
    - name: Singularity.whitney_lineChart_x
      kind: theorem
      status: proved
      note: 'Volume 4, Example 3.1.6, part 2 of the handbook. In the chart x = y x_2 of the blowup along V(x, y), F = y^2 (x_2^2 - z). The other charts are whitney_lineChart_y and whitney_pointChart_z.'
    - name: Singularity.map_idealChart_eq_span
      kind: theorem
      status: proved
      note: 'Volume 4, Lemma 1.1.3, part 3 of the handbook. If f is in I, then I R[I/f] = f R[I/f].'
    - name: Singularity.algebraMap_mem_nonZeroDivisors_idealChart
      kind: theorem
      status: proved
      note: 'Volume 4, Lemma 1.1.3, part 3 of the handbook. The element f is a nonzerodivisor of R[I/f].'
    - name: Singularity.coe_mem_map_iff_idealChart
      kind: theorem
      status: proved
      note: 'Volume 4, proof of Proposition 1.1.5 of the handbook. For B = R[I/f], the intersection of B with J R_f is (J B : f^infinity).'
    - name: Singularity.mem_saturation_of_mul_mem_idealChart
      kind: theorem
      status: proved
      note: 'Volume 4, proof of Proposition 1.1.5 of the handbook. The element f is a nonzerodivisor on B / (J B : f^infinity).'
    - name: Singularity.finite_isMaximal_of_height_eq_two
      kind: theorem
      status: proved
      note: 'Volume 4, Lemma 1.2.3 of the handbook, for an affine scheme. A closed subset of Spec R with R Noetherian whose points have height 2 is a finite set of closed points.'
    - name: Singularity.height_eq_two_of_notMem_regularLocus
      kind: theorem
      status: proved
      note: 'Volume 4, proof of Theorem 1.2.4 of the handbook. If dim R is at most 2 and R_p is an integrally closed domain that is not regular, then p has height 2.'
    - name: Singularity.finite_isMaximal_compl_regularLocus
      kind: theorem
      status: proved
      note: 'Volume 4, Theorem 1.2.4 of the handbook, for an affine scheme. The singular locus is a finite set of closed points of height 2. The case of an excellent surface is not proved.'
    - name: Singularity.cuspPair_inter
      kind: theorem
      status: proved
      note: 'Volume 4, Example 3.1.10, part 1 of the handbook. The curves y^2 = x^3 and y^2 = x^5 meet only at the origin where 1 - x^2 is not 0, in each ring without zero divisors.'
    - name: Singularity.cuspPair_order_five
      kind: theorem
      status: proved
      note: 'Volume 4, Example 3.1.10, part 4 of the handbook. The factorizations cuspPair_order_one to cuspPair_order_five give the orders 4, 7, 8, 12, 16 of f along E_1 to E_5. That the last factors are not divisible by the local equation is not proved.'
    - name: Singularity.separable_one_add_X_pow_succ
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.5 of the handbook. In characteristic p the polynomial 1 + Y^(p+1) is separable.'
    - name: Singularity.card_roots_one_add_X_pow_succ
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.5 of the handbook. Over an algebraically closed field of characteristic p, 1 + Y^(p+1) has exactly p + 1 distinct roots. The claim that they give the singular points is not proved.'
    - name: Singularity.coeff_pred_taylor_tschirnhausen
      kind: theorem
      status: proved
      note: Volume 6, Corollary 3.1.6 of the handbook, the claim f_{1, Z} = 0. For f monic of degree m with an inverse u of m, the coefficient of z^(m-1) in f(z - f_{m-1} u) is 0.
    - name: Singularity.tschirnhausen_not_isSolvableVertex
      kind: theorem
      status: proved
      note: Volume 6, Corollary 3.1.6 of the handbook, the claim that the polyhedron after the Tschirnhausen translation has no solvable vertex. The last claim, equality with the characteristic polyhedron, is not proved.
    - name: Singularity.isSolvableVertex_X_pow_add_C_iff
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.1.10(2) of the handbook. In characteristic p the vertex v of z^p + F is solvable with the constant c if and only if the coefficient of x^(p v) in F is c^p.
    - name: Singularity.charPolyhedron_X_pow_add_C_of_forall
      kind: theorem
      status: proved
      note: Volume 6, Example 3.1.11 of the handbook, the direct argument. If no p-th power cancels a monomial of F, then z attains the characteristic polyhedron of z^p + F.
    - name: Singularity.charPolyhedron_example_3_1_7_eq
      kind: theorem
      status: proved
      note: Volume 6, Example 3.1.7 of the handbook. In characteristic 2 the characteristic polyhedron of z^2 + x^2 + y^3 is (0, 3/2) plus the orthant.
    - name: Singularity.sq_mul_one_add_sq_of_mul_one_add
      kind: theorem
      status: proved
      note: Volume 6, Example 3.1.8 of the handbook. In characteristic 2, theta (1 + x) = x gives theta^2 (1 + x^2) = x^2.
    - name: Singularity.example_3_1_9_expand
      kind: theorem
      status: proved
      note: Volume 6, Example 3.1.9 of the handbook. The identity (z + 6)^3 - 54 = z^3 + 18 z^2 + 108 z + 162 in Z[z].
    - name: Singularity.example_3_1_11
      kind: theorem
      status: proved
      note: Volume 6, Example 3.1.11 of the handbook. Over F_p(t) the vertex (1, 0) of z^p + t x^p + y^(p+1) is not solvable, and z attains the characteristic polyhedron.
    - name: Singularity.Examples.eval_pderiv_xyw_eq_zero_iff
      kind: theorem
      status: proved
      note: Volume 6, Example 2.3.4 of the handbook. The partial derivatives of x y w vanish together at a point exactly when two coordinates are 0.
    - name: Singularity.Examples.pow_ne_xyw
      kind: theorem
      status: proved
      note: Volume 6, Example 2.3.4 of the handbook. In characteristic p the polynomial x y w is not a p-th power.
    - name: Singularity.Examples.pow_ne_X_mul_X_mul_X
      kind: theorem
      status: proved
      note: Volume 6, Example 2.3.4 of the handbook. In characteristic p the power series x y w is not a p-th power.
    - name: Singularity.Examples.ord_X_pow_add_xyw
      kind: theorem
      status: proved
      note: Volume 6, Example 2.3.4 of the handbook. Over a field the order of z^p + x y w at the origin is min(p, 3).
    - name: Singularity.Examples.ord_X_add_C_mul_xyw
      kind: theorem
      status: proved
      note: Volume 6, Example 2.3.4 of the handbook. Over a field the order of (x + a) y w at the origin is 2 for a nonzero a.
    - name: Singularity.Examples.example_3_3_1_chart
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.1 of the handbook. In characteristic 2 the chart substitution sends f to u_1^2 times the series of the handbook.
    - name: Singularity.Examples.example_3_3_2_combination
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.2 of the handbook. The point w is 8/15 v_1 + 2/15 v_2 + 1/3 v_3, and the weights add up to 1.
    - name: Singularity.Examples.taylor_example_3_3_3
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.3 of the handbook. In characteristic 3 the translation by -u_1 - u_1 u_2 sends X^3 + f to X^3 + u_2^4 + u_3^5.
    - name: Singularity.Examples.example_3_3_4_chart
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.4 of the handbook. In characteristic 2 the chart substitution sends u_1^3 + u_2^3 + u_3^3 to u_1^2 (u_1 g).
    - name: Singularity.Examples.example_3_2_8_residualFactor
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.8 of the handbook. For f = u_1 u_2 u_3 and E = div(u_1 u_2 u_3) the residual factor is G = 1.
    - name: Singularity.Examples.example_3_2_8_cpOmega
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.8 of the handbook. For f = u_1 u_2 u_3 and E = div(u_1 u_2 u_3), omega = 0.
    - name: Singularity.Examples.example_3_2_8_ord
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.8 of the handbook. The order of u_1 u_2 u_3 is 3.
    - name: Singularity.Examples.example_3_2_8_cpIota
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.8 of the handbook. For h = Z^3 + u_1 u_2 u_3 and E = div(u_1 u_2 u_3), iota = (3, 0, 1).
    - name: Singularity.Examples.example_3_2_8_chart
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.8 of the handbook. The u_1-chart with translations t sends u_1 u_2 u_3 to u_1^3 (u_2 + t_2)(u_3 + t_3).
    - name: Singularity.Examples.example_3_2_8_translate
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.8 of the handbook. In characteristic 3, if c^3 = s t, then Z ↦ Z - c sends Z^3 + (u_2 + s)(u_3 + t) to Z^3 + u_2 u_3 + t u_2 + s u_3.
    - name: Singularity.Examples.example_3_2_15_clean
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. In characteristic 2, for g = u_1 + u_1 u_2, g^2 + f = u_1^3 u_2 + u_2^5 + u_2^3 u_3^2.
    - name: Singularity.Examples.example_3_2_15_ord
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. The order of the clean part f^cl is 4.
    - name: Singularity.Examples.example_3_2_15_initialForm
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. The initial form of f^cl is U_1^3 U_2.
    - name: Singularity.Examples.example_3_2_15_residualFactor_01
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For E = div(u_1 u_2) the residual factor of f^cl is u_1^3 + u_2^4 + u_2^2 u_3^2.
    - name: Singularity.Examples.example_3_2_15_epsilon_01
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For E = div(u_1 u_2), epsilon = 3.
    - name: Singularity.Examples.example_3_2_15_cpOmega_01
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For E = div(u_1 u_2), omega = 3.
    - name: Singularity.Examples.example_3_2_15_residualFactor_0
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For E = div(u_1) the residual factor of f^cl is f^cl.
    - name: Singularity.Examples.example_3_2_15_epsilon_0
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For E = div(u_1), epsilon = 4.
    - name: Singularity.Examples.example_3_2_15_cpOmega_0
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For E = div(u_1), omega = 3.
    - name: Singularity.Examples.example_3_2_15_residualFactor_empty
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For the empty divisor the residual factor of f^cl is f^cl.
    - name: Singularity.Examples.example_3_2_15_epsilon_empty
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For the empty divisor, epsilon = 4.
    - name: Singularity.Examples.example_3_2_15_cpOmega_empty
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.15 of the handbook. For the empty divisor, omega = 3.
    - name: Singularity.Examples.example_3_2_16_ord
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. The order of f = u_1^2 u_2 + u_1^3 u_3 is 3.
    - name: Singularity.Examples.example_3_2_16_residualFactor_0
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. For E = div(u_1) the residual factor is G = u_2 + u_1 u_3.
    - name: Singularity.Examples.example_3_2_16_residualFactor_01
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. For E = div(u_1 u_2) the residual factor is G = u_2 + u_1 u_3.
    - name: Singularity.Examples.example_3_2_16_epsilon_0
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. For E = div(u_1), epsilon = 1.
    - name: Singularity.Examples.example_3_2_16_epsilon_01
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. For E = div(u_1 u_2), epsilon = 1.
    - name: Singularity.Examples.example_3_2_16_cpOmega_0
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. For E = div(u_1), omega = 0.
    - name: Singularity.Examples.example_3_2_16_cpIota_0
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. For E = div(u_1), iota = (3, 0, 1).
    - name: Singularity.Examples.example_3_2_16_cpOmega_01
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. For E = div(u_1 u_2), omega = 1.
    - name: Singularity.Examples.example_3_2_16_cpIota_01
      kind: theorem
      status: proved
      note: Volume 6, Example 3.2.16 of the handbook. For E = div(u_1 u_2), iota = (3, 1, 2), where the value 2 of kappa stands for kappa at least 2.
    - name: Singularity.Examples.example_3_3_5_chart_identity
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. In characteristic 3, (u_2 + 1)^4 - (u_2 + 1) = u_2^4 + u_2^3.
    - name: Singularity.Examples.example_3_3_5_cube
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. In characteristic 3, (z + w)^3 = z^3 + w^3. This is the cleaning step.
    - name: Singularity.Examples.example_3_3_5_initialForm_cube
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. In characteristic 3, (U_2 - U_1)^3 = U_2^3 - U_1^3.
    - name: Singularity.Examples.example_3_3_5_chart_identity_two
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. In characteristic 3, (u_2 - 1)^4 - (u_2 - 1) = u_2^4 + 2 u_2^3 + u_2 + 2.
    - name: Singularity.Examples.example_3_3_5_residualFactor
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. For E = div(u_1 u_2 u_3) the residual factor of f is G = u_2^3 - u_1^3 + u_3^4.
    - name: Singularity.Examples.example_3_3_5_epsilon
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. At x, epsilon = 3.
    - name: Singularity.Examples.example_3_3_5_cpOmega
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. At x, omega = 3.
    - name: Singularity.Examples.example_3_3_5_ord
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. At x, the order of f is 6.
    - name: Singularity.Examples.example_3_3_5_cpIota
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. At x, iota = (3, 3, 2), where the value 2 of kappa stands for kappa at least 2.
    - name: Singularity.Examples.example_3_3_5_chart
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. In characteristic 3, the u_1-chart at t = (1, 0) sends f to u_1^3 times the series of the handbook.
    - name: Singularity.Examples.example_3_3_5_blowupDivisor
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. At t = (1, 0) of the u_1-chart the new divisor is div(u_1 u_3).
    - name: Singularity.Examples.example_3_3_5_residualFactor'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. At x' the residual factor of the clean part f' for E' = div(u_1 u_3) is u_2^4 + u_1 u_2 u_3^4 + u_1 u_3^4.
    - name: Singularity.Examples.example_3_3_5_epsilon'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. At x', epsilon = 4.
    - name: Singularity.Examples.example_3_3_5_cpOmega'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. In characteristic 3, omega = 3 at x'.
    - name: Singularity.Examples.example_3_3_5_ord'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. At x', the order of f' is 7.
    - name: Singularity.Examples.example_3_3_5_cpIota'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.5 of the handbook. In characteristic 3, iota = (3, 3, 2) at x', where the value 2 of kappa stands for kappa at least 2.
    - name: Singularity.Examples.example_3_3_6_residualFactor
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. For E = div(u_1) the residual factor of f = u_1^2 u_2 + u_1^2 u_3^2 is G = u_2 + u_3^2.
    - name: Singularity.Examples.example_3_3_6_epsilon
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x, epsilon = 1.
    - name: Singularity.Examples.example_3_3_6_cpOmega
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x, omega = 0.
    - name: Singularity.Examples.example_3_3_6_ord
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x, the order of f is 3.
    - name: Singularity.Examples.example_3_3_6_cpIota
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x, iota = (3, 0, 1).
    - name: Singularity.Examples.example_3_3_6_chart
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. The u_3-chart at the origin sends f to u_3^3 (u_1'^2 u_2' + u_1'^2 u_3).
    - name: Singularity.Examples.example_3_3_6_blowupDivisor
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At the origin of the u_3-chart the new divisor is div(u_1' u_3).
    - name: Singularity.Examples.example_3_3_6_residualFactor'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x' the residual factor for E' = div(u_1' u_3) is u_2' + u_3.
    - name: Singularity.Examples.example_3_3_6_epsilon'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x', epsilon = 1.
    - name: Singularity.Examples.example_3_3_6_cpOmega'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x', omega = 0.
    - name: Singularity.Examples.example_3_3_6_ord'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x', the order is 3.
    - name: Singularity.Examples.example_3_3_6_cpIota'
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. At x', iota = (3, 0, 1), the value at x.
    - name: Singularity.Examples.example_3_3_6_curve_chart
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. In the u_1-chart of the blowup of Y, u_1^2 u_1 (v' + a) = u_1^3 (v' + a).
    - name: Singularity.Examples.example_3_3_6_translate
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. In characteristic 3, if b^3 = a, then Z^3 + v' + a = (Z + b)^3 + v'.
    - name: Singularity.Examples.example_3_3_6_v_chart
      kind: theorem
      status: proved
      note: Volume 6, Example 3.3.6 of the handbook. In the v-chart of the blowup of Y, the strict transform of Z^3 + u_1^2 v is Z'^3 + u_1'^2.
    - name: Singularity.Example.cusp_normalization
      kind: theorem
      status: proved
      note: Volume 1, Example 2.5.8 of the handbook. The field of fractions of k[t^2, t^3] is k(t), and k[t] is its integral closure in k(t).
    - name: Singularity.Example.mul_mem_cusp_iff
      kind: theorem
      status: proved
      note: Volume 1, Example 2.5.8 of the handbook. The conductor of k[t^2, t^3] in k[t] is t^2 k[t].
    - name: Singularity.Example.node_normalization
      kind: theorem
      status: proved
      note: Volume 1, Example 2.5.9 of the handbook. The field of fractions of k[t^2 - 1, t^3 - t] is k(t), and k[t] is its integral closure in k(t). The kernel that presents the node as a quotient is not proved.
    - name: Singularity.Example.mul_mem_node_iff
      kind: theorem
      status: proved
      note: Volume 1, Example 2.5.9 of the handbook. If 2 is not 0 in k, the conductor of k[t^2 - 1, t^3 - t] in k[t] is (t^2 - 1) k[t].
    - name: Singularity.Example.umbrella_normalization
      kind: theorem
      status: proved
      note: Volume 1, Example 2.5.10 of the handbook. The subalgebra k[y, yt, t^2] of k[y, t] has the same field of fractions, and k[y, t] is its integral closure. The kernel that presents the umbrella as a quotient is not proved.
    - name: Singularity.Example.order_cusp
      kind: theorem
      status: proved
      note: Volume 1, Example 3.2.6 of the handbook. In the local ring of k[x, y] at the origin, the order of y^2 - x^3 is 2.
    - name: Singularity.Example.not_perfectRing_ratFunc
      kind: theorem
      status: proved
      note: Volume 1, Example 6.1.4 of the handbook. The field F_p(t) is not perfect. The file also has perfectRing_of_finite and perfectRing_of_isAlgClosed.
    - name: Singularity.Algebra.iInf_pow_eq_bot_of_isDomain
      kind: theorem
      status: proved
      note: Volume 1, Corollary 4.1.9 of the handbook. In a Noetherian domain, the intersection of the powers of a proper ideal is 0.
    - name: Singularity.Algebra.iInf_pow_prod_eq
      kind: theorem
      status: proved
      note: Volume 1, Example 4.1.10 of the handbook. For I = k x 0 in k x k, the intersection of the powers of I is I, and I is not 0.
    - name: Singularity.Example.cusp_strict_inter
      kind: theorem
      status: proved
      note: Volume 1, Example 1.10.7 of the handbook. The strict transform u^2 - x of the cusp meets the exceptional divisor x = 0 in the ideal (x, u^2).
    - name: Singularity.Example.cone_chart_x
      kind: theorem
      status: proved
      note: Volume 1, Example 1.10.8 of the handbook. In the chart for x of the blowup of the cone xy = z^2, y = x v^2 and (x, y, z) = (x).
    - name: Singularity.cpOmega_le_ord_residualFactor
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.14 part 1 of the handbook. omega is at most epsilon, the order of the residual factor.
    - name: Singularity.ord_residualFactor_le_cpOmega_add_one
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.14 part 1 of the handbook. epsilon is at most omega + 1.
    - name: Singularity.ord_residualFactor_sub_one_le_cpOmega
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.14 part 1 of the handbook. epsilon - 1 is at most omega.
    - name: Singularity.one_le_ord_residualFactor_of_exists
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.14 part 1 of the handbook. In the first case of Definition 3.2.5, epsilon is at least 1.
    - name: Singularity.cpOmega_add_one_of_exists
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.14 part 1 of the handbook. In the first case of Definition 3.2.5, omega + 1 = epsilon.
    - name: Singularity.cpOmega_eq_zero_iff
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.14 part 2 of the handbook. For g not 0, omega = 0 if and only if epsilon = 0, or epsilon = 1 and the residual factor has a nonzero coefficient of x_j for some j not in Delta.
    - name: Singularity.cpOmega_eq_of_forall_mem
      kind: theorem
      status: proved
      note: Volume 6, Lemma 3.2.14 part 3 of the handbook. If each coordinate is in Delta, then omega = epsilon.
    - name: Singularity.ord_residualFactor_originTransform_add_le
      kind: theorem
      status: proved
      note: Volume 6, Proposition 4.3.4 part 3 of the handbook. At the origin of the x_j-chart, epsilon(x') + a_j is at most epsilon(x) + r_j for each monomial x^a of g of degree ord g.
    - name: Singularity.ord_residualFactor_originTransform_add_le_of_notMem
      kind: theorem
      status: proved
      note: Volume 6, Proposition 4.3.4 part 3 of the handbook, for j not in Delta. epsilon(x') + a_j is at most epsilon(x).
    - name: Singularity.ord_residualFactor_originTransform_le
      kind: theorem
      status: proved
      note: Volume 6, Proposition 4.3.4 part 3 of the handbook. epsilon(x') is at most epsilon(x).
    - name: Singularity.cpOmega_originTransform_le
      kind: theorem
      status: proved
      note: Volume 6, Proposition 4.3.4 part 4 of the handbook, the part on omega. For a clean g, omega(x') is at most omega(x). The bound on iota is not proved.
    - name: Singularity.exists_prime_forall_dvd_of_prime
      kind: theorem
      status: proved
      note: Used in Volume 5, Lemma 1.1.6 of the handbook. A prime p of R_1 that does not divide x gives a prime of R that divides each z in R with p dividing z in R_1.
    - name: Singularity.not_prime_dvd_transform
      kind: theorem
      status: proved
      note: Volume 5, Lemma 1.1.6 of the handbook, under hypotheses. If f and g have no common prime factor in the unique factorization domain R, and x does not divide f', then f' and g' have no common prime factor in R_1.
    - name: Singularity.exists_mul_eq_algebraMap_of_isLocalization
      kind: theorem
      status: proved
      note: Used in Volume 5, Lemma 1.1.6 of the handbook. Each element of a localization of a ring between R and R_x is r / s with s an associate of a power of x.
    - name: Singularity.not_prime_dvd_transform_blowupChart
      kind: theorem
      status: proved
      note: Volume 5, Lemma 1.1.6 of the handbook, for a localization R_1 of the chart R[m/x]. The primality of x in R_1 and the claim that x does not divide f' are hypotheses.
    - name: Singularity.exact_mulQuotientSpanPair
      kind: theorem
      status: proved
      note: Used in Volume 5, Lemma 1.2.2 of the handbook. The sequence R/(f, g_2) to R/(f, g_1 g_2) to R/(f, g_1) is exact.
    - name: Singularity.length_quotient_span_pair_mul
      kind: theorem
      status: proved
      note: Volume 5, Lemma 1.2.2 part 2 of the handbook, in a general form. If f divides g_1 c only when f divides c, then i(f, g_1 g_2) = i(f, g_1) + i(f, g_2).
    - name: Singularity.length_quotient_span_pair_mul_of_prime
      kind: theorem
      status: proved
      note: Volume 5, Lemma 1.2.2 part 2 of the handbook, in each unique factorization domain. If f is nonzero and has no common prime factor with g_1, then i(f, g_1 g_2) = i(f, g_1) + i(f, g_2).
    - name: Singularity.length_quotient_span_pair_eq_zero_iff
      kind: theorem
      status: proved
      note: Volume 5, Lemma 1.2.2 part 1 of the handbook, the second claim. In a local ring, i(f, g) = 0 if and only if f or g is a unit. The finiteness is not proved.
    - name: Singularity.isTranscendenceBasis_adjoinRangeElem
      kind: theorem
      status: proved
      note: Used in Volume 5, Lemma 1.4.2 of the handbook. Algebraically independent elements y_i are a transcendence basis of k(y) over k.
    - name: Singularity.cardinalMk_add_trdeg_adjoin
      kind: theorem
      status: proved
      note: Used in Volume 5, Lemma 1.4.2 of the handbook. For algebraically independent y_i, the number of the y_i plus trdeg of K over k(y) is trdeg of K over k.
    - name: Singularity.trdeg_adjoin_add_trdeg_residueField
      kind: theorem
      status: proved
      note: Volume 5, Lemma 1.4.2 of the handbook, the formula for the transcendence degree. If the residues of the y_i form a transcendence basis of the residue field over k, then trdeg of K over k(y) plus trdeg of the residue field is trdeg of K over k.
    - name: Singularity.cpKappa_eq_one_iff
      kind: theorem
      status: proved
      note: Volume 6, Definition 3.2.5 of the handbook. kappa(x) = 1 if and only if omega(x) = 0, for kappa with only the values 1 and at least 2.
    - name: Singularity.cpIota_le_of_cpOmega_le
      kind: theorem
      status: proved
      note: Volume 6, Definition 3.2.5 of the handbook. If m(x') = m(x) = p and omega(x') is at most omega(x), then iota(x') is at most iota(x) in the lexicographic order.
    - name: Singularity.cpIota_originTransform_lt_of_lt
      kind: theorem
      status: proved
      note: Volume 6, Proposition 4.3.4 part 4 of the handbook, the case m(x') < p. At the origin of the x_j-chart, iota(x') < iota(x).
    - name: Singularity.cpIota_originTransform_le
      kind: theorem
      status: proved
      note: Volume 6, Proposition 4.3.4 part 4 of the handbook, the bound on iota. For a clean g with ord g at least p, iota(x') is at most iota(x) at the origin of the x_j-chart, for iota = (m, omega, kappa) with kappa only 1 or at least 2.
    - name: Singularity.charPolyhedron_originTransform
      kind: theorem
      status: proved
      note: Volume 6, Proposition 4.3.4 part 2 of the handbook. At the origin of the x_j-chart, the characteristic polyhedron of Z'^p + g' is (1/p) N(g').
    - name: Singularity.charPolyhedron_originTransform_eq_projPolyhedron
      kind: theorem
      status: proved
      note: Volume 6, Proposition 4.3.4 part 2 of the handbook. At the origin of the x_j-chart, the projected polyhedron of Z'^p + g' is the characteristic polyhedron, so (x; Z') is well adapted.
    - name: 'Singularity.CharZeroExamples.bm_strict_inter'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 1.2.2 of the handbook. The strict transform (x1 - y1^2, x1 + z1^2 - w1^3) meets the plane x1 = y1 = 0 in the cuspidal curve z1^2 = w1^3.'
    - name: 'Singularity.CharZeroExamples.bm_chart_second'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 1.2.2 of the handbook. In the chart of the blowup, x^4 + x z^2 - w^3 = x1^3 (x1 + z1^2 - w1^3).'
    - name: 'Singularity.CharZeroExamples.cusp_total_u'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 1.3.2 of the handbook. After the three blowups, y^2 - x^3 = x2^6 u^3 (u - 1) in the chart of u.'
    - name: 'Singularity.CharZeroExamples.cusp_total_v'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 1.3.2 of the handbook. After the three blowups, y^2 - x^3 = v^2 y1^6 (1 - v) in the chart of v.'
    - name: 'Singularity.CharZeroExamples.cusp_step_three_disjoint'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 1.3.2 of the handbook. On the last exceptional curve, E2 and C3 do not meet, and E1 and C3 do not meet.'
    - name: 'Singularity.CharZeroExamples.whitneyEq_singular_iff'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 1.3.3 (1) of the handbook. If 2 is not 0, the common zeros of x^2 - y^2 z and its partial derivatives are the points with x = y = 0.'
    - name: 'Singularity.CharZeroExamples.ord_whitneyEq'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 1.3.3 (1) of the handbook. The order of x^2 - y^2 z at the origin is 2.'
    - name: 'Singularity.CharZeroExamples.ord_whitneyEq_translate'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 1.3.3 (1) and (2) of the handbook. At the point (0, 0, c), the translate x^2 - c y^2 - y^2 t has order 2.'
    - name: 'Singularity.CharZeroExamples.derivIdeal_whitneyEq'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 3.2.6 of the handbook. If 2 is not 0, D(x^2 - y^2 z) = (x, yz, y^2).'
    - name: 'Singularity.CharZeroExamples.derivIdeal_derivIdeal_whitneyEq'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 3.2.6 of the handbook. If 2 is not 0, D^2(x^2 - y^2 z) is the unit ideal.'
    - name: 'Singularity.CharZeroExamples.coeffIdeal_whitney'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 3.2.6 of the handbook. On H = (x = 0), (y^2 z) + (yz, y^2)^2 = (y^2 z, y^4).'
    - name: 'Singularity.CharZeroExamples.coeffIdeal_whitney_eq_mul'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 3.2.6 of the handbook. (y^2 z, y^4) = (y^2) (z, y^2).'
    - name: 'Singularity.CharZeroExamples.idealOrd_coeffIdeal_whitney'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 3.2.6 of the handbook. The coefficient ideal (y^2 z, y^4) has order 3 at the origin.'
    - name: 'Singularity.CharZeroExamples.idealOrd_coeffIdeal_whitney_translate'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 3.2.6 of the handbook. For c not 0, the ideal (y^2 (c + t), y^4) has order 2 at the origin.'
    - name: 'Singularity.CharZeroExamples.idealOrd_transform_whitney'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 3.2.6 of the handbook. The transform (z, y^2) has order 1 at the origin.'
    - name: 'Singularity.CharZeroExamples.sub_not_mem_mc'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 2.3.5 of the handbook. The element y - x is not in MC(I) = (y, x^4).'
    - name: 'Singularity.CharZeroExamples.ord_restrict_H'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 2.3.5 of the handbook. The restriction of y^2 - x^5 to y = 0 has order 5.'
    - name: 'Singularity.CharZeroExamples.ord_restrict_H'''
      kind: theorem
      status: proved
      note: 'Volume 2, Example 2.3.5 of the handbook. The restriction of y^2 - x^5 to y = x has order 2.'
    - name: 'Singularity.CharZeroExamples.derivIdeal_transform'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 2.3.5 of the handbook. If 2 and 3 are not 0, D(y1^2 - x^3) = (y1, x^2).'
    - name: 'Singularity.CharZeroExamples.mc_chain_transform'
      kind: theorem
      status: proved
      note: 'Volume 2, Example 2.3.5 of the handbook. If 2 and 3 are not 0, (y1) is in (y1, x^3), and (y1, x^3) is in D(y1^2 - x^3).'
    - name: Singularity.originXChart_injective
      kind: theorem
      status: proved
      note: 'Used in Volume 4, Lemma 1.1.6 of the handbook. Over a domain, the substitution F(x, x y_1, x z_1) of the x-chart of the blowup of A^3 at the origin is injective.'
    - name: Singularity.originXChart_of_isHomogeneous
      kind: theorem
      status: proved
      note: 'Used in Volume 4, Lemma 1.1.6 of the handbook. For P homogeneous of degree d, P(x, x y_1, x z_1) = x^d P(1, y_1, z_1).'
    - name: Singularity.originXChart_eq_pow_mul_originStrict
      kind: theorem
      status: proved
      note: 'Volume 4, Lemma 1.1.6 of the handbook. If the homogeneous parts of F of degree less than m are 0, then F(x, x y_1, x z_1) = x^m F''.'
    - name: Singularity.originRestrict_originStrict
      kind: theorem
      status: proved
      note: 'Volume 4, Lemma 1.1.6 of the handbook. With m the least degree of a monomial of F, F''(0, y_1, z_1) = F_m(1, y_1, z_1).'
    - name: Singularity.not_X_dvd_originStrict
      kind: theorem
      status: proved
      note: 'Volume 4, Lemma 1.1.6 of the handbook. Over a domain, with m the least degree of a monomial of F, x does not divide F''.'
    - name: Singularity.exists_originXChart_eq_pow_mul
      kind: theorem
      status: proved
      note: 'Volume 4, Lemma 1.1.6 of the handbook, the algebraic part. F(x, x y_1, x z_1) = x^m F'' with x not dividing F'' and F''(0, y_1, z_1) = F_m(1, y_1, z_1). The claims on schemes are not proved.'
    - name: Singularity.quartic_xChart
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.6 of the handbook. In the x-chart of the blowup of z^2 = x^4 + y^4, f = x^2 (z_1^2 - x^2 (1 + y_1^4)). The other charts are quartic_yChart and quartic_zChart.'
    - name: Singularity.quarticNormHom_equation
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.6 of the handbook. The map B to C = k[x, y_1, w]/(w^2 - 1 - y_1^4) with z_1 to x w sends z_1^2 - x^2 (1 + y_1^4) to 0.'
    - name: Singularity.quartic_normalization_regular
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.6 of the handbook. If 2 is a unit, w^2 - 1 - y_1^4, 4 y_1^3 and 2 w generate the unit ideal, so C is regular by the Jacobian criterion.'
    - name: Singularity.separable_one_add_X_pow_four
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.6 of the handbook. If 2 is a unit, 1 + Y^4 is separable.'
    - name: Singularity.card_roots_one_add_X_pow_four
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.6 of the handbook. Over an algebraically closed field of characteristic not 2, 1 + Y^4 has exactly four distinct roots.'
    - name: Singularity.quartic_exceptional_ideal
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.6 of the handbook. The ideal (x, x y_1, x^2 w) is (x).'
    - name: Singularity.quartic_charTwo
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.6 of the handbook. In characteristic 2, z^2 - x^4 - y^4 = (z + x^2 + y^2)^2.'
    - name: Singularity.dFour_singular_origin
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.11, part 1 of the handbook. In a domain of any characteristic, the only common zero of z^2 + xy(x + y) and its partial derivatives is the origin.'
    - name: Singularity.dFour_xChart
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.11, part 2 of the handbook. In the x-chart, F = x^2 (z_1^2 + x y_1 (1 + y_1)). The other charts are dFour_yChart and dFour_zChart.'
    - name: Singularity.dFour_xChart_singular_iff
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.11, part 2 of the handbook. In a domain of any characteristic, the common zeros of z_1^2 + x y_1 (1 + y_1) and its partial derivatives are (0, 0, 0) and (0, -1, 0).'
    - name: Singularity.dFour_order_z
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.11, part 3 of the handbook, the order of z along E_0. On the strict transform, z y_1 (1 + y_1) = -z_1^3.'
    - name: Singularity.eSix_xChart_regular
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.12, part 2 of the handbook. In each commutative ring, z_1^2 + x + x^2 y_1^4, 1 + 2 x y_1^4 and 2 z_1 generate the unit ideal, so the x-chart is regular.'
    - name: Singularity.eSix_yChart_exceptional
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.12, part 2 of the handbook. On y = 0 in the y-chart, H = H_y = 0 gives x_1 = z_1 = 0.'
    - name: Singularity.eSix_complete_square
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.12, part 2 of the handbook. With iota^2 = -1, zeta^3 = 2 and 2 a unit, z_1^2 + y^2 + y x_1^3 = ab - c^6.'
    - name: Singularity.eSix_complete_square_inverse
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.12, part 2 of the handbook. The inverse of the change of coordinates to a, b, c.'
    - name: Singularity.eSix_exceptional_curve
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.12, part 2 of the handbook. On E_0, a = b = c^3.'
    - name: Singularity.eEight_xChart_regular
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.13, part 2 of the handbook. If 2 = 0, 3 = 0 or 5 = 0, then z_1^2 + x + x^3 y_1^5 and its partial derivatives generate the unit ideal, so the x-chart is regular.'
    - name: Singularity.eEight_yChart_exceptional
      kind: theorem
      status: proved
      note: 'Volume 4, Example 2.3.13, part 2 of the handbook. On y = 0 in the y-chart, the equation and its derivative in y vanish only at x_1 = z_1 = 0.'
    - name: Singularity.reynolds_mem
      kind: theorem
      status: proved
      note: 'Volume 8, Lemma 3.1.8 of the handbook. If |G| is a unit of B, the Reynolds operator sends B into the ring of invariants B^G.'
    - name: Singularity.reynolds_mul_of_mem
      kind: theorem
      status: proved
      note: 'Volume 8, Lemma 3.1.8 of the handbook. The Reynolds operator is B^G-linear: rho(a b) = a rho(b) for a in B^G.'
    - name: Singularity.reynolds_of_mem
      kind: theorem
      status: proved
      note: 'Volume 8, Lemma 3.1.8 of the handbook. rho(a) = a for a in B^G, so B^G is a direct summand of B.'
    - name: Singularity.comap_map_invariantSubring
      kind: theorem
      status: proved
      note: 'Volume 8, Lemma 3.1.8 of the handbook. If |G| is a unit of B, then I B meets B^G in I for each ideal I of B^G.'
    - name: Singularity.wildSigma_wildSigma
      kind: theorem
      status: proved
      note: 'Volume 8, Example 3.1.9 of the handbook. In characteristic 2, the map s to s, t to t + s of k[s, t] is an involution.'
    - name: Singularity.wildSigma_eq_self_iff
      kind: theorem
      status: proved
      note: 'Volume 8, Example 3.1.9 of the handbook. The invariants of the involution are k[s, n] with n = t (t + s).'
    - name: Singularity.exists_eq_add_mul_X_one
      kind: theorem
      status: proved
      note: 'Volume 8, Example 3.1.9 of the handbook. Each element of k[s, t] is a + b t with a, b in k[s, n].'
    - name: Singularity.eq_zero_of_add_mul_X_one_eq_zero
      kind: theorem
      status: proved
      note: 'Volume 8, Example 3.1.9 of the handbook. If a + b t = 0 with a, b in k[s, n], then a = b = 0.'
    - name: Singularity.exists_add_wildSigma_eq_iff
      kind: theorem
      status: proved
      note: 'Volume 8, Example 3.1.9 of the handbook. In characteristic 2, the image of the trace f to f + sigma(f) is s k[s, n].'
    - name: Singularity.traceToBase_algebraMap
      kind: theorem
      status: proved
      note: 'Used in Volume 8, Proposition 1.3.2 of the handbook. The trace of a in A is [L:K] a.'
    - name: Singularity.exists_leftInverse_algebraMap_of_isUnit_finrank
      kind: theorem
      status: proved
      note: 'Volume 8, Proposition 1.3.2 of the handbook, the affine case. If [L:K] is a unit of the normal domain A, and B is an A-subalgebra of L that is integral over A, then A to B has an A-linear left inverse. The gluing is not proved.'
    - name: Singularity.isIntegral_algEquiv_apply
      kind: theorem
      status: proved
      note: 'Volume 8, Proposition 3.1.4, part 1 of the handbook. A K-automorphism of L'' maps an element integral over A to an element integral over A.'
    - name: Singularity.mem_integralClosure_and_fixed_iff
      kind: theorem
      status: proved
      note: 'Volume 8, Proposition 3.1.4, part 2 of the handbook. The elements of the integral closure of A in L'' fixed by H are the elements of L''^H integral over A.'
    - name: Singularity.exists_algebraMap_eq_pow_of_isPurelyInseparable
      kind: theorem
      status: proved
      note: 'Volume 8, Proposition 3.1.4, part 3 of the handbook. If M/K is purely inseparable and b in M is integral over the normal domain A, then b^(q^n) is in A for some n.'
    - name: Singularity.eq_of_comap_eq_of_forall_exists_pow
      kind: theorem
      status: proved
      note: 'Used in Volume 8, Proposition 3.1.4, part 3 of the handbook. If each element of S has a positive power in the image of R, two primes of S over the same prime of R are equal.'
    - name: Singularity.eq_of_comap_eq_integralClosure
      kind: theorem
      status: proved
      note: 'Volume 8, Proposition 3.1.4, part 3 of the handbook. For M/K purely inseparable, Spec A_M to Spec A is injective. Surjectivity and the universal homeomorphism are not proved.'
