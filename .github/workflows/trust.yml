name: trust

# Replay each declaration of the two packages in the Lean kernel, in a fresh environment, with leanchecker of the toolchain. The replay covers the imports too: Mathlib, and for the base package the modules of resolutionorg/hironaka that it imports. leanchecker uses the kernel of Lean itself, so it finds an environment that a tactic or a metaprogram has changed, but it is not an independent kernel.
#
# The job lean4lean checks each declaration of the package Singularity again with lean4lean, a type checker for Lean written in Lean. It checks the declarations of each module and takes the imports of the module as correct, so it does not check Mathlib again. lean4lean follows the design of the C++ kernel, so it is a second implementation but not an independent design. This is check Q3 of spec 14.
#
# The job nanoda exports the declarations of the package Singularity with leanexport, together with all the declarations that they use, Mathlib included. nanoda, a type checker for Lean written in Rust, then checks the export. nanoda is built from a pinned commit of ammkrn/nanoda_lib. This is also check Q3.
#
# The job comparator runs `lake comparator --paranoid` with comparator.json. The challenge comparator/Challenge.lean states the proved theorems again from the files of Singularity/Statements/. The comparator checks that the theorems of the package have the same statements, use only propext, Quot.sound and Classical.choice, and are accepted by the kernel of Lean and by the checkers that the toolchain bundles: leanchecker-paranoid, lean4lean, nanoda, con-leche and con-ron. The comparator builds and exports the code in a bwrap sandbox. This is check Q4 of spec 14, and the second part of Q3. The job base runs the same check for the base package, with base/comparator.json.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: leanchecker --fresh Singularity
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: replay
        run: |
          start=$(date +%s)
          lake env leanchecker --fresh Singularity
          echo "the replay took $(( $(date +%s) - start )) s"

  base:
    name: leanchecker --fresh and lake comparator on SingularityBase
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: read the pin of the base
        id: pin
        run: |
          rev=$(grep -A3 'name = "hironaka"' lakefile.toml | sed -n 's/^rev = "\(.*\)"/\1/p')
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          mods=$(grep -h '^import Hironaka' SingularityBase/*.lean | sort -u | sha256sum | cut -c1-16)
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
      - name: restore the build of the base
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base/.lake/packages/hironaka/.lake/build
          key: hironaka-${{ steps.pin.outputs.rev }}-${{ hashFiles('lean-toolchain') }}-${{ steps.pin.outputs.mods }}
          restore-keys: hironaka-${{ steps.pin.outputs.rev }}-${{ hashFiles('lean-toolchain') }}
      - name: build
        run: |
          mapfile -t mods < <(grep -h '^import Hironaka' SingularityBase/*.lean | sed 's/^import //' | sort -u)
          lake build "${mods[@]}"
          lake build SingularityBase
      - name: replay
        run: |
          start=$(date +%s)
          lake env leanchecker --fresh SingularityBase
          echo "the replay took $(( $(date +%s) - start )) s"
      # The comparator of the base uses base/comparator.json and the challenge base/comparator/ChallengeBase.lean. See the job comparator for the sandbox.
      - name: install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true
      - name: compare
        run: |
          start=$(date +%s)
          lake comparator --paranoid
          echo "the comparator took $(( $(date +%s) - start )) s"

  lean4lean:
    name: lean4lean on the modules of Singularity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # The last commit of lean4lean on the toolchain v4.35.0 of this package.
      LEAN4LEAN_REV: b3ad4b39d94526395d2f39682208c7bd6fb0c1f3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: build lean4lean
        run: |
          git clone -q https://github.com/digama0/lean4lean "$RUNNER_TEMP/lean4lean"
          git -C "$RUNNER_TEMP/lean4lean" checkout -q "$LEAN4LEAN_REV"
          cd "$RUNNER_TEMP/lean4lean"
          lake build lean4lean
      - name: check
        run: |
          start=$(date +%s)
          mods=$( (echo Singularity; find Singularity -name '*.lean' | sed 's/\.lean$//; s#/#.#g') | sort)
          for m in $mods; do
            echo "== $m"
            lake env "$RUNNER_TEMP/lean4lean/.lake/build/bin/lean4lean" "$m"
          done
          echo "the check took $(( $(date +%s) - start )) s"

  nanoda:
    name: nanoda on the export of Singularity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # The head of the branch master of ammkrn/nanoda_lib on 2026-11-24, a merge of 2026-11-07. The toolchain v4.35.0 bundles the older commit 3a2407216ee84a75f9e1aead6803d0578be06ae7.
      NANODA_REV: 0da9f98feadd3a0a2ef4b3dbcf52a298a6fef929
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: build nanoda
        run: |
          git clone -q https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda_lib"
          git -C "$RUNNER_TEMP/nanoda_lib" checkout -q "$NANODA_REV"
          cd "$RUNNER_TEMP/nanoda_lib"
          cargo build --release --locked
      - name: export
        run: |
          start=$(date +%s)
          lake env lean --run scripts/Decls.lean Singularity > "$RUNNER_TEMP/decls.txt"
          mapfile -t decls < "$RUNNER_TEMP/decls.txt"
          lake env leanexport Singularity -- "${decls[@]}" > "$RUNNER_TEMP/export.ndjson"
          echo "the export has $(wc -l < "$RUNNER_TEMP/export.ndjson") lines and $(du -h "$RUNNER_TEMP/export.ndjson" | cut -f1)"
          echo "the export took $(( $(date +%s) - start )) s"
      - name: check
        run: |
          cat > "$RUNNER_TEMP/nanoda.json" <<EOF
          {
            "export_file_path": "$RUNNER_TEMP/export.ndjson",
            "use_stdin": false,
            "num_threads": 4,
            "permitted_axioms": ["propext", "Classical.choice", "Quot.sound"],
            "unpermitted_axiom_hard_error": true,
            "nat_extension": true,
            "string_extension": true,
            "print_axioms": true,
            "pp_to_stdout": true,
            "print_success_message": true
          }
          EOF
          start=$(date +%s)
          "$RUNNER_TEMP/nanoda_lib/target/release/nanoda_bin" "$RUNNER_TEMP/nanoda.json"
          echo "the check took $(( $(date +%s) - start )) s"

  comparator:
    name: lake comparator --paranoid against Singularity/Statements
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The comparator needs bwrap and user namespaces. Ubuntu 24.04 lets AppArmor block user namespaces for programs without a profile, so this step turns that restriction off on the runner.
      - name: install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true
      # The Mathlib cache writes lake-manifest.json, which the comparator needs. The comparator then builds Challenge and Singularity again in its sandbox.
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: compare
        run: |
          start=$(date +%s)
          lake comparator --paranoid
          echo "the comparator took $(( $(date +%s) - start )) s"
